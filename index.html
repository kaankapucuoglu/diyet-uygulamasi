<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16a36b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/diyet.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/diyet-192.png">
<link rel="apple-touch-icon" href="icons/diyet-apple-180.png">
<meta name="apple-mobile-web-app-title" content="Diyet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Diyet Listesi</title>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--line:#e4e9f1;--text:#172338;--muted:#718096;
  --blue:#2563eb;--blue-soft:#eaf1ff;--green:#16a36b;--green-soft:#e6f6ef;
  --red:#e05c63;--red-soft:#fdecee;--gold:#d48a1a;--gold-soft:#fdf3e2;--purple:#8b5cf6;
  --r:15px;--shadow:0 1px 2px rgba(23,35,56,.04),0 6px 18px rgba(23,35,56,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:Inter,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.4;-webkit-text-size-adjust:100%;touch-action:pan-y;
  padding:max(16px,env(safe-area-inset-top)) clamp(14px,2vw,40px) calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea,label{touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;font-size:16px;color:var(--text)}
mark{background:#fff1b8;color:inherit;border-radius:3px;padding:0 1px}
.wrap{max-width:1500px;margin:0 auto}
body.wiz-acik .wrap{display:none}

/* Başlık */
.top{margin-bottom:10px;display:flex;flex-direction:column}
.top .tarih-blok{order:2}
.top .sub{order:4}
.top-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;margin:4px 0 6px}
.top-row h1{margin:0;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.top-row .top-btns{margin-inline-start:auto}
.top-row.kirik .top-btns{margin-inline-start:0}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;margin-top:2px}
.sub{color:var(--muted);font-size:14px;line-height:1.9}
.sub .save-chip{margin:0;vertical-align:1px;line-height:1.4}
.saat{font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.hamile-btn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:#fdeef6;color:#b0306f;border:1px solid #f7c6de;vertical-align:1px;line-height:1.4}
.hamile-btn.on{background:#fff;color:var(--muted);border-color:var(--line)}
.hamile-btn[hidden]{display:none}
.top-btns{display:flex;gap:6px}
.tool-btn{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;min-width:0;height:46px;padding:0 16px;
  border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tool-btn span{font-size:17px;line-height:1}
.tool-btn small{font-size:13px;font-weight:700;color:#40506a;white-space:nowrap}
.tool-btn:active{transform:scale(.96)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.save-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);background:var(--green-soft);
  padding:3px 9px;border-radius:99px;margin-top:6px;font-weight:600}
.save-chip.warn{color:var(--red);background:var(--red-soft)}

/* Hafta ve gün seçimi */
.weeknav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;min-height:30px}
.weeknav .lbl{text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.weeknav .hafta-tag{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gunsatir{display:flex;align-items:stretch;gap:6px;margin-bottom:4px}
.tarih-blok{margin:2px 0 0}
.gunsatir .days{flex:1;min-width:0;margin:0}
.gunsatir .nav-btn{height:auto;width:36px;flex:none}
.nav-btn{width:38px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700}
.hafta-tag{background:var(--blue-soft);color:var(--blue)}
.frow em.uyg{color:var(--red);background:var(--red-soft)}
.today-btn{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:5px 10px;border-radius:9px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;min-width:0}
.day b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.weeknav .hafta-ok{display:none}
.hafta-tag .kisa{display:none}
.day span{display:block;font-size:11px;color:var(--muted)}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.day i.on{background:var(--green)}
.day.past{background:#f8fafc}
.day.today{border-color:var(--blue)}
.day.active{background:var(--blue);border-color:var(--blue);color:#fff}
.day.active span{color:#dbe6ff}
.day.active i.on{background:#fff}

/* Özet */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kcal-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kcal-big b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.kcal-big span{color:var(--muted);font-size:16px}
.kcal-big .tgt{font-size:18px}
.bar{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:6px;display:flex;position:relative}
.bar i{display:block;flex:none;height:100%;background:var(--blue);transition:width .3s}
.bar i.ok{border-radius:99px 0 0 99px}
.bar i.ok:last-of-type{border-radius:99px}
.bar i.over{background:var(--red)!important;border-radius:0 99px 99px 0}
.bar i.over.iyi{background:var(--green)!important}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#172338;opacity:.55}
.kalan{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;overflow-wrap:anywhere}
.kalan.asti{color:var(--red);font-weight:800}
.kalan.tamam{color:var(--green);font-weight:800}
.tgt{color:var(--text)!important;font-weight:800}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,100px),1fr));gap:10px;margin-top:14px}
.macro small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro b{font-size:17px}
.macro .hint{font-size:13px}
.macro.p .bar i.ok{background:var(--green)}
.macro.c .bar i.ok{background:var(--gold)}
.macro.s .bar i.ok{background:var(--purple)}
.macro.y .bar i.ok{background:#94a3b8}
.macro.l .bar i.ok{background:#16a34a}
.plan-box{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.plan-box h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,92px),1fr));gap:6px}
.plan-grid div{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-width:0}
.plan-grid small{display:block;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-grid b{font-size:15px}
.plan-grid span{font-size:11.5px;color:var(--muted)}
.plan-grid div.asti{background:var(--red-soft);border-color:#f5c2c6}
.plan-grid div.asti b{color:var(--red)}
.plan-grid div.tamam{background:var(--green-soft);border-color:#bfe8d4}
.plan-grid div.tamam b{color:var(--green)}

.water-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.water-head b{font-size:26px;font-weight:800}
.water-head span{color:var(--muted);font-size:14px}
.water-head .tgt{font-size:18px}
.glasses{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.glass{flex:1 1 0;min-width:16px;max-width:30px;height:34px;border:2px solid #bcd0f5;border-top:0;border-radius:0 0 9px 9px;position:relative;overflow:hidden;background:#fff}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#5b8ef5,#2563eb);transition:height .25s}
.glass.full::after{height:82%}
.glass.ekstra{border-color:#9fdcc1}
.glass.ekstra::after{background:linear-gradient(#5fd3a0,var(--green))}
.water-btns{display:flex;gap:8px}
.water-btns .btn{white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:5px 14px;border-radius:11px;text-align:center;line-height:1.25;
  font-weight:600;font-size:14px;background:var(--blue-soft);color:var(--blue)}
.btn.solid{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#f1f4f9;color:var(--text)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}

/* Geçmiş gün özeti */
.past-card{grid-column:1/-1}
.past-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px}
.past-head h3{margin:0;min-width:0}
/* Kullanım turu: hedef aydınlık, gerisi karartılmış; açıklama kartı hedefin altında/üstünde */
.tur{position:fixed;inset:0;z-index:70}
.tur-isik{position:fixed;border-radius:14px;box-shadow:0 0 0 2px #fff,0 0 0 9999px rgba(15,23,42,.62);transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tur-isik.bos{left:50%!important;top:50%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(15,23,42,.62)}
.tur-kart{position:fixed;background:var(--card);border-radius:16px;padding:14px 16px 12px;box-shadow:0 18px 50px rgba(15,23,42,.35);max-width:calc(100vw - 24px)}
.tur-kart.orta{left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 24px))}
.tur-kart small{font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.04em}
.tur-kart h3{font-size:17px;margin:4px 0 6px}
.tur-kart p{font-size:14.5px;line-height:1.5;color:var(--text)}
.tur-dug{display:flex;align-items:center;gap:6px;margin-top:12px}
.tur-dug span{flex:1}
.tur-dug .btn{min-height:40px;padding:0 12px;font-size:14px}
.tur-dug .btn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .tur-isik{transition:none} }
/* Yediklerimi paylaş düğmesi: kart başlığının en sağında */
/* Dar ekranda geçmiş gün başlığı tek satır kalsın: düğmede yalnız simge */
@media (max-width:440px){ .past-head .paylas-btn .lbl{display:none} .past-head .paylas-btn{padding:0 10px} }
.paylas-btn .mi{margin-inline-end:4px}
.past-head .paylas-btn .mi:only-child,.past-head .paylas-btn .lbl[hidden]{margin:0}
.kart-bas{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kart-bas h3{margin:0;flex:1;min-width:0}
.paylas-btn{min-height:32px;padding:0 12px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0;margin-inline-start:auto}
/* Paylaşılan gün: belge (A4) görünümü */
.rapor{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#e8ecf2;padding:12px 12px 32px}
body.rapor-acik{overflow:hidden}
.rapor-arac{position:sticky;top:0;z-index:1;display:flex;gap:8px;justify-content:center;max-width:794px;margin:0 auto 10px;padding:6px 0;background:#e8ecf2}
.rapor-arac .btn{flex:1;max-width:240px}
.rapor-sayfa{max-width:794px;margin:0 auto;background:#fff;color:#172338;border-radius:6px;box-shadow:0 6px 24px rgba(15,23,42,.14);padding:28px 30px}
.rp-bas{border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:14px}
.rp-bas small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.rp-bas h1{font-size:24px;margin:4px 0 2px}
.rp-bas p{color:var(--muted);font-size:14px}
.rp-ozet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.rp-kutu{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.rp-kutu small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.rp-kutu b{font-size:17px}
.rp-kutu span{font-size:12px;color:var(--muted)}
.rp-ogun{margin-bottom:16px;break-inside:avoid}
.rp-ogun h2{display:flex;align-items:baseline;gap:8px;font-size:16px;margin-bottom:6px}
.rp-ogun h2 em{margin-inline-start:auto;font-style:normal;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.rp-saat{color:var(--blue);font-variant-numeric:tabular-nums}
.rp-ogun table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.rp-ogun th{font-size:11px;color:var(--muted);font-weight:700;text-align:end;padding:5px 4px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-ogun th:first-child,.rp-ogun td:first-child{text-align:start;width:38%}
.rp-ogun td{padding:6px 4px;border-bottom:1px solid #f0f3f8;text-align:end;font-variant-numeric:tabular-nums;vertical-align:top}
.rp-ogun td b{display:block;font-weight:600;overflow-wrap:anywhere}
.rp-ogun td small{display:block;color:var(--muted);font-size:11.5px}
.rp-ogun tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
.rp-yenmeyen{font-size:13px;color:var(--muted);margin:4px 0 12px}
.rp-alt{border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--muted);text-align:center}
@media (max-width:600px){
  .rapor{padding:8px 6px 24px}
  .rapor-sayfa{padding:16px 12px}
  .rp-ozet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rp-ogun table{font-size:11.5px}
  .rp-ogun th{font-size:10px;padding:4px 2px}
  .rp-ogun td{padding:5px 2px}
  .rp-ogun th:first-child,.rp-ogun td:first-child{width:34%}
}
/* Dar ekranda tablo yerine satır: ad + miktar, altında "155 kcal · Protein 13 · …" (başlıklar kesilmesin) */
@media (max-width:480px){
  .rp-ogun thead{display:none}
  .rp-ogun table,.rp-ogun tbody,.rp-ogun tfoot,.rp-ogun tr{display:block;width:100%}
  .rp-ogun tr{padding:7px 2px;border-bottom:1px solid #f0f3f8}
  .rp-ogun td{display:inline;padding:0;border:0;text-align:start;width:auto!important}
  .rp-ogun td:first-child{display:block;margin-bottom:2px}
  .rp-ogun td:not(:first-child){font-size:12px;color:var(--muted)}
  .rp-ogun td:nth-child(2)::after{content:"\00a0" attr(data-l)}
  .rp-ogun td:nth-child(n+3)::before{content:" ·\00a0" attr(data-l) "\00a0"}
  .rp-ogun tfoot tr{border-top:1px solid var(--line);border-bottom:0}
  .rp-ogun tfoot td{border-top:0}
  .rp-ogun tfoot td:not(:first-child){color:var(--text);font-weight:700}
}
@page{size:A4;margin:12mm}
@media print{
  body.rapor-acik > *:not(#rapor){display:none!important}
  body.rapor-acik{overflow:visible;background:#fff}
  .rapor{position:static;overflow:visible;background:#fff;padding:0}
  .rapor-arac{display:none}
  .rapor-sayfa{box-shadow:none;border-radius:0;max-width:none;padding:0}
  .rp-ozet{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.stat.asti{background:var(--red-soft);border-color:#f5c2c6}
.stat.asti b{color:var(--red)}
.stat.tamam{background:var(--green-soft);border-color:#bfe8d4}
.stat.tamam b{color:var(--green)}
.stat.water{background:var(--blue-soft);border-color:#d3e1fd}
.stat.hl{background:var(--green-soft);border-color:#bfe8d4}
.stat-acts{display:flex;align-items:center;gap:4px;margin-top:6px}
.stat-acts span{flex:1;min-width:0;text-align:center;white-space:nowrap;font-size:12.5px}
.stat-acts button{flex:none}
.stat-acts button{width:28px;height:30px;border-radius:8px;background:#fff;border:1px solid #d3e1fd;font-weight:800;color:var(--blue)}
.eaten-list{font-size:13.5px;color:#40506a;margin-top:12px;line-height:1.6}
.eaten-list b{color:var(--text)}

/* Öğünler */
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:14px}
.meals:empty{display:none}
.meal{padding:0;overflow:hidden;transition:border-color .2s}
.meal.eaten{border-color:#9fdcc1}
.meal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.meal.eaten .meal-head{background:var(--green-soft)}
.meal-ico{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.meal-title{flex:1;min-width:0}
.meal-title b{display:block;font-size:16px;overflow-wrap:anywhere}
/* Öğün alt satırı: saat · kalori · besinler; sığmayan değer alt satıra iner (üst üste binmez, kutudan taşmaz) */
.meal-title .ogun-alt{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;row-gap:1px;min-width:0;font-size:13px;color:var(--muted)}
.ogun-alt > i{font-style:normal;white-space:nowrap}
/* Telefonda öğün başlığı: ad + düğmeler üst satırda yan yana, saat/kalori satırı altta tam genişlikte */
@media (max-width:600px){
  .meal-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:8px;row-gap:2px;padding:12px 14px}
  .meal-title{display:contents}
  .meal-ico{grid-row:1;align-self:center;width:34px;height:34px;font-size:17px}
  .meal-title b{grid-column:2;grid-row:1;align-self:center}
  .meal-title .ogun-alt{grid-column:1/-1;grid-row:2;margin-top:4px;font-size:12px;column-gap:3px;letter-spacing:-.01em}
  .ogun-alt .saat-btn{font-size:12.5px;padding-inline-end:1px}
  .meal-head .eat-btn{grid-column:3;grid-row:1}
  .meal-head .tog-btn{grid-column:4;grid-row:1}
}
.eat-btn{min-height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px;background:#f1f4f9;color:var(--muted);flex-shrink:0;white-space:nowrap}
.meal.eaten .eat-btn{background:var(--green);color:#fff}
.items{list-style:none}
.item{padding:12px 16px;border-bottom:1px solid #f0f3f8}
.item-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item-info{flex:1;min-width:0}
.item-info b{font-size:15px;display:block;overflow-wrap:anywhere}
.item-info small{font-size:12.5px;color:var(--muted)}
.gram{display:flex;align-items:center;gap:5px;flex-shrink:0}
.gram .val{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fafbfd;height:34px}
.gram input{width:40px;border:0;background:transparent;text-align:end;padding:7px 1px;outline:none;font-weight:700}
.gram span{font-size:12.5px;color:var(--muted);padding-inline:3px 7px}
.adim{width:34px;height:34px;border-radius:9px;font-size:18px;font-weight:700;color:var(--blue);background:var(--blue-soft);flex-shrink:0;touch-action:manipulation}
.adim:active{background:#d6e4ff}
.item{container-type:inline-size}
.item-ctl{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:8px}
.item-ctl .gram{flex:1 1 170px;max-width:300px}
.item-ctl .gram .val{flex:1;min-width:0}
.item-ctl .gram input{flex:1;min-width:34px}
.item-acts{display:flex;gap:6px;flex:1 1 120px}
.item-acts .mini{flex:1 1 0}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:34px;font-size:12.5px;font-weight:600;padding:0 9px;border-radius:8px;background:#f1f4f9;color:#40506a;white-space:nowrap}
.mini .mi{font-size:14px;line-height:1}
/* Kart daralınca (telefon, yakınlaştırma) düğmeler yalnız simge: miktar ve düğmeler aynı satırda kalır */
@container (max-width: 340px){ .item-ctl{gap:6px} .item-ctl .gram{gap:3px} .item-ctl .gram .adim,.item-acts .mini{width:32px;min-width:32px;height:34px} .item-ctl .gram .val{height:34px} .item-ctl .gram input{min-width:24px} .gram span{padding-inline:2px 5px} .item-acts{gap:4px} }
@container (max-width: 420px){ .item-acts .mini .lbl{display:none} .item-acts .mini{min-width:36px;padding:0} .item-ctl{flex-wrap:nowrap} .item-ctl .gram{flex:1.4 1 0;max-width:none} .item-acts{flex:1 1 0} }
.mini.cmp{background:var(--blue-soft);color:var(--blue)}
.mini.del{background:var(--red-soft);color:var(--red)}
.empty{padding:16px;color:var(--muted);font-size:14px;list-style:none}
.add-food{width:100%;padding:13px;font-weight:700;font-size:14px;color:var(--blue);border-top:1px dashed var(--line)}
.add-food:active{background:var(--blue-soft)}

/* Loglar */
.log-card{margin-top:16px}
.log-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.log-head h3{margin:0;flex:1}
.logs{list-style:none}
.log{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f8;font-size:13.5px;align-items:flex-start}
.log:last-child{border-bottom:0}
.log time{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums;min-width:74px}
.log-body{flex:1;min-width:0;overflow-wrap:anywhere}
.lb{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-inline-end:4px;vertical-align:1px}
.lb.ekle,.lb.yedim{background:var(--green-soft);color:var(--green)}
.lb.sil{background:var(--red-soft);color:var(--red)}
.lb.degis,.lb.gram{background:var(--blue-soft);color:var(--blue)}
.lb.su{background:#e0f2fe;color:#0284c7}
.lb.diger{background:#f1f4f9;color:#40506a}
.lb.gecmis{background:var(--gold-soft);color:var(--gold)}

/* Fark rozetleri ve kıyas */
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pl{font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{background:var(--green-soft);color:var(--green)}
.bad{background:var(--red-soft);color:var(--red)}
.eq{background:#f1f4f9;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:8px 0 2px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.kiyas{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.cmp-top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.cmp-top div{min-width:0}
.cmp-top small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmp-top b{display:block;font-size:14px;overflow-wrap:anywhere}
.cmp-top span{font-size:12.5px;color:var(--muted)}
.cmp-top .arrow{font-size:18px;color:var(--muted)}
.cmp-top div:last-child{text-align:end}
.verdict{padding:10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.verdict .g{color:var(--green);font-weight:700}
.verdict .r{color:var(--red);font-weight:700}
.grp h4{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px 4px;color:var(--muted)}
.grp.good h4{color:var(--green)}
.grp.limit h4{color:var(--red)}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px 12px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.crow > :not(:first-child){text-align:end}
.crow.head{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:4px;padding-bottom:4px;border-bottom:1px solid #f0f3f8}
.crow .pl{font-size:13px;padding:3px 7px;justify-self:end}
.crow em{font-style:normal;color:var(--muted);font-weight:600}

/* Pencere (telefonda alttan açılır) */
.overlay{position:fixed;inset:0;top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100%);background:rgba(15,23,42,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.overlay{overscroll-behavior:contain}
/* Pencereler yalnız dikey hareket eder: alttan yukarı açılır, yatay kayma yok */
html,body{overflow-x:clip}
.overlay.open .sheet{animation:alttan .22s ease-out}
.wiz:not([hidden]){animation:alttan .22s ease-out}
@keyframes alttan{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.field input,.field textarea{min-width:0;max-width:100%}
.field input[type=time]{-webkit-appearance:none;appearance:none;padding-inline:8px}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.ayar-ust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ayar-ust .btn{padding:4px;gap:4px;font-size:13px;letter-spacing:-.01em}
@media (max-width:400px){ .ayar-ust .btn{font-size:12.5px} }
.ikili{display:flex;align-items:center;gap:4px}
.ikili input{flex:1;min-width:0}
.ikili b{color:var(--muted)}
.ikili{gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 2px}
.field .ikili input{border:0;border-radius:0;padding:9px 0;text-align:center;letter-spacing:-.02em;background:transparent}
@media (max-width:600px){ .grid3 input[type=time]::-webkit-calendar-picker-indicator{display:none} .grid3 input[type=time]{text-align:center;padding-inline:4px} }
.ikili #p_su{flex:1.35}
.ikili b{flex:none}
.sub .hedef-yazi::after{content:" ·"}
.tarti-kart{grid-column:1/-1;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-color:#f5dfb0;background:#fffaf0}
.tarti-kart.girildi{border-color:#bfe8d4;background:var(--green-soft)}
.tarti-bas{flex:1 1 180px;min-width:0}
.tarti-bas b{display:block;font-size:15px}
.tarti-bas small{font-size:12.5px;color:var(--muted)}
.tarti-gir{display:flex;gap:8px;align-items:center}
.tarti-gir .val{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;height:42px;padding-inline:10px 8px}
.tarti-gir input{width:56px;border:0;outline:none;text-align:end;font-weight:800;font-size:17px;background:transparent}
.tarti-gir .val span{color:var(--muted);font-size:13px;margin-inline-start:3px}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:86vh;max-height:86dvh;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.25)}
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-head h2{font-size:17px;flex:1;min-width:0}
/* Pencere içinden açılan pencere: sol üstte önceki pencereye dönüş */
.geri-btn{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 12px 0 8px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;flex-shrink:0}
.geri-btn[hidden]{display:none}
.geri-btn .ok{font-size:24px;line-height:1;margin-top:-3px}
[dir=rtl] .geri-btn .ok{transform:scaleX(-1)}
.sheet-body{padding:14px 16px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cur{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.cur small{color:var(--muted);font-size:12px;display:block}
.cur b{font-size:15px}
.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;background:#fafbfd}
.search:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;background:#f1f4f9;font-weight:600;color:#40506a}
.chip.on{background:var(--blue);color:#fff}
.chip.recent{background:var(--gold-soft);color:var(--gold)}
.chip.recent.on{background:var(--gold);color:#fff}
a.btn{text-decoration:none}
.onay-metin{font-size:15px;line-height:1.55;margin:0 0 6px}
.uyari{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
.uyari h4{font-size:14.5px;margin-bottom:4px}
.uyari p{font-size:13.5px;line-height:1.55;color:#40506a}
.sayfalar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted);font-weight:600}
.al-sonuc{display:flex;flex-wrap:wrap;gap:6px;max-height:max(200px,calc(var(--vv-h,100vh) - 290px));overflow-y:auto;padding:2px}
.al-chip{font-size:13.5px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;color:#40506a}
.al-chip.on{background:var(--red-soft);border-color:#f5c2c6;color:#b4232c}
.al-etiketler{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.more{background:transparent;color:var(--blue);border:1px dashed #b9cdf6}
body.klavye .overlay{padding:0;align-items:flex-start}
body.klavye .sheet{max-height:100%!important;height:100%;border-radius:0}
body.klavye .sheet:has(#ara) .cur,body.klavye .sheet:has(#ara) .legend,body.klavye .sheet:has(#ara) #sbody > .hint{display:none}
body.klavye .sheet-head{padding-top:8px;padding-bottom:6px}
.flist{list-style:none}
.frow{display:block;width:100%;text-align:start;padding:10px 4px;border-bottom:1px solid #f0f3f8}
.frow:active{background:#f7f9fc}
.frow b{font-size:15px;display:block}
.frow b em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 6px;border-radius:6px;margin-inline-start:6px}
.frow small{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.found{font-size:12.5px;color:var(--muted);margin:2px 0 4px}
.det-name{font-size:19px;font-weight:800;margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:22px;font-weight:700;flex-shrink:0}
.stepper input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:700;font-size:18px;outline:none}
.hint{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1 1 140px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.tip{font-size:13px;color:#40506a;background:var(--gold-soft);border-radius:10px;padding:10px 12px;line-height:1.5}
.hrow{display:block;width:100%;text-align:start;padding:12px 4px;border-bottom:1px solid #f0f3f8}
.hrow b{font-size:15px}
.hrow small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
body.klavye .toast{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:#172338;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px}

/* Öğün gizle / göster, saat düğmesi */
.ogun-arac{display:flex;justify-content:flex-end;margin:0 0 10px}
.ogun-arac:empty{display:none}
.meals{overflow-anchor:none;align-content:start}
.dil-ac{justify-content:space-between}
.dil-ac i{font-style:normal;opacity:.6}
#dilListe{margin-top:8px}
.tog-all{min-height:36px;font-size:13px;font-weight:700}
.meal{container-type:inline-size}
.meal.kapali .items,.meal.kapali .add-food,.meal.kapali .ogun-not{display:none}
.meal.kapali .meal-head{border-bottom:0}
.tog-btn{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 10px;border-radius:10px;font-weight:700;font-size:12.5px;background:var(--blue-soft);color:var(--blue);flex-shrink:0;white-space:nowrap}
.tog-btn i{font-style:normal;font-size:19px;line-height:1}
@container (max-width:400px){ .tog-btn .lbl{display:none} .tog-btn{width:38px;justify-content:center;padding:0} }
.saat-btn{display:inline-flex;align-items:center;gap:3px;font:inherit;font-size:13px;color:var(--blue);font-weight:700;padding:0 4px 0 0;border-radius:6px}
.saat-btn::after{content:"✎";font-size:11px;opacity:.55}
.saat-btn:hover{background:var(--blue-soft)}
.ogun-not{font-size:13px;color:#8a5a0c;background:var(--gold-soft);padding:8px 16px;border-bottom:1px solid #f0f3f8}
.saat-in{font-size:22px;font-weight:800;text-align:center;height:56px}
.tool-btn.destek{background:#fff8e8;border-color:#f5dfb0}
.tool-btn.destek small{color:#8a5a0c}
/* Destek düğmesi ara sıra hafifçe titrer (destek olana ve hareket azaltma açıkken titremez) */
.tool-btn.destek.titre{animation:titre 8s ease-in-out 4s infinite}
@keyframes titre{0%,86%,100%{transform:none}88%{transform:rotate(-5deg) scale(1.05)}90%{transform:rotate(5deg) scale(1.05)}92%{transform:rotate(-4deg) scale(1.03)}94%{transform:rotate(3deg)}96%{transform:rotate(-1deg)}98%{transform:none}}
@media (prefers-reduced-motion:reduce){ .tool-btn.destek.titre{animation:none} }
/* Destek */
.kopya-satir{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fbfcfe}
.kopya-satir div{flex:1;min-width:0}
.kopya-satir small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.kopya-satir b{font-size:15px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
/* Program bandı, uygulama yükle bandı */
.prog-bant{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid #cfe9dc;border-inline-start:4px solid var(--green);border-radius:14px;padding:10px 14px;margin:0 0 12px;box-shadow:var(--shadow)}
.prog-bant > div{flex:1 1 240px;min-width:0}
.prog-bant p{font-size:13px;color:#40506a;margin-top:3px;overflow-wrap:anywhere}
.prog-bant .btn{min-height:36px;font-size:13px}
.adimlar{padding-inline-start:22px;line-height:1.7;font-size:15px}
/* Program hazırlama ekranı */
.koc-in{max-width:980px}
.koc .card{margin-bottom:4px}
.koc textarea,.koc-not{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;resize:vertical;color:var(--text);background:#fff}
.koc-not{border:0;border-top:1px dashed var(--line);border-radius:0;padding:10px 16px;font-size:13.5px;background:#fffdf6}
.koc .field input[type=time],.field input[type=time]{min-height:40px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 10px}
.grid2,.grid3,.grid4{align-items:end}
.koc-check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:4px}
.koc-check input{width:20px;height:20px}
.koc-days{margin-bottom:8px}
.koc-days .day{padding:10px 2px 8px}
.koc-gun-arac{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.koc-gun-bas{font-size:18px;margin:6px 0 10px}
.link-alan{width:100%;font:12.5px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0 4px;resize:none;background:#f7f9fc;color:#40506a}
.koc-nav .btn.ghost{flex:1}
.link-yapistir{display:flex;gap:8px;margin-top:6px}
.link-yapistir .search{flex:1;min-width:0}
.link-yapistir .btn{flex:none}
.tasi-kutu{display:block;margin-top:8px;min-height:74px;resize:none;font-size:16px;line-height:1.35;word-break:break-all;font-family:inherit}
.tasi-neden{font-size:14px;line-height:1.5;color:#40506a}
.tasi-yer{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:700}
.tasi-blok{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;background:var(--card)}
.tasi-blok h4{font-size:16px;margin:0 0 4px}
.tasi-blok p{font-size:13.5px;line-height:1.5;color:#40506a;margin:0 0 10px}
.tasi-ozet{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.tasi-ek{margin-top:8px}
.tasi-elle{margin-top:10px}
.tasi-elle summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.saat-liste{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.saat-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid #f0f3f8}
.saat-satir:last-child{border-bottom:0}
.saat-satir label{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;min-width:0;flex:1}
.saat-satir.ara label{font-weight:600;color:#40506a;font-size:14.5px}
.saat-satir input{flex:none;width:104px;height:44px;border:1px solid #d3e1fd;border-radius:11px;font-size:18px;font-weight:800;text-align:center;background:var(--blue-soft);color:var(--blue);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;padding:0 6px;cursor:pointer}
.saat-satir input::-webkit-calendar-picker-indicator{display:none}
.saat-ek{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;font-size:14px;font-weight:600;color:var(--blue);border-bottom:1px solid #f0f3f8;text-align:start;background:#fafcff}
.saat-ek .kutu{width:22px;height:22px;border:2px solid #bcd0f5;border-radius:6px;display:grid;place-items:center;font-size:13px;flex:none;background:#fff}
.saat-ek.on .kutu{background:var(--blue);border-color:var(--blue);color:#fff}
.saat-onizle{list-style:none;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.saat-onizle li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f3f8;font-size:14.5px}
.saat-onizle li:last-child{border-bottom:0}
.saat-onizle b{font-variant-numeric:tabular-nums}
.saat-onizle li.ara{color:var(--muted)}

/* Kurulum sihirbazı */
.wiz{position:fixed;inset:0;top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100%);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(1200px 500px at 50% -10%,#dfe9ff 0%,var(--bg) 60%);padding:max(16px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.wiz[hidden]{display:none}
.wiz-in{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wiz-brand{font-weight:800;font-size:15px}
.wiz-step{font-size:12.5px;color:var(--muted);font-weight:700}
.wiz-bar{height:6px;background:#e3e9f3;border-radius:99px;overflow:hidden;margin-bottom:22px}
.wiz-bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.wiz h2{font-size:clamp(22px,4.5vw,28px);font-weight:800;letter-spacing:-.02em}
.wiz-sub{color:var(--muted);font-size:14.5px;margin:4px 0 18px}
.wiz-body{flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;min-height:62px;position:relative}
.opt .ic{font-size:25px;line-height:1;flex-shrink:0;width:40px;text-align:center}
.opt .ic.kod{font-size:14px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:9px;height:34px;display:grid;place-items:center}
.opt b{display:block;font-size:15.5px}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt.on::after{content:"✓";position:absolute;top:8px;inset-inline-end:10px;font-weight:900;color:var(--blue)}
.opt:disabled{opacity:.45}
.wfield{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.wfield label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.wfield .stepper{margin:0}
.wname{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;font-weight:600;outline:none}
.wname:focus{border-color:var(--blue)}
.wsec{font-size:13px;font-weight:800;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.wmsg{font-size:13.5px;border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5}
.wmsg.err{background:var(--red-soft);color:#b4232c}
.wmsg.warn{background:var(--gold-soft);color:#8a5a0c}
.wmsg.info{background:var(--blue-soft);color:#1e40af}
body.klavye .wnav{position:static;box-shadow:none}
.wnav{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 4px;margin-top:18px;background:var(--bg);box-shadow:0 -10px 14px -10px rgba(23,35,56,.18)}
.wnav .btn{flex:1;min-height:50px;font-size:16px;font-weight:700}
.wnav .btn.ghost{flex:0 0 auto;padding:0 20px}
details.method{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.method summary{cursor:pointer;font-weight:700;font-size:14px}
details.method ul{margin:8px 0 0;padding-inline-start:18px;font-size:13px;color:#40506a;line-height:1.55}

@media (max-width:600px){
  .top{gap:6px}
  .top-row{gap:10px}
  .top-row .top-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin-inline-start:0}
  .tool-btn{flex-direction:column;justify-content:flex-start;gap:3px;height:60px;padding:9px 4px 0}
  .tool-btn small{font-size:12px;white-space:normal;line-height:1.15;text-align:center;overflow:visible}
  .overlay{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:90vh;max-height:90dvh;padding-bottom:env(safe-area-inset-bottom)}
  .day b{font-size:13px}
  .day span{font-size:10px}
  .kcal-big b{font-size:26px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log time{min-width:0}
  .gram .adim{width:38px;height:38px}
  .gram .val{height:38px}
  .mini{height:38px}
  .grid4{grid-template-columns:1fr 1fr}
  .koc-nav .btn{font-size:14px;padding:0 10px}
}
/* Telefon ve tablet: selamın hemen altında tarih seçici, sonra araç düğmeleri */
@media (max-width:1180px){
  .top-row{display:contents}
  .top-row h1{order:1;margin:0}
  .top-row .top-btns{order:3;margin:0}
}
/* Tablet: 4 araç düğmesi tek sırada eşit genişlikte (simge üstte, yazı altta) */
@media (min-width:601px) and (max-width:1180px){
  .top-row .top-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin-inline-start:0}
  .tool-btn{flex-direction:column;justify-content:flex-start;gap:3px;height:60px;padding:10px 4px 0}
  .tool-btn small{white-space:normal;line-height:1.15;text-align:center;font-size:12.5px}
}
.koc-nav{flex-wrap:wrap;position:static;box-shadow:none}
@media (max-width:600px){ .koc-nav .btn.green{flex:1 1 100%;order:-1} }
@media (max-width:600px){ .macros{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 10px} .macro b{font-size:16px} .macro .hint{font-size:12px} .water-card{padding:12px 14px} .water-card h3{margin-bottom:4px} .water-head b{font-size:22px} .water-btns .btn{min-height:40px} }
@media (max-width:600px){ .gunsatir .nav-btn{display:none} .gunsatir .days{gap:4px} .weeknav{gap:8px} .weeknav .hafta-ok{display:block;width:34px;height:30px;font-size:16px} .hafta-tag .uzun{display:none} .hafta-tag .kisa{display:inline} .stat-acts button{width:28px} .day{padding:7px 0 5px} .day b{font-size:13.5px;letter-spacing:-.01em} .water-btns .btn{font-size:13.5px;padding:5px 10px} }
@media (max-width:360px){ .days{gap:4px} .day{padding:7px 0 5px} .macros{gap:6px} .crow{font-size:13px} }

    "Bazal metabolizma: Mifflin-St Jeor denklemi (Amerikan Beslenme ve Diyetetik Akademisi’nin önerdiği, en isabetli formül).|Günlük harcama: FAO/WHO aktivite katsayıları (1,2–1,9).|Kilo verme: haftada 0,25–0,75 kg (1 kg yağ ≈ 7700 kcal); açık en fazla %25, alt sınır kadında 1200, erkekte 1500 kcal.|Kas kazanma %10, kilo alma %15 kalori fazlasıyla.|Protein: ISSN önerisi, hedefe göre 1,2–2,0 g/kg (VKİ 25 üstündeyse ideal kiloya göre).|Yağ kalorinin %28’i (kan şekeri hedefinde %30), karbonhidrat kalan kısım (IOM AMDR aralıkları).|Şeker DSÖ önerisi doğrultusunda sınırlı: doğal şeker dahil kalorinin %13’ü (kan şekeri hedefinde %10).|Lif: 1000 kcal başına 14 g. Su: kg başına 35 ml (+500 ml hareketliyse). VKİ sınıfları: DSÖ.",
    "Basal metabolic rate: Mifflin-St Jeor equation (the most accurate formula, recommended by the Academy of Nutrition and Dietetics).|Daily energy use: FAO/WHO activity factors (1.2–1.9).|Weight loss: 0.25–0.75 kg per week (1 kg fat ≈ 7700 kcal); deficit at most 25%, floor 1200 kcal for women, 1500 kcal for men.|Muscle gain +10%, weight gain +15% calories.|Protein: ISSN guidance, 1.2–2.0 g/kg depending on the goal (ideal weight used if BMI > 25).|Fat 28% of calories (30% for blood sugar), carbohydrates the rest (IOM AMDR ranges).|Sugar limited in line with WHO: 13% of calories incl. natural sugars (10% for blood sugar).|Fiber: 14 g per 1000 kcal. Water: 35 ml per kg (+500 ml if active). BMI classes: WHO.",
    "Базальный обмен: формула Миффлина — Сан Жеора (самая точная, рекомендована Академией питания и диетологии США).|Суточный расход: коэффициенты активности ФАО/ВОЗ (1,2–1,9).|Похудение: 0,25–0,75 кг в неделю (1 кг жира ≈ 7700 ккал); дефицит не более 25%, минимум 1200 ккал для женщин и 1500 для мужчин.|Набор мышц +10%, набор веса +15% калорий.|Белок: по рекомендациям ISSN, 1,2–2,0 г/кг в зависимости от цели (при ИМТ > 25 — на идеальный вес).|Жиры 28% калорий (30% при контроле сахара), углеводы — остальное (диапазоны AMDR).|Сахар ограничен по рекомендации ВОЗ: 13% калорий с учётом натурального (10% при контроле сахара).|Клетчатка: 14 г на 1000 ккал. Вода: 35 мл на кг (+500 мл при активности). Классы ИМТ: ВОЗ.",
    "Grundumsatz: Mifflin-St-Jeor-Formel (die genaueste, empfohlen von der Academy of Nutrition and Dietetics).|Tagesbedarf: FAO/WHO-Aktivitätsfaktoren (1,2–1,9).|Abnehmen: 0,25–0,75 kg pro Woche (1 kg Fett ≈ 7700 kcal); Defizit höchstens 25 %, Untergrenze 1200 kcal für Frauen, 1500 kcal für Männer.|Muskelaufbau +10 %, Zunehmen +15 % Kalorien.|Eiweiß: nach ISSN 1,2–2,0 g/kg je nach Ziel (bei BMI > 25 auf Idealgewicht bezogen).|Fett 28 % der Kalorien (30 % bei Blutzucker-Ziel), Kohlenhydrate der Rest (AMDR-Bereiche).|Zucker nach WHO begrenzt: 13 % der Kalorien inkl. natürlichem Zucker (10 % bei Blutzucker-Ziel).|Ballaststoffe: 14 g pro 1000 kcal. Wasser: 35 ml pro kg (+500 ml wenn aktiv). BMI-Klassen: WHO.",
    "معدل الأيض الأساسي: معادلة ميفلين-سانت جيور (الأدق، وتوصي بها أكاديمية التغذية وعلم الحميات الأمريكية).|الاستهلاك اليومي: معاملات النشاط لمنظمة الأغذية والزراعة ومنظمة الصحة العالمية (1.2–1.9).|إنقاص الوزن: 0.25–0.75 كغ أسبوعياً (1 كغ دهون ≈ 7700 سعرة)؛ العجز 25% كحد أقصى، والحد الأدنى 1200 سعرة للنساء و1500 للرجال.|بناء العضلات +10%، زيادة الوزن +15% من السعرات.|البروتين: وفق توصيات ISSN بين 1.2 و2.0 غ/كغ حسب الهدف (حسب الوزن المثالي إذا تجاوز المؤشر 25).|الدهون 28% من السعرات (30% لهدف سكر الدم) والكربوهيدرات الباقي (نطاقات AMDR).|السكر محدود وفق منظمة الصحة العالمية: 13% من السعرات مع السكر الطبيعي (10% لهدف سكر الدم).|الألياف: 14 غ لكل 1000 سعرة. الماء: 35 مل لكل كغ (+500 مل للنشطين). تصنيف المؤشر: منظمة الصحة العالمية."

  od_tansiyon:["Tuz günde 5 g altı (DSÖ); tuzlu peynir, zeytin, konserve, ayran yerine az tuzlu seçenekler.","Salt under 5 g a day (WHO); low-salt swaps for salty cheese, olives, canned food, ayran.","Соль менее 5 г в день (ВОЗ); вместо солёного сыра, оливок, консервов — менее солёное.","Salz unter 5 g pro Tag (WHO); salzarme Alternativen statt Salzkäse, Oliven, Konserven.","الملح أقل من 5 غ يومياً (منظمة الصحة العالمية)؛ بدائل قليلة الملح للجبن المالح والزيتون والمعلبات."],

  od_kolesterol:["Doymuş yağ sınırlı; kaşar, köfte, kızartma yerine balık, tavuk, baklagil; lif en az 30 g.","Less saturated fat; fish, chicken, legumes instead of hard cheese, meatballs, fried food; fiber 30 g+.","Меньше насыщенных жиров: рыба, курица, бобовые вместо твёрдого сыра, котлет, жареного; клетчатка от 30 г.","Weniger gesättigte Fette: Fisch, Huhn, Hülsenfrüchte statt Hartkäse, Frikadellen, Frittiertem; Ballaststoffe ab 30 g.","دهون مشبعة أقل: سمك ودجاج وبقوليات بدل الجبن الصلب والكفتة والمقليات؛ ألياف 30 غ على الأقل."],
  odakLbl:["Sağlık odağı","Health focus","Здоровье","Gesundheitsfokus","التركيز الصحي"],
  methodOdak:["Kan şekeri: ADA önerileri doğrultusunda düşük şeker ve tam tahıl. Tansiyon: DSÖ tuz < 5 g/gün, DASH yaklaşımı. Kolesterol: doymuş yağ < kalorinin %10’u (DSÖ/AHA), lif ≥ 30 g.","Blood sugar: low sugar and whole grains in line with ADA guidance. Blood pressure: WHO salt < 5 g/day, DASH approach. Cholesterol: saturated fat < 10% of calories (WHO/AHA), fiber ≥ 30 g.","Сахар: мало сахара и цельные злаки по рекомендациям ADA. Давление: соль < 5 г/день (ВОЗ), подход DASH. Холестерин: насыщенные жиры < 10% калорий (ВОЗ/AHA), клетчатка ≥ 30 г.","Blutzucker: wenig Zucker und Vollkorn nach ADA-Empfehlungen. Blutdruck: Salz < 5 g/Tag (WHO), DASH-Ansatz. Cholesterin: gesättigte Fette < 10 % der Kalorien (WHO/AHA), Ballaststoffe ≥ 30 g.","سكر الدم: سكر قليل وحبوب كاملة وفق توصيات ADA. ضغط الدم: ملح أقل من 5 غ يومياً (منظمة الصحة العالمية) ونهج DASH. الكوليسترول: دهون مشبعة أقل من 10% من السعرات (منظمة الصحة العالمية/AHA)، ألياف 30 غ على الأقل."],

  fbTitle:["✉️ Öneri ve şikâyetleriniz","✉️ Suggestions & feedback","✉️ Предложения и отзывы","✉️ Vorschläge & Feedback","✉️ الاقتراحات والملاحظات"],
  fbText:["Uygulamayla ilgili önerilerinizi, şikâyetlerinizi ya da hata bildirimlerinizi bize yazın. Mesajınızı okuyup dönüş yapacağız.","Send us your suggestions, complaints or bug reports about the app. We read every message and will get back to you.","Напишите нам предложения, жалобы или сообщения об ошибках. Мы читаем каждое письмо и ответим вам.","Schreib uns Vorschläge, Beschwerden oder Fehlermeldungen zur App. Wir lesen jede Nachricht und melden uns.","أرسل لنا اقتراحاتك أو شكاواك أو بلاغات الأخطاء. نقرأ كل رسالة وسنرد عليك."],

  // Uyarılar
  warnTitle:["⚠️ Önemli uyarılar","⚠️ Important notices","⚠️ Важная информация","⚠️ Wichtige Hinweise","⚠️ تنبيهات مهمة"],
  wGenelT:["Öneriler tahminidir","Suggestions are estimates","Рекомендации приблизительны","Empfehlungen sind Schätzungen","الاقتراحات تقديرية"],
  wGenel:["Bu uygulamadaki kalori ve besin değerleri, internette yayımlanan ortalama gıda verilerine ve uluslararası beslenme kılavuzlarına dayanan tahminlerdir. Gerçek değerler ürüne, markaya, porsiyona ve pişirme şekline göre değişir.","Calorie and nutrient values in this app are estimates based on average food data published online and international nutrition guidelines. Real values vary by product, brand, portion and cooking method.","Калорийность и пищевая ценность в приложении — приблизительные данные из открытых источников и международных рекомендаций. Реальные значения зависят от продукта, марки, порции и способа приготовления.","Kalorien- und Nährwerte in dieser App sind Schätzungen auf Basis öffentlich verfügbarer Durchschnittswerte und internationaler Ernährungsrichtlinien. Tatsächliche Werte hängen von Produkt, Marke, Portion und Zubereitung ab.","قيم السعرات والمغذيات في هذا التطبيق تقديرات تعتمد على متوسط بيانات الأغذية المنشورة على الإنترنت والإرشادات الغذائية الدولية، وتختلف القيم الفعلية حسب المنتج والعلامة والحصة وطريقة الطهي."],
  wDoktorT:["Doktor ve diyetisyen kontrolü","Doctor & dietitian supervision","Контроль врача и диетолога","Ärztliche & diätologische Kontrolle","إشراف الطبيب وأخصائي التغذية"],
  wDoktor:["Diyet listesini doktorunuz veya diyetisyeniniz kontrol etmeden uygulamayın. Kronik hastalığınız (diyabet, böbrek, kalp, tiroit vb.), düzenli kullandığınız ilaçlar, 18 yaş altı, emzirme ya da yeme bozukluğu öyküsü varsa mutlaka uzmana danışın.","Do not follow this plan without your doctor's or dietitian's approval. If you have a chronic condition (diabetes, kidney, heart, thyroid, etc.), take regular medication, are under 18, breastfeeding or have a history of eating disorders, always consult a professional.","Не следуйте плану без одобрения врача или диетолога. При хронических заболеваниях (диабет, почки, сердце, щитовидная железа и др.), постоянном приёме лекарств, возрасте до 18 лет, грудном вскармливании или расстройствах пищевого поведения обязательно проконсультируйтесь со специалистом.","Folge diesem Plan nicht ohne Zustimmung deines Arztes oder Ernährungsberaters. Bei chronischen Erkrankungen (Diabetes, Niere, Herz, Schilddrüse usw.), regelmäßiger Medikamenteneinnahme, unter 18, in der Stillzeit oder bei Essstörungen in der Vorgeschichte unbedingt fachlichen Rat einholen.","لا تتبع هذه الخطة دون موافقة طبيبك أو أخصائي التغذية. استشر مختصاً دائماً إذا كان لديك مرض مزمن (السكري أو الكلى أو القلب أو الغدة الدرقية وغيرها) أو تتناول أدوية بانتظام أو كان عمرك أقل من 18 عاماً أو كنتِ مرضعاً أو لديك تاريخ من اضطرابات الأكل."],
  wSorumT:["Sorumluluk reddi","Disclaimer","Отказ от ответственности","Haftungsausschluss","إخلاء المسؤولية"],
  wSorum:["Bu uygulama tıbbi tavsiye, teşhis veya tedavi yerine geçmez. Uygulamanın kullanımından doğabilecek doğrudan veya dolaylı hiçbir sonuç için geliştirici yasal sorumluluk kabul etmez. Uygulamayı kullanarak bu koşulları kabul etmiş sayılırsınız.","This app is not a substitute for medical advice, diagnosis or treatment. The developer accepts no legal liability for any direct or indirect consequences of using the app. By using the app you accept these terms.","Приложение не заменяет медицинскую консультацию, диагностику или лечение. Разработчик не несёт юридической ответственности за любые прямые или косвенные последствия его использования. Используя приложение, вы принимаете эти условия.","Diese App ersetzt keine ärztliche Beratung, Diagnose oder Behandlung. Der Entwickler übernimmt keinerlei rechtliche Haftung für direkte oder indirekte Folgen der Nutzung. Mit der Nutzung akzeptierst du diese Bedingungen.","هذا التطبيق لا يغني عن الاستشارة الطبية أو التشخيص أو العلاج، ولا يتحمل المطوّر أي مسؤولية قانونية عن أي نتائج مباشرة أو غير مباشرة لاستخدامه. باستخدامك التطبيق فإنك توافق على هذه الشروط."],
  wHamileT:["Hamileler için","For pregnant women","Для беременных","Für Schwangere","للحوامل"],
  wHamile:["Hamilelikte kilo vermeye yönelik diyet uygulanmaz; uygulama hamilelik modunda kaloriyi trimestere göre artırır. Çiğ veya az pişmiş yumurta ve balık, pastörize edilmemiş süt ürünleri, yüksek cıvalı balıklar ve alkol tüketilmemelidir; kafein günde 200 mg'ı (yaklaşık 2 fincan kahve) geçmemelidir. Folik asit, demir, iyot, D vitamini ve omega-3 takviyeleri yalnızca doktor önerisiyle kullanılmalıdır. Menüyü mutlaka kadın doğum uzmanınıza veya diyetisyeninize onaylatın.","No weight-loss diet is applied during pregnancy; in pregnancy mode the app increases calories by trimester. Avoid raw or undercooked eggs and fish, unpasteurised dairy, high-mercury fish and alcohol; keep caffeine under 200 mg a day (about 2 cups of coffee). Take folic acid, iron, iodine, vitamin D and omega-3 supplements only as advised by your doctor. Always have the menu approved by your obstetrician or dietitian.","Во время беременности диеты для похудения не применяются; в режиме беременности приложение увеличивает калорийность по триместрам. Исключите сырые или недоваренные яйца и рыбу, непастеризованные молочные продукты, рыбу с высоким содержанием ртути и алкоголь; кофеин — не более 200 мг в день (около 2 чашек кофе). Фолиевую кислоту, железо, йод, витамин D и омега-3 принимайте только по назначению врача. Обязательно согласуйте меню с акушером-гинекологом или диетологом.","In der Schwangerschaft wird keine Abnehmdiät angewendet; im Schwangerschaftsmodus erhöht die App die Kalorien je nach Trimester. Rohe oder nicht durchgegarte Eier und Fisch, Rohmilchprodukte, quecksilberreiche Fische und Alkohol meiden; Koffein unter 200 mg pro Tag (etwa 2 Tassen Kaffee). Folsäure, Eisen, Jod, Vitamin D und Omega-3 nur nach ärztlicher Empfehlung einnehmen. Lass das Menü unbedingt von deiner Frauenärztin oder Ernährungsfachkraft freigeben.","لا يُطبَّق نظام لإنقاص الوزن أثناء الحمل؛ في وضع الحمل يزيد التطبيق السعرات حسب الثلث. تجنبي البيض والسمك النيء أو غير المطهو جيداً، والألبان غير المبسترة، والأسماك عالية الزئبق، والكحول؛ ولا يتجاوز الكافيين 200 ملغ يومياً (نحو فنجانين من القهوة). لا تتناولي حمض الفوليك والحديد واليود وفيتامين د وأوميغا 3 إلا بتوصية الطبيب. اعرضي القائمة دائماً على طبيبة النساء أو أخصائي التغذية."],
  wAlerjiT:["Alerjisi olanlar için","For people with allergies","Для людей с аллергией","Für Allergiker","لمن لديهم حساسية"],
  wAlerji:["Alerji filtresi, yemeklerin bilinen ana içeriklerine göre çalışır; tarif, marka ve hazır ürünlerde gizli içerik ya da çapraz bulaşma olabilir. Her zaman ürün etiketlerini okuyun. Ciddi alerjiniz (anafilaksi riski) varsa doktorunuzun talimatlarına uyun ve yanınızda gerekli ilacı bulundurun. Acil durumda 112'yi arayın.","The allergy filter works on the known main ingredients of each dish; recipes, brands and ready-made products may contain hidden ingredients or cross-contamination. Always read product labels. If you have a severe allergy (risk of anaphylaxis), follow your doctor's instructions and carry your medication. In an emergency call your local emergency number.","Фильтр аллергенов учитывает известные основные ингредиенты блюд; в рецептах, марках и готовых продуктах возможны скрытые компоненты и перекрёстное загрязнение. Всегда читайте этикетки. При тяжёлой аллергии (риск анафилаксии) следуйте указаниям врача и держите лекарство при себе. В экстренной ситуации звоните в службу спасения.","Der Allergiefilter berücksichtigt die bekannten Hauptzutaten der Gerichte; Rezepte, Marken und Fertigprodukte können versteckte Zutaten oder Kreuzkontaminationen enthalten. Lies immer die Etiketten. Bei schweren Allergien (Anaphylaxie-Risiko) folge den Anweisungen deines Arztes und trage dein Notfallmedikament bei dir. Im Notfall den Notruf wählen.","يعمل مرشح الحساسية وفق المكونات الرئيسية المعروفة لكل طبق، وقد تحتوي الوصفات والعلامات التجارية والمنتجات الجاهزة على مكونات خفية أو تلوث متبادل. اقرأ ملصقات المنتجات دائماً. إذا كانت لديك حساسية شديدة (خطر الحساسية المفرطة) فاتبع تعليمات طبيبك واحمل دواءك معك، واتصل بالطوارئ عند الحاجة."],
  wVeriT:["Verileriniz","Your data","Ваши данные","Deine Daten","بياناتك"],
  wVeri:["Girdiğiniz bilgiler yalnızca bu cihazda saklanır, hiçbir sunucuya gönderilmez. Cihaz değiştirirken Ayarlar › Yedek bölümünü kullanın.","Everything you enter is stored only on this device and never sent to a server. Use Settings › Backup when changing devices.","Все данные хранятся только на этом устройстве и никуда не отправляются. При смене устройства используйте Настройки › Резервная копия.","Alle Eingaben werden nur auf diesem Gerät gespeichert und nie an einen Server gesendet. Beim Gerätewechsel Einstellungen › Sicherung nutzen.","تُحفظ كل بياناتك على هذا الجهاز فقط ولا تُرسل إلى أي خادم. استخدم الإعدادات › النسخ الاحتياطي عند تغيير الجهاز."],

  shInfo:["Linke dokunan kişi o gün öğün öğün, saatiyle neler yediğini belge olarak görür ve PDF olarak kaydedebilir. Bilgiler linkin içindedir, sunucuya gönderilmez.","Whoever taps the link sees what you ate that day, meal by meal with times, as a document and can save it as PDF. The data is inside the link; nothing is sent to a server.","Получатель увидит по ссылке, что вы ели в этот день — по приёмам пищи и времени — в виде документа и сможет сохранить его в PDF. Данные внутри ссылки, на сервер ничего не отправляется.","Wer auf den Link tippt, sieht als Dokument, was du an dem Tag gegessen hast – Mahlzeit für Mahlzeit mit Uhrzeit – und kann es als PDF speichern. Die Daten stecken im Link, nichts geht an einen Server.","من يفتح الرابط يرى ما أكلته في ذلك اليوم، وجبةً وجبة مع الأوقات، كمستند ويمكنه حفظه PDF. البيانات داخل الرابط ولا تُرسل إلى أي خادم."],
  shSend:["📤 Gönder","📤 Send","📤 Отправить","📤 Senden","📤 إرسال"],
  shCopy:["📋 Linki kopyala","📋 Copy link","📋 Копировать ссылку","📋 Link kopieren","📋 نسخ الرابط"],
  shPreview:["👁 Önizle","👁 Preview","👁 Предпросмотр","👁 Vorschau","👁 معاينة"],
  shNone:["Bu gün “Yedim” işaretli öğün yok. Önce yediğin öğünleri işaretle.","No meals are marked “Ate” on this day. Mark the meals you ate first.","В этот день нет приёмов с отметкой «Съел(а)». Сначала отметьте съеденное.","An diesem Tag ist keine Mahlzeit als „Gegessen“ markiert. Markiere zuerst, was du gegessen hast.","لا توجد وجبات مُعلَّمة «أكلت» في هذا اليوم. علِّم ما أكلته أولاً."],
  shText:["{d} yediklerim","What I ate on {d}","Что я ел(а): {d}","Was ich am {d} gegessen habe","ما أكلته يوم {d}"],
  rpTitle:["Günlük beslenme kaydı","Daily food log","Дневник питания","Ernährungsprotokoll","سجل الطعام اليومي"],
  rpPdf:["📄 PDF olarak kaydet","📄 Save as PDF","📄 Сохранить в PDF","📄 Als PDF speichern","📄 حفظ كملف PDF"],
  rpClose:["Kapat","Close","Закрыть","Schließen","إغلاق"],
  rpFood:["Yiyecek","Food","Продукт","Lebensmittel","الطعام"],
  rpMealTotal:["Öğün toplamı","Meal total","Итого","Summe","مجموع الوجبة"],
  rpNotEaten:["Yenmeyen öğünler","Skipped meals","Пропущенные приёмы","Ausgelassene Mahlzeiten","وجبات لم تؤكل"],
  rpFooter:["Kişisel Diyet Planı ile hazırlandı","Made with Personal Diet Plan","Сделано в «Личный план питания»","Erstellt mit Persönlicher Diätplan","أُعدّ بواسطة خطة النظام الغذائي الشخصية"],
  tourBtn:["Kullanım turu", "App tour", "Обзор приложения", "App-Tour", "جولة في التطبيق"],
  tourSkip:["Geç", "Skip", "Пропустить", "Überspringen", "تخطَّ"],
  tourNext:["İleri", "Next", "Далее", "Weiter", "التالي"],
