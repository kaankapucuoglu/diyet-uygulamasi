<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16a36b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Diyet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Diyet Listesi</title>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--line:#e4e9f1;--text:#172338;--muted:#718096;
  --blue:#2563eb;--blue-soft:#eaf1ff;--green:#16a36b;--green-soft:#e6f6ef;
  --red:#e05c63;--red-soft:#fdecee;--gold:#d48a1a;--gold-soft:#fdf3e2;--purple:#8b5cf6;
  --r:15px;--shadow:0 1px 2px rgba(23,35,56,.04),0 6px 18px rgba(23,35,56,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:Inter,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.4;-webkit-text-size-adjust:100%;touch-action:pan-y;
  padding:max(16px,env(safe-area-inset-top)) clamp(14px,2vw,40px) calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea,label{touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;font-size:16px;color:var(--text)}
mark{background:#fff1b8;color:inherit;border-radius:3px;padding:0 1px}
.wrap{max-width:1500px;margin:0 auto}
body.wiz-acik .wrap{display:none}

/* Başlık */
.top{margin-bottom:10px}
.top-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;margin:4px 0 6px}
.top-row h1{margin:0;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.top-row .langbar,.top-row .top-btns{margin-inline-start:auto}
.top-row.kirik-dil .langbar,.top-row.kirik .top-btns{margin-inline-start:0}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.langbar{display:grid;grid-template-columns:repeat(5,80px);gap:6px}
.lang{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:46px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  color:#40506a;box-shadow:var(--shadow);min-width:0;padding:0 2px}
.lang b{font-size:14px;font-weight:800;line-height:1.1}
.lang small{font-size:10.5px;font-weight:600;opacity:.8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lang:active{transform:scale(.96)}
h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;margin-top:2px}
.sub-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.sub{color:var(--muted);font-size:14px}
.sub-row .save-chip{margin-top:0}
.top-btns{display:flex;gap:6px}
.tool-btn{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;min-width:0;height:46px;padding:0 16px;
  border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tool-btn span{font-size:17px;line-height:1}
.tool-btn small{font-size:13px;font-weight:700;color:#40506a;white-space:nowrap}
.tool-btn:active{transform:scale(.96)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.save-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);background:var(--green-soft);
  padding:3px 9px;border-radius:99px;margin-top:6px;font-weight:600}
.save-chip.warn{color:var(--red);background:var(--red-soft)}

/* Hafta ve gün seçimi */
.weeknav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;min-height:30px}
.weeknav .lbl{text-align:center;font-weight:700;font-size:14px}
.gunsatir{display:flex;align-items:stretch;gap:6px;margin-bottom:16px}
.gunsatir .days{flex:1;min-width:0;margin:0}
.gunsatir .nav-btn{height:auto;width:36px;flex:none}
.nav-btn{width:38px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700}
.hafta-tag{background:var(--blue-soft);color:var(--blue)}
.frow em.uyg{color:var(--red);background:var(--red-soft)}
.today-btn{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:5px 10px;border-radius:9px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;min-width:0}
.day b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day span{display:block;font-size:11px;color:var(--muted)}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.day i.on{background:var(--green)}
.day.past{background:#f8fafc}
.day.today{border-color:var(--blue)}
.day.active{background:var(--blue);border-color:var(--blue);color:#fff}
.day.active span{color:#dbe6ff}
.day.active i.on{background:#fff}

/* Özet */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kcal-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kcal-big b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.kcal-big span{color:var(--muted);font-size:16px}
.kcal-big .tgt{font-size:18px}
.bar{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:6px;display:flex;position:relative}
.bar i{display:block;flex:none;height:100%;background:var(--blue);transition:width .3s}
.bar i.ok{border-radius:99px 0 0 99px}
.bar i.ok:last-of-type{border-radius:99px}
.bar i.over{background:var(--red)!important;border-radius:0 99px 99px 0}
.bar i.over.iyi{background:var(--green)!important}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#172338;opacity:.55}
.kalan{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;overflow-wrap:anywhere}
.kalan.asti{color:var(--red);font-weight:800}
.kalan.tamam{color:var(--green);font-weight:800}
.tgt{color:var(--text)!important;font-weight:800}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.macro small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro b{font-size:17px}
.macro .hint{font-size:13px}
.macro.p .bar i.ok{background:var(--green)}
.macro.c .bar i.ok{background:var(--gold)}
.macro.s .bar i.ok{background:var(--purple)}
.macro.y .bar i.ok{background:#94a3b8}
.plan-box{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.plan-box h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,92px),1fr));gap:6px}
.plan-grid div{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-width:0}
.plan-grid small{display:block;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-grid b{font-size:15px}
.plan-grid span{font-size:11.5px;color:var(--muted)}
.plan-grid div.asti{background:var(--red-soft);border-color:#f5c2c6}
.plan-grid div.asti b{color:var(--red)}
.plan-grid div.tamam{background:var(--green-soft);border-color:#bfe8d4}
.plan-grid div.tamam b{color:var(--green)}

.water-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.water-head b{font-size:26px;font-weight:800}
.water-head span{color:var(--muted);font-size:14px}
.water-head .tgt{font-size:18px}
.glasses{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.glass{width:30px;height:38px;border:2px solid #bcd0f5;border-top:0;border-radius:0 0 9px 9px;position:relative;overflow:hidden;background:#fff}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#5b8ef5,#2563eb);transition:height .25s}
.glass.full::after{height:82%}
.glass.ekstra{border-color:#9fdcc1}
.glass.ekstra::after{background:linear-gradient(#5fd3a0,var(--green))}
.water-btns{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:11px;
  font-weight:600;font-size:14px;background:var(--blue-soft);color:var(--blue)}
.btn.solid{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#f1f4f9;color:var(--text)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}

/* Geçmiş gün özeti */
.past-card{grid-column:1/-1}
.past-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.past-head h3{margin:0;flex:1;min-width:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.stat.asti{background:var(--red-soft);border-color:#f5c2c6}
.stat.asti b{color:var(--red)}
.stat.tamam{background:var(--green-soft);border-color:#bfe8d4}
.stat.tamam b{color:var(--green)}
.stat.water{background:var(--blue-soft);border-color:#d3e1fd}
.stat.hl{background:var(--green-soft);border-color:#bfe8d4}
.stat-acts{display:flex;align-items:center;gap:6px;margin-top:6px}
.stat-acts button{width:32px;height:30px;border-radius:8px;background:#fff;border:1px solid #d3e1fd;font-weight:800;color:var(--blue)}
.eaten-list{font-size:13.5px;color:#40506a;margin-top:12px;line-height:1.6}
.eaten-list b{color:var(--text)}

/* Öğünler */
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:14px}
.meals:empty{display:none}
.meal{padding:0;overflow:hidden;transition:border-color .2s}
.meal.eaten{border-color:#9fdcc1}
.meal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.meal.eaten .meal-head{background:var(--green-soft)}
.meal-ico{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.meal-title{flex:1;min-width:0}
.meal-title b{display:block;font-size:16px;overflow-wrap:anywhere}
.meal-title span{font-size:13px;color:var(--muted)}
.eat-btn{min-height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px;background:#f1f4f9;color:var(--muted);flex-shrink:0;white-space:nowrap}
.meal.eaten .eat-btn{background:var(--green);color:#fff}
.items{list-style:none}
.item{padding:12px 16px;border-bottom:1px solid #f0f3f8}
.item-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item-info{flex:1;min-width:0}
.item-info b{font-size:15px;display:block;overflow-wrap:anywhere}
.item-info small{font-size:12.5px;color:var(--muted)}
.gram{display:flex;align-items:center;gap:8px;flex-shrink:0}
.gram .val{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fafbfd;height:38px}
.gram input{width:44px;border:0;background:transparent;text-align:end;padding:7px 1px;outline:none;font-weight:700}
.gram span{font-size:12.5px;color:var(--muted);padding-inline:3px 7px}
.adim{width:38px;height:38px;border-radius:10px;font-size:20px;font-weight:700;color:var(--blue);background:var(--blue-soft);flex-shrink:0;touch-action:manipulation}
.adim:active{background:#d6e4ff}
.item-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;background:#f1f4f9;color:#40506a}
.mini.cmp{background:var(--blue-soft);color:var(--blue)}
.mini.del{background:var(--red-soft);color:var(--red)}
.empty{padding:16px;color:var(--muted);font-size:14px;list-style:none}
.add-food{width:100%;padding:13px;font-weight:700;font-size:14px;color:var(--blue);border-top:1px dashed var(--line)}
.add-food:active{background:var(--blue-soft)}
.under{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.under .btn{flex:1 1 260px}

/* Loglar */
.log-card{margin-top:16px}
.log-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.log-head h3{margin:0;flex:1}
.logs{list-style:none}
.log{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f8;font-size:13.5px;align-items:flex-start}
.log:last-child{border-bottom:0}
.log time{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums;min-width:74px}
.log-body{flex:1;min-width:0;overflow-wrap:anywhere}
.lb{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-inline-end:4px;vertical-align:1px}
.lb.ekle,.lb.yedim{background:var(--green-soft);color:var(--green)}
.lb.sil{background:var(--red-soft);color:var(--red)}
.lb.degis,.lb.gram{background:var(--blue-soft);color:var(--blue)}
.lb.su{background:#e0f2fe;color:#0284c7}
.lb.diger{background:#f1f4f9;color:#40506a}
.lb.gecmis{background:var(--gold-soft);color:var(--gold)}

/* Fark rozetleri ve kıyas */
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pl{font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{background:var(--green-soft);color:var(--green)}
.bad{background:var(--red-soft);color:var(--red)}
.eq{background:#f1f4f9;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:8px 0 2px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.kiyas{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.cmp-top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.cmp-top div{min-width:0}
.cmp-top small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmp-top b{display:block;font-size:14px;overflow-wrap:anywhere}
.cmp-top span{font-size:12.5px;color:var(--muted)}
.cmp-top .arrow{font-size:18px;color:var(--muted)}
.cmp-top div:last-child{text-align:end}
.verdict{padding:10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.verdict .g{color:var(--green);font-weight:700}
.verdict .r{color:var(--red);font-weight:700}
.grp h4{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px 4px;color:var(--muted)}
.grp.good h4{color:var(--green)}
.grp.limit h4{color:var(--red)}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px 12px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.crow > :not(:first-child){text-align:end}
.crow.head{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:4px;padding-bottom:4px;border-bottom:1px solid #f0f3f8}
.crow .pl{font-size:13px;padding:3px 7px;justify-self:end}
.crow em{font-style:normal;color:var(--muted);font-weight:600}

/* Pencere (telefonda alttan açılır) */
.overlay{position:fixed;inset:0;top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100%);background:rgba(15,23,42,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:86vh;max-height:86dvh;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.25)}
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-head h2{font-size:17px;flex:1;min-width:0}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cur{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.cur small{color:var(--muted);font-size:12px;display:block}
.cur b{font-size:15px}
.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;background:#fafbfd}
.search:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;background:#f1f4f9;font-weight:600;color:#40506a}
.chip.on{background:var(--blue);color:#fff}
.chip.recent{background:var(--gold-soft);color:var(--gold)}
.chip.recent.on{background:var(--gold);color:#fff}
.chip.more{background:transparent;color:var(--blue);border:1px dashed #b9cdf6}
body.klavye .overlay{padding:0;align-items:flex-start}
body.klavye .sheet{max-height:100%!important;height:100%;border-radius:0}
body.klavye .sheet:has(#ara:focus) .cur,body.klavye .sheet:has(#ara:focus) #kategoriler,body.klavye .sheet:has(#ara:focus) .legend,body.klavye .sheet:has(#ara:focus) #sbody > .hint{display:none}
body.klavye .sheet-head{padding-top:8px;padding-bottom:6px}
.flist{list-style:none}
.frow{display:block;width:100%;text-align:start;padding:10px 4px;border-bottom:1px solid #f0f3f8}
.frow:active{background:#f7f9fc}
.frow b{font-size:15px;display:block}
.frow b em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 6px;border-radius:6px;margin-inline-start:6px}
.frow small{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.found{font-size:12.5px;color:var(--muted);margin:2px 0 4px}
.det-name{font-size:19px;font-weight:800;margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:22px;font-weight:700;flex-shrink:0}
.stepper input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:700;font-size:18px;outline:none}
.hint{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1 1 140px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.tip{font-size:13px;color:#40506a;background:var(--gold-soft);border-radius:10px;padding:10px 12px;line-height:1.5}
.hrow{display:block;width:100%;text-align:start;padding:12px 4px;border-bottom:1px solid #f0f3f8}
.hrow b{font-size:15px}
.hrow small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
body.klavye .toast{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:#172338;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px}

/* Kurulum sihirbazı */
.wiz{position:fixed;inset:0;top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100%);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(1200px 500px at 50% -10%,#dfe9ff 0%,var(--bg) 60%);padding:max(16px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.wiz[hidden]{display:none}
.wiz-in{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wiz-brand{font-weight:800;font-size:15px}
.wiz-step{font-size:12.5px;color:var(--muted);font-weight:700}
.wiz-bar{height:6px;background:#e3e9f3;border-radius:99px;overflow:hidden;margin-bottom:22px}
.wiz-bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.wiz h2{font-size:clamp(22px,4.5vw,28px);font-weight:800;letter-spacing:-.02em}
.wiz-sub{color:var(--muted);font-size:14.5px;margin:4px 0 18px}
.wiz-body{flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;min-height:62px;position:relative}
.opt .ic{font-size:25px;line-height:1;flex-shrink:0;width:40px;text-align:center}
.opt .ic.kod{font-size:14px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:9px;height:34px;display:grid;place-items:center}
.opt b{display:block;font-size:15.5px}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt.on::after{content:"✓";position:absolute;top:8px;inset-inline-end:10px;font-weight:900;color:var(--blue)}
.opt:disabled{opacity:.45}
.wfield{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.wfield label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.wfield .stepper{margin:0}
.wname{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;font-weight:600;outline:none}
.wname:focus{border-color:var(--blue)}
.wsec{font-size:13px;font-weight:800;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.wmsg{font-size:13.5px;border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5}
.wmsg.err{background:var(--red-soft);color:#b4232c}
.wmsg.warn{background:var(--gold-soft);color:#8a5a0c}
.wmsg.info{background:var(--blue-soft);color:#1e40af}
body.klavye .wnav{position:static;box-shadow:none}
.wnav{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 4px;margin-top:18px;background:var(--bg);box-shadow:0 -10px 14px -10px rgba(23,35,56,.18)}
.wnav .btn{flex:1;min-height:50px;font-size:16px;font-weight:700}
.wnav .btn.ghost{flex:0 0 auto;padding:0 20px}
details.method{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.method summary{cursor:pointer;font-weight:700;font-size:14px}
details.method ul{margin:8px 0 0;padding-inline-start:18px;font-size:13px;color:#40506a;line-height:1.55}

@media (max-width:600px){
  .top{gap:12px}
  .top-row{gap:10px}
  .top-row h1{flex-basis:100%}
  .langbar{grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
  .top-row .top-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin-inline-start:0}
  .tool-btn{flex-direction:column;gap:2px;height:54px;padding:0 4px}
  .tool-btn small{font-size:12px;white-space:normal;line-height:1.15;text-align:center;overflow:visible}
  .overlay{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:90vh;max-height:90dvh;padding-bottom:env(safe-area-inset-bottom)}
  .day b{font-size:13px}
  .day span{font-size:10px}
  .kcal-big b{font-size:26px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log time{min-width:0}
  .item-info{flex-basis:100%}
  .gram{gap:12px;margin-top:2px}
  .gram .adim{width:44px;height:40px}
  .gram .val{height:40px}
  .gram input{width:52px}
}
@media (max-width:600px){ .macros{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px} }
@media (max-width:600px){ .gunsatir{gap:4px} .gunsatir .nav-btn{width:28px;font-size:16px} .gunsatir .days{gap:4px} }
@media (max-width:360px){ .days{gap:4px} .day{padding:7px 0 5px} .macros{gap:6px} .crow{font-size:13px} }

    "Basal metabolic rate: Mifflin-St Jeor equation (the most accurate formula, recommended by the Academy of Nutrition and Dietetics).|Daily energy use: FAO/WHO activity factors (1.2–1.9).|Weight loss: 0.25–0.75 kg per week (1 kg fat ≈ 7700 kcal); deficit at most 25%, floor 1200 kcal for women, 1500 kcal for men.|Muscle gain +10%, weight gain +15% calories.|Protein: ISSN guidance, 1.2–2.0 g/kg depending on the goal (ideal weight used if BMI > 25).|Fat 28% of calories (30% for blood sugar), carbohydrates the rest (IOM AMDR ranges).|Sugar limited in line with WHO: 13% of calories incl. natural sugars (10% for blood sugar).|Fiber: 14 g per 1000 kcal. Water: 35 ml per kg (+500 ml if active). BMI classes: WHO.",
    "Базальный обмен: формула Миффлина — Сан Жеора (самая точная, рекомендована Академией питания и диетологии США).|Суточный расход: коэффициенты активности ФАО/ВОЗ (1,2–1,9).|Похудение: 0,25–0,75 кг в неделю (1 кг жира ≈ 7700 ккал); дефицит не более 25%, минимум 1200 ккал для женщин и 1500 для мужчин.|Набор мышц +10%, набор веса +15% калорий.|Белок: по рекомендациям ISSN, 1,2–2,0 г/кг в зависимости от цели (при ИМТ > 25 — на идеальный вес).|Жиры 28% калорий (30% при контроле сахара), углеводы — остальное (диапазоны AMDR).|Сахар ограничен по рекомендации ВОЗ: 13% калорий с учётом натурального (10% при контроле сахара).|Клетчатка: 14 г на 1000 ккал. Вода: 35 мл на кг (+500 мл при активности). Классы ИМТ: ВОЗ.",

// Eski sürüm verisini yeni yapıya taşı (geçmiş kayıtlar korunur, profil sihirbazda tamamlanır)
function tamamla(x){
  for (const k of ['ozelYemek','log']) if (!x[k]) x[k] = [];
  for (const k of ['son','kayit']) if (!x[k]) x[k] = {};
  if (!x.ayar) x.ayar = {dil:'tr', kurulum:false};
  x.profil = {...BOS_PROFIL, ...x.profil};
  if (!x.profil.haric) x.profil.haric = [];
  if (!x.profil.odaklar) x.profil.odaklar = [];
  // Eski tek seçimli "Kan şekeri" hedefi → kilo hedefi + kan şekeri odağı
  if (x.profil.hedef === 'seker'){
    x.profil.hedef = vki(x.profil) >= 25 ? 'ver' : 'koru';
    if (!x.profil.odaklar.includes('seker')) x.profil.odaklar.push('seker');
  }
  x.ozelYemek.forEach(f => {
    if (f.s == null) f.s = 0; if (f.l == null) f.l = 0; if (f.a == null) f.a = 0; if (!f.b) f.b = f.a ? 'adet' : '';
    if (!f.e) f.e = ''; f.x = f.x || ''; f.kat = 'ozel';
  });
  if ((x.surum || 0) < 3){
    // v2: adetli yemekler gram tutuluyordu → adet/dilime çevir
    const cevir = ogunler => ogunler.forEach(o => o.ogeler.forEach(it => {
      const f = YEMEKLER.find(y => y.id === it.f);
      if (f && f.a) it.g = Math.max(0.5, Math.round(it.g / f.a * 2) / 2);
    }));
    Object.values(x.kayit).forEach(r => { if (r.ogunler) cevir(r.ogunler); });
  }
  if ((x.surum || 0) < 6) (x.plan || (x.planlar && x.planlar[0]) || []).forEach(gun => gun.forEach(o => o.ogeler.forEach(it => {
    const f = YEMEKLER.find(y => y.id === it.f);
    if (f && f.kat === 'meyve' && f.a && it.g > 2) it.g = 2;
  })));
  // Tek haftalık eski plan → 1. hafta (kullanıcının değişiklikleri korunur); eksik haftalar açılışta profile göre üretilir
  if (!x.planlar){ x.planlar = x.plan && x.plan.length ? [x.plan] : []; delete x.plan; }
  if (!x.planBaslangic) x.planBaslangic = '';
  x.surum = SURUM;
  return x;
}

// ---------- Hedef hesaplama (Mifflin-St Jeor, FAO/WHO PAL, ISSN, WHO) ----------
const PAL = [1.2, 1.375, 1.55, 1.725, 1.9];
const PROTEIN_KG = {ver:1.8, sekil:2.0, koru:1.2, kas:1.8, al:1.6};
// Ek sağlık odakları kalori hedefine eklenen kurallardır; menüde dışlanacak içerik harfi (t tuzlu, y doymuş yağı yüksek)
const ODAKLAR = [['seker','🩺',''], ['tansiyon','❤️','t'], ['kolesterol','🫀','y']];
function vki(p){ return p.kilo / Math.pow(p.boy / 100, 2); }
function vkiSinif(b){ return b < 18.5 ? 'bmi1' : b < 25 ? 'bmi2' : b < 30 ? 'bmi3' : 'bmi4'; }
function hedefHesapla(p){
  const bmr = 10 * p.kilo + 6.25 * p.boy - 5 * p.yas + (p.cins === 'k' ? -161 : 5);
  const tdee = bmr * PAL[(p.aktivite || 2) - 1];
  const b = vki(p), od = new Set(p.odaklar || []), seker = od.has('seker');
  let kcal = tdee;
  if (p.hedef === 'ver') kcal = tdee - Math.min(p.hiz * 7700 / 7, tdee * 0.25);
  else if (p.hedef === 'sekil') kcal = tdee * 0.9;
  else if (p.hedef === 'kas') kcal = tdee * 1.1;
  else if (p.hedef === 'al') kcal = tdee * 1.15;
  const taban = p.cins === 'k' ? 1200 : 1500;
  kcal = Math.round(Math.max(kcal, Math.min(taban, tdee)) / 50) * 50;
  const refKilo = b > 25 ? 25 * Math.pow(p.boy / 100, 2) : p.kilo;
  const pKg = Math.max(PROTEIN_KG[p.hedef] || 1.2, seker ? 1.3 : 0);
  const protein = Math.round(Math.min(pKg * refKilo, kcal * 0.35 / 4));
  // Kan şekeri: yağ %30, karbonhidrat en çok %40, şeker %10 · Kolesterol: yağ %28'de kalır, doymuş yağlı kalemler menüden çıkar
  const yag = Math.round(kcal * (seker ? 0.30 : 0.28) / 9);
  let karb = Math.round((kcal - protein * 4 - yag * 9) / 4);
  if (seker) karb = Math.min(karb, Math.round(kcal * 0.40 / 4));
  const sekerG = Math.round(kcal * (seker ? 0.10 : 0.13) / 4);
  // Lif: 14 g/1000 kcal; kolesterol ve kan şekerinde en az 30 g (çözünür lif LDL ve kan şekerini düşürür)
  const lif = Math.max(Math.round(kcal / 1000 * 14), od.has('kolesterol') || seker ? 30 : 0);
  const su = sinirla(Math.round((p.kilo * 35 + (p.aktivite >= 3 ? 500 : 0)) / 250) * 250, 1500, 4000);
  let hafta = 0;
  if (p.hedef === 'ver' && p.hedefKilo < p.kilo) hafta = Math.ceil((p.kilo - p.hedefKilo) / p.hiz);
  if (p.hedef === 'al' && p.hedefKilo > p.kilo) hafta = Math.ceil((p.hedefKilo - p.kilo) / 0.35);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), vki:b, kcal, protein, karb, seker: sekerG, yag, lif, su, hafta};
}

// ---------- Plan üretici ----------
// Rol: P protein kaynağı, K karbonhidrat kaynağı, Y yağ kaynağı, S sabit (sebze, karışık yemek, içecek)
function rol(f){
  if (!f.k) return 'S';
  const ps = f.p * 4 / f.k, cs = f.c * 4 / f.k, ys = f.y * 9 / f.k;
  if (['et','balik','yumurta','bitkisel'].includes(f.kat) || ps >= 0.4) return 'P';
  if (ys >= 0.6) return 'Y';
  if (cs >= 0.5 && ['tahil','pilav','meyve','baklagil','anayemek'].includes(f.kat)) return 'K';
  return 'S';
}
// Miktarı birime göre yuvarla: yumurta tam adet, diğer adetler 0,5'lik (ekmek en çok 3 dilim); gram 30 altı 5'lik, üstü 10'luk
function yuvarla(f, m){
  if (f.a){
    if (f.kat === 'yumurta') return sinirla(Math.round(m), 1, f.id === 'ybeyaz' ? 6 : 4);
    return sinirla(Math.round(m * 2) / 2, 0.5, f.b === 'dilim' ? 3 : f.kat === 'meyve' ? 2 : 4);
  }
  return sinirla(m < 30 ? Math.round(m / 5) * 5 : Math.round(m / 10) * 10, 5, 400);
}
function birlestir(ogeler){
  const m = new Map();
  ogeler.forEach(it => m.set(it.f, (m.get(it.f) || 0) + it.g));
  return [...m].map(([f, g]) => ({f, g: yuvarla(yemek(f), g)}));
}
// Profile uygun mu: yenmeyenler + sağlık odaklarının dışladığı içerik (tansiyon: tuzlu, kolesterol: doymuş yağı yüksek)
function profilUygun(p){
  const haric = new Set([...(p.haric || []), ...ODAKLAR.filter(([k]) => (p.odaklar || []).includes(k)).map(([, , x]) => x).filter(Boolean)]);
  return f => !(f.x || '').split('').some(c => haric.has(c));
}
// 4 haftalık dönen plan: her temel hafta aynı kurallarla profile göre hazırlanır
const planOlustur = p => TEMEL_HAFTALAR.map(h => haftaOlustur(p, h));
function haftaOlustur(p, temel){
  const izinli = profilUygun(p);
  const kullanilan = {};
  // Yenmeyen yemeği, benzer makro dağılımlı izinli bir yemekle aynı kaloride değiştir
  const degistir = it => {
    const f = yemek(it.f);
    if (izinli(f)) return it;
    // Önce akla yatkın karşılık (izinliyse), yoksa makro benzerliğine göre ara
    const tercih = (TERCIH[f.id] || []).map(yemek).find(y => y.id && izinli(y));
    if (tercih){ const gr = besin(it.f, it.g).k / (tercih.k || 1) * 100; return {f: tercih.id, g: yuvarla(tercih, tercih.a ? gr / tercih.a : gr)}; }
    const oz = y => { const k = y.k || 1; return [y.p * 4 / k, y.c * 4 / k, y.y * 9 / k]; };
    const [a1, a2, a3] = oz(f);
    let en = null, enP = 1e9;
    const proteinKat = ['et','balik','yumurta','bitkisel'];
    for (const y of YEMEKLER){
      if (!izinli(y) || DOKTOR_DISI.has(y.id) || y.id === 'whey' || y.id === 'vegan_protein') continue;
      if (SIVI.has(y.id) !== SIVI.has(f.id)) continue;   // içecek yalnız içecekle değişir
      const [b1, b2, b3] = oz(y);
      const katUyum = y.kat === f.kat ? 0 : (proteinKat.includes(f.kat) && proteinKat.includes(y.kat)) ? 0.2 : 0.8;
      const puan = Math.abs(a1 - b1) * 3 + Math.abs(a2 - b2) + Math.abs(a3 - b3) + katUyum + (kullanilan[y.id] || 0) * 0.12;
      if (puan < enP){ enP = puan; en = y; }
    }
    kullanilan[en.id] = (kullanilan[en.id] || 0) + 1;
    const gram = besin(it.f, it.g).k / (en.k || 1) * 100;
    return {f: en.id, g: yuvarla(en, en.a ? gram / en.a : gram)};
  };
  const plan = temel.map(gun => OGUN_TANIM.map((o, i) => ({...o, ogeler: birlestir(gun[i].map(([f, g]) => degistir({f, g})))})));
  plan.forEach(gun => gunuOlcekle(gun, p, izinli));
  return plan;
}
function gunuOlcekle(gun, p, izinli){
  const hepsi = () => gun.flatMap(o => o.ogeler);
  const top = r => topla(hepsi().filter(it => !r || rol(yemek(it.f)) === r));
  const uygula = (r, k) => gun.forEach(o => o.ogeler.forEach(it => { const f = yemek(it.f); if (rol(f) === r) it.g = yuvarla(f, it.g * k); }));
  const tumu = () => top().k;
  // 1) Protein hedefi
  const pP = top('P').p, pDiger = tumu() ? top().p - pP : 0;
  if (pP > 0) uygula('P', sinirla((p.protein - pDiger) / pP, 0.6, 2.5));
  // 2) Karbonhidratla kaloriyi tuttur
  const kAyarla = () => { const kK = top('K').k; if (kK > 0) uygula('K', sinirla((p.kcal - (tumu() - kK)) / kK, 0.35, 2.5)); };
  kAyarla();
  // 3) Yağ kaynaklarıyla ince ayar
  const kY = top('Y').k;
  if (kY > 0) uygula('Y', sinirla((kY + p.kcal - tumu()) / kY, 0.5, 1.6));
  // 4) Hâlâ eksikse ara öğünlere sırayla besleyici ek (kas/kilo alma gibi yüksek kalorili hedefler)
  const uygunEkler = EK_SECENEK.filter(s => s.every(([f]) => izinli(yemek(f))));
  for (const [i, ogunId] of ['ara1','gece','kahvalti'].entries()){
    if (tumu() >= p.kcal * 0.95 || !uygunEkler.length) break;
    const ek = uygunEkler[i % uygunEkler.length], ogun = gun.find(o => o.id === ogunId) || gun[0];
    ogun.ogeler = birlestir(ogun.ogeler.concat(ek.map(([f, g]) => ({f, g}))));
    kAyarla();
  }
  // 5) Şeker sınırı aşılıyorsa şekerli kalemleri (meyve, süt ürünü, tatlı) azalt, kaloriyi tahılla geri tamamla
  const sekerli = f => !['sebze','salata','corba'].includes(f.kat) && f.k && f.s * 4 / f.k >= 0.2;
  const sToplam = topla(hepsi().filter(it => sekerli(yemek(it.f)))).s;
  if (top().s > p.seker * 1.05 && sToplam > 0){
    const k = sinirla(1 - (top().s - p.seker) / sToplam, 0.5, 1);
    gun.forEach(o => o.ogeler.forEach(it => { const f = yemek(it.f); if (sekerli(f)) it.g = yuvarla(f, it.g * k); }));
    kAyarla();
  }
  // 6) Hâlâ fazlaysa sebze dışındaki sabit kalemleri (karışık yemek, süt ürünü) biraz azalt
  if (tumu() > p.kcal * 1.07){
    const azalt = f => rol(f) === 'S' && !['sebze','salata'].includes(f.kat);
    const kS = topla(hepsi().filter(it => azalt(yemek(it.f)))).k;
    if (kS > 0){ const k = sinirla((kS + p.kcal - tumu()) / kS, 0.7, 1); gun.forEach(o => o.ogeler.forEach(it => { const f = yemek(it.f); if (azalt(f)) it.g = yuvarla(f, it.g * k); })); }
  }
}
// ---------- Fark rozetleri ----------
function fmtFark(n, birim=''){
  const a = Math.abs(n) < 10 ? Math.round(n * 10) / 10 : Math.round(n);
  if (a === 0) return '±0' + birim;
  return (a > 0 ? '+' : '−') + sayi(Math.abs(a)) + birim;
}
// Faydalı (protein, lif): artış yeşil. Sınırlanacak (kalori, karb, şeker, yağ): artış kırmızı.
const FAYDALI = [['p','protein','g'],['l','fiber','g']];
const SINIRLI = [['k','calories','kcal'],['c','carb','g'],['s','sugar','g'],['y','fat','g']];
const KISA = {p:'aP', l:'aL', k:'kcal', c:'aK', s:'aS', y:'aY'};
const farkSinif = (fark, faydali) => Math.abs(fark) < 0.5 ? 'eq' : ((fark > 0) === faydali ? 'up' : 'bad');
function farkPilleri(eski, yeni){
  const pil = (a, faydali) => `<span class="pl ${farkSinif(yeni[a]-eski[a], faydali)}">${T(KISA[a])} ${fmtFark(yeni[a]-eski[a])}</span>`;
  return '<div class="pills">' + FAYDALI.map(([a]) => pil(a, true)).join('') + SINIRLI.map(([a]) => pil(a, false)).join('') + '</div>';
}

// ---------- Arama (regex; büyük/küçük harf, Türkçe/Almanca/Rusça/Arapça harf farkı duyarsız) ----------
const HARF = {a:'aâä', c:'cç', g:'gğ', i:'iıİI', o:'oö', s:'sşß', u:'uüû', 'е':'её', 'ا':'اأإآ', 'ه':'هة', 'ي':'يى'};
const KATLA = {'ç':'c','ğ':'g','ı':'i','i':'i','ö':'o','ş':'s','ü':'u','â':'a','û':'u','ä':'a','ß':'s','ё':'е','أ':'ا','إ':'ا','آ':'ا','ة':'ه','ى':'ي'};
function kelimeDeseni(w){
  return [...w.toLocaleLowerCase(dil === 'tr' ? 'tr-TR' : undefined)].map(ch => {
    const kok = KATLA[ch] || ch;
    if (HARF[kok]) return '[' + HARF[kok] + HARF[kok].toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('');
}
// "tavuk haşlama" → kelimelerin hepsi; "balık|yumurta" veya "balık, yumurta" → herhangi biri
function aramaHazirla(q){
  const alternatifler = q.split(/[|,،]/).map(s => s.trim()).filter(Boolean).map(s => s.split(/\s+/).map(w => new RegExp(kelimeDeseni(w), 'i')));
  const hepsi = alternatifler.flat().map(r => r.source);
  return {alternatifler, isaret: hepsi.length ? new RegExp('(' + hepsi.join('|') + ')', 'gi') : null};
}
function aramaPuani(f, A){
  const metin = `${f.ad} ${(f.n || []).join(' ')} ${katAd(f.kat)} ${f.e}`;
  let enIyi = -1;
  for (const kelimeler of A.alternatifler){
    if (!kelimeler.every(r => r.test(metin))) continue;
    let p = 0;
    kelimeler.forEach((r, i) => {
      const m = f.ad.match(r);
      if (!m) p += 1;
      else if (m.index === 0) p += i === 0 ? 8 : 4;
      else if (/[\s(]/.test(f.ad[m.index - 1])) p += 3;
      else p += 2;
    });
    enIyi = Math.max(enIyi, p);
  }
  return enIyi;
}
const isaretle = (ad, A) => A && A.isaret ? ad.split(A.isaret).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join('') : esc(ad);

// ---------- Tarih ve gün menüsü ----------
const tarihAnahtar = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const tarihDen = k => { const [y, m, g] = k.split('-').map(Number); return new Date(y, m - 1, g, 12); };
const bugunK = () => tarihAnahtar(new Date());
const haftaGunu = k => (tarihDen(k).getDay() + 6) % 7;
const gunEkle = (k, n) => { const d = tarihDen(k); d.setDate(d.getDate() + n); return tarihAnahtar(d); };
const gunKisa = k => tarihDen(k).toLocaleDateString(LOC(), {weekday: RTL() ? 'narrow' : 'short'}).replace('.', '');
const gunUzun = k => tarihDen(k).toLocaleDateString(LOC(), {weekday:'long'});
const etiket = k => tarihDen(k).toLocaleDateString(LOC(), {day:'numeric', month:'short'}) + ' ' + tarihDen(k).toLocaleDateString(LOC(), {weekday:'short'});
const gecmisMi = k => k < bugunK();
// 4 haftalık dönüşte bu tarihin hafta sırası (0..3); başlangıç planın oluşturulduğu haftanın pazartesisi
function haftaNo(k){
  const n = D.planlar.length || 1, bas = D.planBaslangic || gunEkle(bugunK(), -haftaGunu(bugunK()));
  const fark = Math.round((tarihDen(gunEkle(k, -haftaGunu(k))) - tarihDen(bas)) / 6048e5);
  return ((fark % n) + n) % n;
}

let aktif = bugunK(), detayAcik = false;
const kayitOku = k => D.kayit[k] || {yendi:{}, su:0};
function kayitAl(k){ if (!D.kayit[k]) D.kayit[k] = {yendi:{}, su:0}; return D.kayit[k]; }
// Günün menüsü: o güne ait kayıt varsa o, yoksa haftalık şablon
// Miktar hafızası: bir öğünde yemeğin miktarı değişince, şablondan gelen günlerde aynı öğündeki aynı yemek o miktarla gelir
function sablon(k){
  const gun = D.planlar[haftaNo(k)][haftaGunu(k)], m = D.miktar || {};
  if (!Object.keys(m).length) return gun;
  return gun.map(o => m[o.id] ? {...o, ogeler: o.ogeler.map(it => m[o.id][it.f] != null ? {...it, g: m[o.id][it.f]} : it)} : o);
}
function miktarHatirla(ogunId, f, g){ (D.miktar || (D.miktar = {}))[ogunId] = {...(D.miktar[ogunId] || {}), [f]: g}; }
const menuOku = k => (D.kayit[k] && D.kayit[k].ogunler) || sablon(k);
function menuYaz(k){ const r = kayitAl(k); if (!r.ogunler) r.ogunler = kopya(sablon(k)); return r.ogunler; }
const yenenToplam = k => { const r = kayitOku(k); return topla(menuOku(k).filter(o => r.yendi[o.id]).flatMap(o => o.ogeler)); };
const kayitVar = k => { const r = D.kayit[k]; return !!r && (r.su > 0 || Object.values(r.yendi).some(Boolean)); };

// Hedef çubuğu: hedefe kadar renkli, hedefi aşan kısım kırmızı; hedef noktası çizgiyle işaretli
// Sınır hedeflerinde (kalori, karb, şeker, yağ) aşım kırmızı; "en az" hedeflerinde (protein, lif, su) aşım yeşil
function cubuk(v, hedef, enAz = false){
  if (!hedef) return '<div class="bar"></div>';
  const olcek = Math.max(v, hedef), ok = Math.min(v, hedef) / olcek * 100, fazla = Math.max(0, v - hedef) / olcek * 100;
  return `<div class="bar"><i class="ok" style="width:${ok.toFixed(1)}%"></i>${fazla > 0 ? `<i class="over${enAz ? ' iyi' : ''}" style="width:${fazla.toFixed(1)}%"></i><u style="inset-inline-start:${(hedef / olcek * 100).toFixed(1)}%"></u>` : ''}</div>`;
}
// Çubuğun altındaki satır: kalan miktar, kırmızı aşım ya da yeşil "hedef tamam"
function kalanYazi(v, hedef, birim, enAz = false){
  if (v <= hedef) return `<div class="kalan">${T('remaining', {n: yuv(hedef - v) + ' ' + birim})}</div>`;
  const n = yuv(v - hedef) + ' ' + birim;
  return enAz ? `<div class="kalan tamam">${T('reached', {n})}</div>` : `<div class="kalan asti">${T('over', {n})}</div>`;
}

// ---------- Değişiklik işlemleri (hepsi loglanır) ----------
function suDegis(yeni){
  const k = kayitAl(aktif), eski = k.su, max = Math.ceil(D.profil.su / D.profil.bardak) + 8;
  yeni = sinirla(yeni, 0, max);
  if (yeni === eski) return;
  k.su = yeni;
  logEkle('su', aktif, T('lWater', {a: eski, b: yeni, l: litre(yeni * D.profil.bardak)}));
  kaydet(); ciz();
}
function yedimDegis(oi){
  const o = menuYaz(aktif)[oi], k = kayitAl(aktif);
  k.yendi[o.id] = !k.yendi[o.id];
  const t = topla(o.ogeler);
  logEkle('yedim', aktif, k.yendi[o.id]
    ? T('lAte', {o: ogunAd(o), k: yuv(t.k), l: o.ogeler.map(i => yemek(i.f).ad + ' ' + miktarYazi(yemek(i.f), i.g)).join(', ') || '—'})
    : T('lUnate', {o: ogunAd(o)}));
  kaydet(); ciz();
}
function ogeEkle(oi, f, g){
  const o = menuYaz(aktif)[oi], y = yemek(f);
  o.ogeler.push({f, g});
  sonSecimKaydet(o.id, f); miktarHatirla(o.id, f, g);
  logEkle('ekle', aktif, T('lAdd', {o: ogunAd(o), y: y.ad, m: miktarYazi(y, g)}));
  kaydet(); ciz();
  toast(gecmisMi(aktif) ? T('tAddedPast', {d: etiket(aktif)}) : T('tAdded', {y: y.ad}));
}
function ogeDegis(oi, ii, f, g){
  const o = menuYaz(aktif)[oi], eski = o.ogeler[ii];
  if (eski.f === f && eski.g === g) return;
  o.ogeler[ii] = {f, g};
  sonSecimKaydet(o.id, f); miktarHatirla(o.id, f, g);
  const ey = yemek(eski.f), yy = yemek(f);
  logEkle('degis', aktif, T('lChange', {o: ogunAd(o), a: `${ey.ad} ${miktarYazi(ey, eski.g)}`, b: `${yy.ad} ${miktarYazi(yy, g)}`}));
  kaydet(); ciz(); toast(T('tReplaced', {y: yy.ad}));
}
function miktarDegis(oi, ii, ham){
  const o = menuYaz(aktif)[oi], it = o.ogeler[ii], f = yemek(it.f), g = miktarOku(f, ham);
  if (it.g === g){ ciz(); return; }
  // Aynı yemeğe art arda basılırsa (10 sn içinde) tek log satırında birleştir: ilk değer → son değer
  const anahtar = `${aktif}|${oi}|${ii}|${it.f}`, son = D.log[D.log.length - 1];
  if (son && son.tur === 'gram' && son.a === anahtar && Date.now() - son.t < 10000){
    son.m = T('lAmount', {o: ogunAd(o), y: f.ad, a: son.ilk, b: miktarYazi(f, g)}); son.t = Date.now();
  } else {
    logEkle('gram', aktif, T('lAmount', {o: ogunAd(o), y: f.ad, a: miktarYazi(f, it.g), b: miktarYazi(f, g)}));
    Object.assign(D.log[D.log.length - 1], {a: anahtar, ilk: miktarYazi(f, it.g)});
  }
  it.g = g; miktarHatirla(o.id, it.f, g); kaydet(); ciz();
}
// − / + düğmesi: adette 1'er (1'in altında 0,5), gramda 10'ar (30 g'a kadar 5'er); en az bir adım kalır
function miktarAdim(oi, ii, yon){
  const it = menuOku(aktif)[oi].ogeler[ii], f = yemek(it.f), m = it.g;
  const adim = f.a ? (m + yon < 1 || (yon > 0 && m < 1) ? 0.5 : 1) : (m + yon * 5 <= 30 ? 5 : 10);
  miktarDegis(oi, ii, Math.max(f.a ? 0.5 : 5, m + yon * adim));
}
function ogeSil(oi, ii){
  const o = menuYaz(aktif)[oi], it = o.ogeler[ii], f = yemek(it.f);
  o.ogeler.splice(ii, 1);
  logEkle('sil', aktif, T('lRemove', {o: ogunAd(o), y: f.ad, m: miktarYazi(f, it.g)}));
  kaydet(); ciz(); toast(T('tRemoved', {y: f.ad}));
}
// ---------- Son seçilenler (öğün bazında) ----------
function sonSecimKaydet(ogunId, f){
  const s = D.son[ogunId] || (D.son[ogunId] = {});
  s[f] = {n: (s[f] ? s[f].n : 0) + 1, t: Date.now()};
}
function sonSecilenler(ogunId){
  const puan = {};
  D.planlar.flat().forEach(gun => gun.filter(o => o.id === ogunId).forEach(o => o.ogeler.forEach(it => puan[it.f] = (puan[it.f] || 0) + 1)));
  for (const [f, v] of Object.entries(D.son[ogunId] || {})) puan[f] = (puan[f] || 0) + v.n * 10 + v.t / 1e14;
  const varOlan = new Set(tumYemekler().map(f => f.id));
  return Object.entries(puan).filter(([f]) => varOlan.has(f)).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([f]) => f);
}

// ---------- Yemek seç / değiştir / kıyasla ----------
let SE = null;
const SON = '__son', TUMU = '__tumu', BENZER = '__benzer';
// Değiştir/Kıyasla için benzer yemekler: aynı tür (ad/etiket ortak kelime, ör. "ekmek") önce, sonra aynı gruptaki besin değeri en yakınlar
// Türü değil niteliği/pişirmeyi anlatan kelimeler benzerlikte sayılmaz (ör. "tam buğday" ekmekle makarnayı eşleştirmesin)
const NITELIK = new Set(['tam','bugday','kepekli','haslama','haslanmis','izgara','firin','tava','yarim','yagli','sekersiz','tuzsuz','sade','light','kahvalti','yemek','yemegi','zeytinyagli','yogurtlu','kimyonlu','sumakli','derisiz','suzulmus','bugulama']);
const KAT_SIRA = ['et','balik','yumurta','sut','bitkisel','baklagil','anayemek','salata','sebze','tahil','pilav','corba','meyve','kuruyemis','atistirmalik','icecek','ozel'];
const GRUP = {et:'protein', balik:'protein', yumurta:'protein', bitkisel:'protein'};
function benzerler(fid){
  const f = yemek(fid), uygun = profilUygun(D.profil);
  const sade = t => t.toLocaleLowerCase('tr-TR').replace(/[çğıöşüâû]/g, c => KATLA[c] || c);
  const kelimeler = y => new Set(sade(`${(y.n || [y.ad])[0]} ${y.e || ''}`).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !NITELIK.has(w)));
  const kf = kelimeler(f), grup = y => GRUP[y.kat] || y.kat;
  const oz = y => { const k = y.k || 1; return [y.p * 4 / k, y.c * 4 / k, y.y * 9 / k]; };
  const [a1, a2, a3] = oz(f);
  return tumYemekler().filter(y => y.id !== f.id && uygun(y)).map(y => {
    const ortak = [...kelimeler(y)].filter(w => kf.has(w)).length;
    if (!ortak && grup(y) !== grup(f)) return null;
    const [b1, b2, b3] = oz(y);
    const puan = Math.abs(a1 - b1) * 2 + Math.abs(a2 - b2) + Math.abs(a3 - b3) - ortak * 0.9 + (y.kat === f.kat ? 0 : 0.8) - (f.b && y.b === f.b ? 0.8 : 0) + (DOKTOR_DISI.has(y.id) ? 0.5 : 0);   // aynı birim (ör. dilim) öne
    return [y.id, puan];
  }).filter(Boolean).sort((a, b) => a[1] - b[1]).slice(0, 20).map(([id]) => id);
}
function secimAc(opts){
  const ogun = menuOku(aktif)[opts.oi];
  SE = {...opts, ogunId: ogun.id, q:'', sec:null, g:0};
  SE.son = sonSecilenler(ogun.id).filter(f => profilUygun(D.profil)(yemek(f)));
  SE.mevcut = SE.ii !== undefined ? {...ogun.ogeler[SE.ii]} : null;
  SE.benzer = SE.mevcut ? benzerler(SE.mevcut.f) : [];
  SE.kat = SE.benzer.length ? BENZER : SE.son.length ? SON : TUMU;   // değiştir/kıyasla: benzerleri; ekle: son seçilenler
  const baslik = T({ekle:'pAdd', degis:'pChange', kiyas:'pCompare'}[SE.mod], {o: ogunAd(ogun)});
  ac(esc(baslik) + (gecmisMi(aktif) ? ` <span class="tag">${etiket(aktif)}</span>` : ''));
  listeGorunumu();
}
// Kıyaslarken adayın başlangıç miktarı: aynı ağırlığa denk gelen miktar
function esdegerMiktar(adayId){
  const aday = yemek(adayId);
  if (!SE.mevcut) return aday.d;
  const cf = yemek(SE.mevcut.f);
  if (aday.a && cf.a && aday.b === cf.b) return SE.mevcut.g;
  const gram = gramOf(cf, SE.mevcut.g);
  return aday.a ? Math.max(0.5, Math.round(gram / aday.a * 2) / 2) : yuv(gram);
}
function mevcutKart(){
  if (!SE.mevcut) return '';
  const f = yemek(SE.mevcut.f);
  return `<div class="cur"><small>${T('current')}</small><b>${esc(f.ad)} · ${miktarYazi(f, SE.mevcut.g)}</b><br><small>${bilgi(besin(SE.mevcut.f, SE.mevcut.g))}</small></div>`;
}
function listeGorunumu(){
  const lejant = `<div class="legend"><span><i style="background:var(--green)"></i>${T('good')}</span><span><i style="background:var(--red)"></i>${T('bad')}</span><span>${T('legendRule')}</span></div>`;

}
function kategoriCiz(){
  const uygun = profilUygun(D.profil);
  const katlar = (SE.benzer.length ? [BENZER] : []).concat(SE.son.length ? [SON] : []).concat([TUMU, ...[...new Set(tumYemekler().filter(uygun).map(f => f.kat))].sort((a, b) => KAT_SIRA.indexOf(a) - KAT_SIRA.indexOf(b))]);
  const ad = k => k === BENZER ? T('similar') : k === SON ? T('recent') : k === TUMU ? T('all') : katAd(k);
  const daralt = SE.benzer.length > 0;   // değiştir/kıyasla modunda gruplar başta kapalı

  };

  }).join('') : `<li class="empty">${T('noResult')}</li>`;
  $('flist').querySelectorAll('[data-fid]').forEach(b => b.onclick = () => { SE.sec = b.dataset.fid; SE.g = esdegerMiktar(SE.sec); detayGorunumu(); });

function kiyasKarti(eskiF, eskiM, yeniF, yeniM){

  const satir = ([a, ad, birim], faydali) => {

  };
  const iyi = [], kotu = [];
  const yon = (f, ad) => T(f > 0 ? 'more' : 'less', {x: T(ad).toLocaleLowerCase(LOC())});
  FAYDALI.forEach(([a, ad]) => { const f = yeni[a] - eski[a]; if (Math.abs(f) >= 0.5) (f > 0 ? iyi : kotu).push(yon(f, ad)); });
  SINIRLI.forEach(([a, ad]) => { const f = yeni[a] - eski[a]; if (Math.abs(f) >= (a === 'k' ? 5 : 0.5)) (f < 0 ? iyi : kotu).push(yon(f, ad)); });
  const yorum = (iyi.length ? `<span class="g">✔ ${iyi.join(', ')}</span>` : '') + (iyi.length && kotu.length ? '<br>' : '') + (kotu.length ? `<span class="r">✖ ${kotu.join(', ')}</span>` : '') || T('same');
  return `<div class="kiyas">
    <div class="cmp-top"><div><small>${T('now')}</small><b>${esc(eskiF.ad)}</b><span>${miktarYazi(eskiF, eskiM)}</span></div><div class="arrow">${T('arrow')}</div><div><small>${T('newer')}</small><b>${esc(yeniF.ad)}</b><span>${miktarYazi(yeniF, yeniM)}</span></div></div>

    <div class="grp limit"><h4>${T('limitGroup')}</h4>${SINIRLI.map(s => satir(s, false)).join('')}</div>
  </div>`;
}
function detayGorunumu(){

  if (ad === 'olcu' && !(W.yas >= 14 && W.yas <= 100 && W.boy >= 120 && W.boy <= 230 && W.kilo >= 30 && W.kilo <= 300)) return T('errBody');

  if (ad === 'kilo' && ((W.hedef === 'ver' && !(W.hedefKilo < W.kilo && W.hedefKilo >= 30)) || (W.hedef === 'al' && !(W.hedefKilo > W.kilo)))) return T('errTarget');
  return '';
}
function wBitir(){
  const h = hedefHesapla(W);

}
$('kurulum').addEventListener('click', e => {

    if (W.hedef === 'ver' && !(W.hedefKilo < W.kilo)) W.hedefKilo = Math.round(Math.max(W.kilo - 5, 18.5 * Math.pow(W.boy / 100, 2)));
    if (W.hedef === 'al' && !(W.hedefKilo > W.kilo)) W.hedefKilo = Math.round(W.kilo + 4);
    wCiz(); return;
  }
  if (ds.wodak){ const o = new Set(W.odaklar || []); o.has(ds.wodak) ? o.delete(ds.wodak) : o.add(ds.wodak); W.odaklar = [...o]; wCiz(); return; }
  if (ds.wakt){ W.aktivite = +ds.wakt; wCiz(); return; }

  if (ds.wpreset){ W.haric = {hepsi:[], vejetaryen:['m','c','f'], vegan:['m','c','f','e','d']}[ds.wpreset]; wCiz(); return; }
  if (ds.wharic){ const h = new Set(W.haric); h.has(ds.wharic) ? h.delete(ds.wharic) : h.add(ds.wharic); W.haric = [...h]; wCiz(); return; }
  if (ds.wadim){
    const alan = ds.wadim, yeni = Math.round((+W[alan] + (+ds.yon)) * 2) / 2;
    W[alan] = Math.max(0, yeni); $('w_' + alan).value = sayi(W[alan]); wSureYaz(); return;
  }
  if (ds.wgeri){ wHata = ''; wAdim = Math.max(0, wAdim - 1); wCiz(); return; }
  if (ds.wileri){
    const ad = wAdimlar()[wAdim];
    wHata = wDogrula(ad);
    if (wHata){ wCiz(); return; }
    if (ad === 'ozet'){ wBitir(); return; }
    wAdim++; wCiz();
  }
});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
// Telefon klavyesi: görünen alanı ölç, klavye açıksa işaretle, odaklanan alanı ortaya kaydır
let enBuyukYukseklik = 0, sonGenislik = 0;
function gorunenAlan(){
  const v = window.visualViewport; if (!v) return;
  if (Math.abs(v.width - sonGenislik) > 40){ sonGenislik = v.width; enBuyukYukseklik = 0; }   // döndürme/pencere değişimi
  const odak = document.activeElement;
  const yaziAlani = odak && /^(INPUT|TEXTAREA)$/.test(odak.tagName) && odak.type !== 'file';
  if (!yaziAlani) enBuyukYukseklik = Math.max(enBuyukYukseklik, v.height, window.innerHeight);
  const r = document.documentElement.style;
  r.setProperty('--vv-h', v.height + 'px');
  r.setProperty('--vv-top', v.offsetTop + 'px');
  document.body.classList.toggle('klavye', !!yaziAlani && v.height < (enBuyukYukseklik || window.innerHeight) * 0.85);
}
window.addEventListener('orientationchange', () => { enBuyukYukseklik = 0; setTimeout(gorunenAlan, 300); });
if (window.visualViewport){
  visualViewport.addEventListener('resize', gorunenAlan);
  visualViewport.addEventListener('scroll', gorunenAlan);
  gorunenAlan();
}
document.addEventListener('focusin', e => {
  if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.type === 'file') return;
  setTimeout(() => { gorunenAlan(); e.target.scrollIntoView({block:'center', behavior:'smooth'}); }, 350);
});
document.addEventListener('focusout', () => setTimeout(gorunenAlan, 100));
