  cIntro:["Hesap açarsan profilin, öğün ve su kayıtların, tartı ve ölçülerin cihazların arasında eşitlenmek için Almanya'daki (AB içi) sunucumuza yazılır. Bu bilgiler sağlık verisi sayılır; işlenmeleri ve yurt dışına aktarılmaları için açık rızan gerekir. Bu veriler reklam için kullanılmaz, üçüncü taraflarla paylaşılmaz ve takip amacıyla işlenmez; verilerini istediğin zaman indirebilir veya silebilirsin.",
    "If you create an account, your profile, meal and water logs, weigh-ins and measurements are stored on our server in Germany (within the EU) so they sync across your devices. This is health data, so we need your explicit consent to process it and transfer it abroad. This data is never used for advertising or shared with third parties, and there is no tracking; you can download or delete your data at any time.",

    "Legst du ein Konto an, werden dein Profil, deine Mahlzeiten- und Wasserprotokolle sowie Wiegungen und Maße auf unserem Server in Deutschland (in der EU) gespeichert, damit sie zwischen deinen Geräten synchron bleiben. Das sind Gesundheitsdaten; für ihre Verarbeitung und Übermittlung ins Ausland brauchen wir deine ausdrückliche Einwilligung. Diese Daten werden nie für Werbung genutzt oder an Dritte weitergegeben, und es gibt kein Tracking; du kannst deine Daten jederzeit herunterladen oder löschen.",
    "إذا أنشأت حساباً فسيُحفَظ ملفك الشخصي وسجلات الوجبات والماء والوزن والقياسات على خادمنا في ألمانيا (داخل الاتحاد الأوروبي) لمزامنتها بين أجهزتك. وهذه بيانات صحية، لذا نحتاج إلى موافقتك الصريحة لمعالجتها ونقلها إلى خارج البلاد. لا تُستخدَم هذه البيانات للإعلانات ولا تُشارَك مع أطراف ثالثة، ولا يوجد تتبّع؛ ويمكنك تنزيل بياناتك أو حذفها في أي وقت."],

function oneriOneAl(ogun, ids){
  const l = OGUN_ONERI[ogun]; if (!l) return;

  l.splice(0, l.length, ...new Set(sonuc));
}

// Eski sürüm verisini yeni yapıya taşı (geçmiş kayıtlar korunur, profil sihirbazda tamamlanır)
function tamamla(x){
  for (const k of ['ozelYemek','log']) if (!x[k]) x[k] = [];
  for (const k of ['son','kayit']) if (!x[k]) x[k] = {};
  if (!x.ayar) x.ayar = {dil:'tr', kurulum:false};
  x.profil = {...BOS_PROFIL, ...x.profil};
  if (!x.profil.haric) x.profil.haric = [];
  if (!x.profil.odaklar) x.profil.odaklar = [];
  if (!x.profil.alerjiler) x.profil.alerjiler = [];
  if (!x.profil.spor || typeof x.profil.spor !== 'object') x.profil.spor = {gun:0, tur:'karma'};
  if (!Array.isArray(x.profil.takviye)) x.profil.takviye = [];
  if (!Array.isArray(x.profil.antrenmanGunleri)) x.profil.antrenmanGunleri = antrenmanVarsayilan(x.profil.spor.gun || 0);
  if (!Array.isArray(x.regl)) x.regl = [];
  // Eski tek seçimli "Kan şekeri" hedefi → kilo hedefi + kan şekeri odağı
  if (x.profil.hedef === 'seker'){
    x.profil.hedef = vki(x.profil) >= 25 ? 'ver' : 'koru';
    if (!x.profil.odaklar.includes('seker')) x.profil.odaklar.push('seker');
  }
  x.ozelYemek.forEach(f => {
    if (f.s == null) f.s = 0; if (f.l == null) f.l = 0; if (f.a == null) f.a = 0; if (!f.b) f.b = f.a ? 'adet' : '';
    if (!f.e) f.e = ''; f.x = f.x || ''; f.kat = 'ozel';
  });
  if ((x.surum || 0) < 3){
    // v2: adetli yemekler gram tutuluyordu → adet/dilime çevir
    const cevir = ogunler => ogunler.forEach(o => o.ogeler.forEach(it => {
      const f = YEMEKLER.find(y => y.id === it.f);
      if (f && f.a) it.g = Math.max(0.5, Math.round(it.g / f.a * 2) / 2);
    }));
    Object.values(x.kayit).forEach(r => { if (r.ogunler) cevir(r.ogunler); });
  }
  if ((x.surum || 0) < 6) (x.plan || (x.planlar && x.planlar[0]) || []).forEach(gun => gun.forEach(o => o.ogeler.forEach(it => {
    const f = YEMEKLER.find(y => y.id === it.f);
    if (f && f.kat === 'meyve' && f.a && it.g > 2) it.g = 2;
  })));
  // Tek haftalık eski plan → 1. hafta (kullanıcının değişiklikleri korunur); eksik haftalar açılışta profile göre üretilir
  if (!x.planlar){ x.planlar = x.plan && x.plan.length ? [x.plan] : []; delete x.plan; }
  if (!x.planBaslangic) x.planBaslangic = '';
  if ((x.surum || 0) < 8){
    // v8: gramdan adede dönen yemeklerin kayıtlı miktarları adede çevrilir (plan, günlük menüler, miktar hafızası, koç programı)
    const cevir = it => { const a = BIRIM_GECIS[it.f]; if (a && it.g > 20) it.g = Math.max(0.5, Math.round(it.g / a * 2) / 2); };
    const ogunler = l => (l || []).forEach(o => (o.ogeler || []).forEach(cevir));
    (x.planlar || []).forEach(h => h.forEach(ogunler));
    Object.values(x.kayit).forEach(r => ogunler(r.ogunler));
    if (x.oncekiPlan && x.oncekiPlan.planlar) x.oncekiPlan.planlar.forEach(h => h.forEach(ogunler));
    for (const m of [x.miktar, x.oncekiPlan && x.oncekiPlan.miktar]) if (m) Object.values(m).forEach(o => { for (const f in o) if (BIRIM_GECIS[f] && o[f] > 20) o[f] = Math.max(0.5, Math.round(o[f] / BIRIM_GECIS[f] * 2) / 2); });
    if (x.koc && x.koc.gun) x.koc.gun.forEach(g => Object.values(g).forEach(l => (l || []).forEach(cevir)));
  }
  x.surum = SURUM;
  return x;
}

let D = null, depoCalisiyor = true;

function lsOku(){
  try {
    const s = localStorage.getItem(ANAHTAR) || localStorage.getItem(ESKI_ANAHTAR);
    return s ? JSON.parse(s) : null;
  } catch(e){ depoCalisiyor = false; return null; }
}
function idbAc(){
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('diyet_uygulamasi', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('veri');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch(e){ rej(e); }
  });
}
async function idbOku(){
  try {
    const db = await idbAc();
    return await new Promise(res => {
      const q = db.transaction('veri').objectStore('veri').get(ANAHTAR);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch(e){ return null; }
}
async function idbYaz(veri){
  try { const db = await idbAc(); db.transaction('veri','readwrite').objectStore('veri').put(veri, ANAHTAR); } catch(e){}
}

function ipucu(f){
  if (f.a) return T('piece', {b: birimAd(f), g: f.a});
  if (!f.u) return '';
  const [tur, g] = f.u.split(':');
  return S['h_' + tur] ? T('h_' + tur, {g}) : '';
}
function besin(fid, m){
  const f = yemek(fid), x = gramOf(f, +m || 0) / 100;
  return {k:f.k*x, p:f.p*x, c:f.c*x, s:(f.s||0)*x, y:f.y*x, l:(f.l||0)*x};
}
function topla(ogeler){
  return ogeler.reduce((t, o) => { const b = besin(o.f, o.g); for (const a in t) t[a] += b[a]; return t; }, {k:0,p:0,c:0,s:0,y:0,l:0});
}

const sinirla = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- Hedef hesaplama (Mifflin-St Jeor, FAO/WHO PAL, ISSN, WHO) ----------
const PAL = [1.2, 1.375, 1.55, 1.725, 1.9];
const PROTEIN_KG = {ver:1.8, sekil:2.0, koru:1.2, kas:1.8, al:1.6};

const ODAKLAR = [['seker','🩺',''], ['tansiyon','❤️','t'], ['kolesterol','🫀','y']];
function vki(p){ return p.kilo / Math.pow(p.boy / 100, 2); }
function vkiSinif(b){ return b < 18.5 ? 'bmi1' : b < 25 ? 'bmi2' : b < 30 ? 'bmi3' : 'bmi4'; }
function hedefHesapla(p){
  const bmr = 10 * p.kilo + 6.25 * p.boy - 5 * p.yas + (p.cins === 'k' ? -161 : 5);
  // Düzenli spor: günlük hareket seçimine küçük ek katsayı (haftada 3–4 gün +0,05, 5+ gün +0,10); seçim bozulmaz, yalnız düzeltme
  const sporGun = p.spor && p.spor.gun || 0, sporEk = sporGun >= 5 ? 0.1 : sporGun >= 4 ? 0.05 : 0;
  const tdee = bmr * (PAL[(p.aktivite || 2) - 1] + sporEk);
  const b = vki(p), od = new Set(p.odaklar || []), seker = od.has('seker');
  const hamile = p.cins === 'k' && !!p.hamile, tri = p.trimester || 1;
  let kcal = tdee;
  if (hamile) kcal = tdee + [0, 340, 450][tri - 1];

  else if (p.hedef === 'sekil') kcal = tdee * 0.9;
  else if (p.hedef === 'kas') kcal = tdee * 1.1;
  else if (p.hedef === 'al') kcal = tdee * 1.15;
  const taban = p.cins === 'k' ? 1200 : 1500;
  kcal = Math.round(Math.max(kcal, Math.min(taban, tdee)) / 50) * 50;
  const refKilo = b > 25 ? 25 * Math.pow(p.boy / 100, 2) : p.kilo;
  const pKg = Math.max(PROTEIN_KG[p.hedef] || 1.2, seker ? 1.3 : 0);
  const protein = Math.round(Math.min(hamile ? 1.1 * p.kilo + (tri >= 2 ? 25 : 0) : pKg * refKilo, kcal * 0.35 / 4));
  // Kan şekeri: yağ %30, karbonhidrat en çok %40, şeker %10 · Kolesterol: yağ %28'de kalır, doymuş yağlı kalemler menüden çıkar
  const yag = Math.round(kcal * (seker ? 0.30 : 0.28) / 9);
  let karb = Math.round((kcal - protein * 4 - yag * 9) / 4);
  if (seker) karb = Math.min(karb, Math.round(kcal * 0.40 / 4));
  const sekerG = Math.round(kcal * (seker ? 0.10 : 0.13) / 4);

  const lif = Math.max(Math.round(kcal / 1000 * 14), od.has('kolesterol') || seker ? 30 : 0);

  let hafta = 0;
  if (!hamile && p.hedef === 'ver' && p.hedefKilo < p.kilo) hafta = Math.ceil((p.kilo - p.hedefKilo) / p.hiz);
  if (!hamile && p.hedef === 'al' && p.hedefKilo > p.kilo) hafta = Math.ceil((p.hedefKilo - p.kilo) / 0.35);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), vki:b, kcal, protein, karb, seker: sekerG, yag, lif, su, hafta, sporEk};
}

// ---------- Plan üretici ----------
// Rol: P protein kaynağı, K karbonhidrat kaynağı, Y yağ kaynağı, S sabit (sebze, karışık yemek, içecek)
function rol(f){
  if (!f.k) return 'S';
  const ps = f.p * 4 / f.k, cs = f.c * 4 / f.k, ys = f.y * 9 / f.k;
  if (['et','balik','yumurta','bitkisel'].includes(f.kat) || ps >= 0.4) return 'P';
  if (ys >= 0.6) return 'Y';
  if (cs >= 0.5 && ['tahil','pilav','meyve','baklagil','anayemek'].includes(f.kat)) return 'K';
  return 'S';
}
// Miktarı birime göre yuvarla: yumurta tam adet, diğer adetler 0,5'lik (ekmek en çok 3 dilim; meyve 2 adet, küçük kuru meyve 6); gram 30 altı 5'lik, üstü 10'luk
function yuvarla(f, m){
  if (f.a){
    if (f.kat === 'yumurta') return sinirla(Math.round(m), 1, f.id === 'ybeyaz' ? 6 : 4);
    return sinirla(Math.round(m * 2) / 2, 0.5, f.b === 'dilim' ? 3 : f.kat === 'meyve' ? (f.a <= 20 ? 6 : 2) : 4);
  }
  return sinirla(m < 30 ? Math.round(m / 5) * 5 : Math.round(m / 10) * 10, 5, 400);
}
function birlestir(ogeler){
  const m = new Map();
  ogeler.forEach(it => m.set(it.f, (m.get(it.f) || 0) + it.g));
  return [...m].map(([f, g]) => ({f, g: yuvarla(yemek(f), g)}));
}
// Profile uygun mu: yenmeyenler + sağlık odaklarının dışladığı içerik (tansiyon: tuzlu, kolesterol: doymuş yağı yüksek)
function profilUygun(p){
  const haric = new Set([...(p.haric || []), ...ODAKLAR.filter(([k]) => (p.odaklar || []).includes(k)).map(([, , x]) => x).filter(Boolean)]);
  const alerji = new Set(p.alerjiler || []), hamile = p.cins === 'k' && !!p.hamile;
  return f => !(f.x || '').split('').some(c => haric.has(c)) && !(f.al || []).some(a => alerji.has(a)) && !(hamile && HAMILE_DISI.has(f.id));
}
// 4 haftalık dönen plan: her temel hafta aynı kurallarla profile göre hazırlanır
const planOlustur = p => TEMEL_HAFTALAR.map(h => araOgunEkle(p, haftaOlustur(p, h)));
// Kuşluk ara öğün isteyene: ikindi ara öğününden bir kalem (tercihen meyve) kahvaltıdan sonraya taşınır, günlük kalori değişmez
function araOgunEkle(p, hafta){
  if (!p.ara0) return hafta;
  const izinli = profilUygun(p);
  return hafta.map(gun => {
    if (gun.some(o => o.id === 'ara0')) return gun;
    const ara1 = gun.find(o => o.id === 'ara1'), ogeler = [], sabit = new Set(takviyeIdleri(p));
    const tasinir = ara1 ? ara1.ogeler.filter(it => !sabit.has(it.f)) : [];   // takviye kalemi (whey vb.) yerinde kalır
    if (ara1 && tasinir.length > 1){
      let it = tasinir.find(it => yemek(it.f).kat === 'meyve') || tasinir[tasinir.length - 1];
      ogeler.push(ara1.ogeler.splice(ara1.ogeler.indexOf(it), 1)[0]);
    } else {
      const f = ['elma','mandalina','armut','portakal'].find(id => izinli(yemek(id)));
      if (f) ogeler.push({f, g: 1});
    }
    const ki = gun.findIndex(o => o.id === 'kahvalti');
    return [...gun.slice(0, ki + 1), {id:'ara0', ad:'Kuşluk Ara Öğün', saat:VARSAYILAN_SAAT.ara0, ico:OGUN_IKON.ara0, ogeler}, ...gun.slice(ki + 1)];

function haftaOlustur(p, temel){
  const izinli = profilUygun(p);
  const kullanilan = {};
  // Yenmeyen yemeği, benzer makro dağılımlı izinli bir yemekle aynı kaloride değiştir
  const degistir = it => {
    const f = yemek(it.f);
    if (izinli(f)) return it;
    // Önce akla yatkın karşılık (izinliyse), yoksa makro benzerliğine göre ara
    const tercih = (TERCIH[f.id] || []).map(yemek).find(y => y.id && izinli(y));
    if (tercih){ const gr = besin(it.f, it.g).k / (tercih.k || 1) * 100; return {f: tercih.id, g: yuvarla(tercih, tercih.a ? gr / tercih.a : gr)}; }
    const oz = y => { const k = y.k || 1; return [y.p * 4 / k, y.c * 4 / k, y.y * 9 / k]; };
    const [a1, a2, a3] = oz(f);
    let en = null, enP = 1e9;
    const proteinKat = ['et','balik','yumurta','bitkisel'];
    for (const y of YEMEKLER){
      if (!izinli(y) || DOKTOR_DISI.has(y.id) || y.id === 'whey' || y.id === 'vegan_protein') continue;
      if (SIVI.has(y.id) !== SIVI.has(f.id)) continue;   // içecek yalnız içecekle değişir
      const [b1, b2, b3] = oz(y);
      const katUyum = y.kat === f.kat ? 0 : (proteinKat.includes(f.kat) && proteinKat.includes(y.kat)) ? 0.2 : 0.8;
      const puan = Math.abs(a1 - b1) * 3 + Math.abs(a2 - b2) + Math.abs(a3 - b3) + katUyum + (kullanilan[y.id] || 0) * 0.12;
      if (puan < enP){ enP = puan; en = y; }
    }
    if (!en) return null;   // uygun karşılık yok (ör. çok sayıda alerji): kalem çıkarılır
    kullanilan[en.id] = (kullanilan[en.id] || 0) + 1;
    const gram = besin(it.f, it.g).k / (en.k || 1) * 100;
    return {f: en.id, g: yuvarla(en, en.a ? gram / en.a : gram)};
  };

    aksamIcecekEkle(gun, izinli);                                     // akşam yemeğine içecek (ayran / maden suyu / bitki çayı)
    takviyeKatmani(gun, p, gi);                                       // takviye katmanı: ölçekleme bu kalemlere dokunmaz, kaloriye dahildir
    if (hamile) oneriAgirlik(gun, HAMILE_ONERI, izinli, gi);           // hamilelik: folat/kalsiyum/demir kaynaklarına ağırlık
    gunuOlcekle(gun, p, izinli);
  });

}
// Takviye katmanı: seçilen takviyeler ilgili öğüne sabit miktarla girer; ant olanlar yalnız antrenman günlerinde (gi: 0 Pzt … 6 Paz)
function takviyeKatmani(gun, p, gi){
  const ant = (p.antrenmanGunleri || []).includes(gi);
  for (const k of p.takviye || []){
    const t = TAKVIYE_PLAN[k]; if (!t || (t.ant && !ant)) continue;
    const o = gun.find(o => o.id === t.ogun) || gun[gun.length - 1];
    if (!o.ogeler.some(it => it.f === t.f)) o.ogeler.push({f: t.f, g: t.g});
  }
}
// Öneri listesine ağırlık: aynı grup ve roldeki bir kalem, listedeki izinli bir yemekle aynı kaloride değiştirilir (günde en çok 3; tohum aynı gün için aynı sonucu verir)
const GRUP_ONERI = {et:'protein', balik:'protein', yumurta:'protein', bitkisel:'protein', anayemek:'yemek', baklagil:'yemek', sebze:'sebze', salata:'sebze'};
function oneriAgirlik(gun, liste, izinli, tohum = 0){
  const adaylar = liste.map(yemek).filter(y => y.id && y.kat && izinli(y) && !DOKTOR_DISI.has(y.id));
  if (!adaylar.length) return gun;
  const grup = y => GRUP_ONERI[y.kat] || y.kat;
  let sayi = 0, i = tohum;
  for (const o of gun) for (let k = 0; k < o.ogeler.length && sayi < 3; k++){
    const it = o.ogeler[k], f = yemek(it.f);
    if (!f.kat || liste.includes(f.id) || SIVI.has(f.id)) continue;
    const uygun = adaylar.filter(y => y.id !== f.id && grup(y) === grup(f) && rol(y) === rol(f) && !o.ogeler.some(x => x.f === y.id));
    if (!uygun.length) continue;
    const y = uygun[(i++) % uygun.length], gram = besin(it.f, it.g).k / (y.k || 1) * 100;
    o.ogeler[k] = {f: y.id, g: yuvarla(y, y.a ? gram / y.a : gram)};
    sayi++;

}
// ---------- Diyetisyen porsiyonları ----------
// Plan üretici sürümü: değişince kendi planı olan kullanıcıların şablonu yeniden üretilir (diyetisyen programına dokunulmaz)
const PLAN_SURUM = 2;
const ARA_IDLER = new Set(['ara0', 'ara1', 'gece']);
// İçecekler 1 bardak / fincan sabit kalır (ölçeklenmez, ara öğün kalem sayısına girmez)
const SABIT_ICECEK = ['ayran', 'maden_suyu', 'bitki_cayi', 'kahve', 'cay', 'yesilcay'];
// Porsiyon aralığı [en az, en çok]: adet birimlide adet, diğerlerinde gram (ara öğünde et ve yumurta daha küçük).
// s: kalori hedefi ölçeği (2200 kcal = 1, en çok 1,7): yüksek hedefte üst sınırlar ve ana öğün et/tahıl alt sınırı büyür
function porsiyonAralik(f, ogunId, s = 1){
  const ara = ARA_IDLER.has(ogunId);
  if (ara){
    // Ara öğün: tek oturuşta yenebilecek porsiyon; kalori gerekiyorsa kalem büyümez, 3. kalem eklenir (araTamamla)
    if (f.a){
      if (f.kat === 'meyve') return f.a <= 20 ? [2, 5] : f.id === 'avokado' ? [0.5, 0.5] : f.a >= 100 ? [1, 1] : [1, 2];
      if (f.kat === 'yumurta') return [1, 2];
      if (f.kat === 'tahil') return [1, 2];
      if (f.kat === 'atistirmalik') return [1, 3];
      return [1, 2];
    }
    if (SIVI.has(f.id)) return [150, 250];
    switch (f.kat){
      case 'kuruyemis': return ['zeytinyagi', 'keten', 'chia'].includes(f.id) ? [5, 10] : f.id === 'fistikezme' ? [10, 20] : [10, 30];
      case 'sut': return f.id === 'lor' ? [30, 80] : [100, 200];
      case 'tahil': return f.id === 'yulaf' ? [30, 50] : [30, 60];
      case 'meyve': return [100, 200];
      case 'atistirmalik': return f.id === 'leblebi' ? [20, 30] : [100, 150];
      case 'et': case 'balik': case 'bitkisel': return [60, 100];
      default: return [10, 200];
    }
  }

    if (f.kat === 'yumurta') return [ara || s < 1.3 ? 1 : 2, ara ? 2 : ust(3, 4)];
    if (f.kat === 'tahil') return f.b === 'dilim' ? [1, ogunId === 'kahvalti' ? ust(3, 4) : ust(2, 3)] : f.id === 'lavas' ? [0.5, 1] : [1, ust(3, 4)];
    if (f.kat === 'meyve') return f.a <= 20 ? [2, ust(5, 8)] : f.id === 'avokado' ? [0.5, 1] : f.a >= 100 ? [1, 1] : [1, 2];
    if (f.id === 'zeytin') return [3, ust(8, 10)];
    if (f.kat === 'sut') return [1, ust(3, 4)];
    if (f.kat === 'anayemek') return [2, ust(6, 8)];
    if (f.kat === 'atistirmalik') return [1, 3];
    return [1, 3];
  }
  if (SIVI.has(f.id)) return [150, ust(300, 400)];
  switch (f.kat){
    case 'et': case 'balik': return ara ? [60, 120] : [alt(90), ust(220, 280)];
    case 'bitkisel': return [80, ust(200, 260)];
    case 'yumurta': return [100, ust(250, 300)];
    case 'kuruyemis': return ['zeytinyagi', 'keten', 'chia'].includes(f.id) ? [5, ust(15, 25)] : f.id === 'fistikezme' ? [10, ust(20, 35)] : [10, ust(30, 50)];
    case 'sut': return f.id === 'lor' ? [30, ust(100, 150)] : [100, ust(250, 300)];
    case 'tahil': return f.id === 'yulaf' ? [30, ust(80, 100)] : [80, ust(200, 250)];
    case 'pilav': return [alt(80), ust(200, 300)];
    case 'baklagil': return [60, ust(150, 200)];
    case 'meyve': return [100, 250];
    case 'anayemek': case 'corba': return [150, ust(350, 400)];
    case 'salata': case 'sebze': return [80, 300];
    case 'atistirmalik': return f.id === 'leblebi' ? [20, ust(40, 50)] : [80, ust(200, 250)];
    default: return [5, 400];

}
// Miktarı porsiyon aralığına oturt; adetler tam sayı ("3,5 zeytin", "yarım elma" olmaz; lavaş ve avokado yarım olabilir), gramlar 5/10'luk
function porsiyon(f, ogunId, m, s = 1){
  const [a, b] = porsiyonAralik(f, ogunId, s), x = sinirla(m, a, b);
  if (!f.a) return yuvarla(f, x);
  return ['lavas', 'avokado'].includes(f.id) ? sinirla(Math.round(x * 2) / 2, a, b) : sinirla(Math.round(x), Math.ceil(a), b);
}
// Eksik kalori: ara öğüne kalem eklenmez; öğle/akşama tam tahıllı garnitür, gerekirse kahvaltıya tek yoğun kalem
const GARNITUR = ['bulgur', 'kinoa', 'tammakarna', 'patates_firin'];
const ARA_TAMAMLAYICI = [['muz', 1], ['ceviz', 20], ['badem', 20], ['hurma', 3], ['elma', 1]];
const KAHVALTI_EK = [['fistikezme', 20], ['ceviz', 20], ['avokado', 0.5], ['yulaf', 40], ['tamekmek', 1]];
// Akşam yemeğine içecek: yoğurtlu yan yoksa ayran, varsa maden suyu; tuz kısıtında bitki çayı
function aksamIcecekEkle(gun, izinli){
  const o = gun.find(o => o.id === 'aksam');
  if (!o || o.ogeler.some(it => SIVI.has(it.f) || yemek(it.f).kat === 'icecek')) return;
  const yogurtlu = o.ogeler.some(it => ['cacik', 'yogurt', 'suzme', 'soya_yogurt', 'kefir', 'ayran'].includes(it.f));
  const id = (yogurtlu ? ['maden_suyu', 'bitki_cayi'] : ['ayran', 'maden_suyu', 'bitki_cayi']).find(x => izinli(yemek(x)));

// Ara öğün en çok 3 kalem (takviye ve içecek hariç): ana kalem + farklı rolden tamamlayıcılar; atılan kalori kalanlara paylaşılır.
// Kullanıcı 01.11: 2 kalemde miktarlar çok büyüdü (310 g kefir) → ara öğün porsiyonu tavanlı, gerekirse 3. kalem
const ARA_EN_COK = 3;
function araSadele(gun, sabit, por){
  const kcal = it => besin(it.f, it.g).k;
  const ana = it => { const f = yemek(it.f); return f.kat === 'sut' || rol(f) === 'P' || ['atistirmalik', 'tahil'].includes(f.kat); };
  for (const o of gun){
    if (!ARA_IDLER.has(o.id)) continue;
    const sayilan = o.ogeler.filter(it => !sabit.has(it.f));
    if (sayilan.length <= ARA_EN_COK) continue;
    const sirali = [...sayilan].sort((a, b) => (ana(b) - ana(a)) || (kcal(b) - kcal(a)));   // ana kalem (yoğurt, kefir, süzme, leblebi…) önce
    // ana kalem + farklı rollerden tamamlayıcılar (en çok ARA_EN_COK kalem)
    const tut = [sirali[0]];
    for (const it of sirali.slice(1)) if (tut.length < ARA_EN_COK && !tut.some(x => rol(yemek(x.f)) === rol(yemek(it.f)))) tut.push(it);
    for (const it of sirali.slice(1)) if (tut.length < ARA_EN_COK && !tut.includes(it)) tut.push(it);
    const atilan = sayilan.filter(it => !tut.includes(it)), ek = atilan.reduce((s, it) => s + kcal(it), 0);
    o.ogeler = o.ogeler.filter(it => !atilan.includes(it));
    const tk = tut.reduce((s, it) => s + kcal(it), 0);
    if (tk > 0) for (const it of tut) it.g = por(yemek(it.f), o.id, it.g * (tk + ek) / tk);
  }
}
function gunuOlcekle(gun, p, izinli){
  const sabit = new Set([...takviyeIdleri(p), ...SABIT_ICECEK]);   // takviye (1 ölçek) ve içecekler (1 bardak) ölçeklenmez
  const s = sinirla((p.kcal || 2000) / 2200, 1, 1.7), por = (f, id, m) => porsiyon(f, id, m, s);
  const hepsi = () => gun.flatMap(o => o.ogeler);
  const top = r => topla(hepsi().filter(it => !r || rol(yemek(it.f)) === r));
  const her = fn => gun.forEach(o => o.ogeler.forEach(it => { const f = yemek(it.f); if (!sabit.has(it.f)) fn(it, f, o.id); }));
  const uygula = (r, k) => her((it, f, id) => { if (rol(f) === r) it.g = por(f, id, it.g * k); });

  // 1) Protein hedefi
  const pP = top('P').p, pDiger = tumu() ? top().p - pP : 0;
  if (pP > 0) uygula('P', sinirla((p.protein - pDiger) / pP, 0.6, 2.5));
  // 2) Karbonhidratla kaloriyi tuttur
  const kAyarla = () => { const kK = top('K').k; if (kK > 0) uygula('K', sinirla((p.kcal - (tumu() - kK)) / kK, 0.35, 2.5)); };
  kAyarla();
  // 3) Yağ kaynaklarıyla ince ayar
  const yAyarla = (alt, ust) => { const kY = top('Y').k; if (kY > 0) uygula('Y', sinirla((kY + p.kcal - tumu()) / kY, alt, ust)); };
  yAyarla(0.5, 1.6);
  // 4) Hâlâ eksikse (kas / kilo alma gibi yüksek hedefler): a) akşam ve öğleye tam tahıllı garnitür, b) salataya zeytinyağı ve yağ porsiyonları,
  //    c) kahvaltıya tek yoğun kalem. Ara öğüne kalem eklenmez.
  const eksik = () => tumu() < p.kcal * 0.95;
  for (const id of ['aksam', 'ogle']){
    if (!eksik()) break;
    const o = gun.find(o => o.id === id);
    if (!o || o.ogeler.some(it => ['pilav', 'baklagil'].includes(yemek(it.f).kat))) continue;
    const g = GARNITUR.find(x => izinli(yemek(x)) && !DOKTOR_DISI.has(x));
    if (g){ o.ogeler.push({f: g, g: 100}); kAyarla(); }
  }
  if (eksik()){
    const o = gun.find(o => ['ogle', 'aksam'].includes(o.id) && o.ogeler.some(it => yemek(it.f).kat === 'salata') && !o.ogeler.some(it => it.f === 'zeytinyagi'));
    if (o && izinli(yemek('zeytinyagi'))) o.ogeler.push({f: 'zeytinyagi', g: 10});
    yAyarla(1, 2);
  }
  if (eksik()){
    const o = gun.find(o => o.id === 'kahvalti') || gun[0];
    const ek = KAHVALTI_EK.find(([f]) => izinli(yemek(f)) && !o.ogeler.some(it => it.f === f));
    if (ek){ o.ogeler.push({f: ek[0], g: ek[1]}); kAyarla(); yAyarla(1, 2); }
  }
  // d) ara öğünlere farklı rolden tamamlayıcı (en çok ARA_EN_COK kalem; kalem büyütmek yerine çeşit)
  for (let tur = 0; tur < 2; tur++) for (const o of gun){
    if (!eksik()) break;
    if (!ARA_IDLER.has(o.id)) continue;
    const say = o.ogeler.filter(it => !sabit.has(it.f));
    if (!say.length || say.length >= ARA_EN_COK) continue;
    const roller = new Set(say.map(it => rol(yemek(it.f))));
    const ek = ARA_TAMAMLAYICI.find(([f]) => izinli(yemek(f)) && !roller.has(rol(yemek(f))) && !o.ogeler.some(it => it.f === f))
      || ARA_TAMAMLAYICI.find(([f]) => izinli(yemek(f)) && !o.ogeler.some(it => it.f === f));
    if (ek) o.ogeler.push({f: ek[0], g: ek[1]});
  }
  // 5) Şeker sınırı aşılıyorsa şekerli kalemleri (meyve, süt ürünü, tatlı) azalt, kaloriyi tahılla geri tamamla
  const sekerli = f => !['sebze', 'salata', 'corba'].includes(f.kat) && f.k && f.s * 4 / f.k >= 0.2;
  const sToplam = topla(hepsi().filter(it => !sabit.has(it.f) && sekerli(yemek(it.f)))).s;
  if (top().s > p.seker * 1.05 && sToplam > 0){
    const k = sinirla(1 - (top().s - p.seker) / sToplam, 0.5, 1);
    her((it, f, id) => { if (sekerli(f)) it.g = por(f, id, it.g * k); });
    kAyarla();
  }
  // 6) Hâlâ fazlaysa sebze dışındaki sabit kalemleri (karışık yemek, süt ürünü) biraz azalt
  if (tumu() > p.kcal * 1.07){
    const azalt = f => rol(f) === 'S' && !['sebze', 'salata'].includes(f.kat);
    const kS = topla(hepsi().filter(it => !sabit.has(it.f) && azalt(yemek(it.f)))).k;
    if (kS > 0){ const k = sinirla((kS + p.kcal - tumu()) / kS, 0.7, 1); her((it, f, id) => { if (azalt(f)) it.g = por(f, id, it.g * k); }); }
  }
  // 7) Ara öğün sade (en çok 2 kalem), ardından gün kalorisi tahılla yeniden
  araSadele(gun, sabit, por);
  kAyarla();
  // 8) Son denge: hedeften %3'ten fazla saparsa sebze/salata dışındaki kalemler birlikte, porsiyon sınırları içinde ölçeklenir
  for (let i = 0; i < 4; i++){
    const r = p.kcal / (tumu() || 1);
    if (Math.abs(1 - r) < 0.03) break;
    // büyütürken protein kalemleri (et, balık, yumurta, süzme…) en çok %15 büyür: protein hedefin çok üstüne çıkmaz
    her((it, f, id) => { if (!['sebze', 'salata'].includes(f.kat)) it.g = por(f, id, it.g * sinirla(r, 0.8, r > 1 && rol(f) === 'P' ? 1.15 : 1.35)); });
  }
}

// ---------- Regl takibi (kadın kullanıcı, hamile değilse): D.regl = [{bas:'YYYY-MM-DD', bit:null | 'YYYY-MM-DD'}] ----------
const reglTakipli = () => D.profil.cins === 'k' && !(D.profil.hamile);
const reglAcik = () => (D.regl || []).find(r => !r.bit) || null;
const gunFark = (a, b) => Math.round((tarihDen(b) - tarihDen(a)) / 864e5);   // b − a (gün)
// k günü regl içinde mi: {n: kaçıncı gün, basladi, bitti} ya da null (bitişi yazılmamış kayıt en çok 10 gün sayılır)
function reglGunu(k){
  for (const r of D.regl || []){
    const son = r.bit || gunEkle(r.bas, 9);
    if (k >= r.bas && k <= son) return {n: gunFark(r.bas, k) + 1, bas: r.bas, bit: r.bit, basladi: k === r.bas, bitti: k === r.bit};
  }
  return null;
}
// Ortalama döngü ve sonraki tahmin: en az 2 başlangıç; 15–60 gün arası döngüler sayılır
function reglTahmin(){
  const baslar = (D.regl || []).map(r => r.bas).sort();
  if (baslar.length < 2) return null;
  const donguler = baslar.slice(1).map((b, i) => gunFark(baslar[i], b)).filter(n => n >= 15 && n <= 60);
  if (!donguler.length) return null;
  const ort = Math.round(donguler.reduce((a, b) => a + b, 0) / donguler.length), tarih = gunEkle(baslar[baslar.length - 1], ort);
  return {ort, tarih, kalan: gunFark(bugunK(), tarih)};
}
// Günün su hedefi: regl günlerinde +500 ml
const suHedefi = k => D.profil.su + (reglTakipli() && reglGunu(k) ? 500 : 0);
const antrenmanGunu = k => (D.profil.antrenmanGunleri || []).includes(haftaGunu(k));
const sporOzet = s => !s || !(s.gun > 0) ? T('sporYok') : T('sporHafta', {n: s.gun >= 5 ? '5+' : s.gun >= 4 ? '3–4' : '1–2', t: T('tur_' + (s.tur || 'karma'))});
// ---------- Fark rozetleri ----------
function fmtFark(n, birim=''){
  const a = Math.abs(n) < 10 ? Math.round(n * 10) / 10 : Math.round(n);
  if (a === 0) return '±0' + birim;
  return (a > 0 ? '+' : '−') + sayi(Math.abs(a)) + birim;
}
// Faydalı (protein, lif): artış yeşil. Sınırlanacak (kalori, karb, şeker, yağ): artış kırmızı.
const FAYDALI = [['p','protein','g'],['l','fiber','g']];
const SINIRLI = [['k','calories','kcal'],['c','carb','g'],['s','sugar','g'],['y','fat','g']];
const KISA = {p:'aP', l:'aL', k:'kcal', c:'aK', s:'aS', y:'aY'};
const farkSinif = (fark, faydali) => Math.abs(fark) < 0.5 ? 'eq' : ((fark > 0) === faydali ? 'up' : 'bad');
function farkPilleri(eski, yeni){
  const pil = (a, faydali) => `<span class="pl ${farkSinif(yeni[a]-eski[a], faydali)}">${T(KISA[a])} ${fmtFark(yeni[a]-eski[a])}</span>`;
  return '<div class="pills">' + FAYDALI.map(([a]) => pil(a, true)).join('') + SINIRLI.map(([a]) => pil(a, false)).join('') + '</div>';
}

// ---------- Arama (regex; büyük/küçük harf, Türkçe/Almanca/Rusça/Arapça harf farkı duyarsız) ----------
const HARF = {a:'aâä', c:'cç', g:'gğ', i:'iıİI', o:'oö', s:'sşß', u:'uüû', 'е':'её', 'ا':'اأإآ', 'ه':'هة', 'ي':'يى'};
const KATLA = {'ç':'c','ğ':'g','ı':'i','i':'i','ö':'o','ş':'s','ü':'u','â':'a','û':'u','ä':'a','ß':'s','ё':'е','أ':'ا','إ':'ا','آ':'ا','ة':'ه','ى':'ي'};
function kelimeDeseni(w){
  return [...w.toLocaleLowerCase(dil === 'tr' ? 'tr-TR' : undefined)].map(ch => {
    const kok = KATLA[ch] || ch;
    if (HARF[kok]) return '[' + HARF[kok] + HARF[kok].toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('');
}
// "tavuk haşlama" → kelimelerin hepsi; "balık|yumurta" veya "balık, yumurta" → herhangi biri
function aramaHazirla(q){
  const alternatifler = q.split(/[|,،]/).map(s => s.trim()).filter(Boolean).map(s => s.split(/\s+/).map(w => new RegExp(kelimeDeseni(w), 'i')));
  const hepsi = alternatifler.flat().map(r => r.source);
  return {alternatifler, isaret: hepsi.length ? new RegExp('(' + hepsi.join('|') + ')', 'gi') : null};
}
function aramaPuani(f, A){
  const metin = `${f.ad} ${(f.n || []).join(' ')} ${katAd(f.kat)} ${f.e}`;
  let enIyi = -1;
  for (const kelimeler of A.alternatifler){
    if (!kelimeler.every(r => r.test(metin))) continue;
    let p = 0;
    kelimeler.forEach((r, i) => {
      const m = f.ad.match(r);
      if (!m) p += 1;
      else if (m.index === 0) p += i === 0 ? 8 : 4;
      else if (/[\s(]/.test(f.ad[m.index - 1])) p += 3;
      else p += 2;
    });
    enIyi = Math.max(enIyi, p);
  }
  return enIyi;
}
const isaretle = (ad, A) => A && A.isaret ? ad.split(A.isaret).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join('') : esc(ad);

// ---------- Tarih ve gün menüsü ----------
const tarihAnahtar = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const tarihDen = k => { const [y, m, g] = k.split('-').map(Number); return new Date(y, m - 1, g, 12); };
const bugunK = () => tarihAnahtar(new Date());
const haftaGunu = k => (tarihDen(k).getDay() + 6) % 7;
const gunEkle = (k, n) => { const d = tarihDen(k); d.setDate(d.getDate() + n); return tarihAnahtar(d); };
const gunKisa = k => tarihDen(k).toLocaleDateString(LOC(), {weekday: RTL() ? 'narrow' : 'short'}).replace('.', '');
const gunUzun = k => tarihDen(k).toLocaleDateString(LOC(), {weekday:'long'});
const etiket = k => tarihDen(k).toLocaleDateString(LOC(), {day:'numeric', month:'short'}) + ' ' + tarihDen(k).toLocaleDateString(LOC(), {weekday:'short'});
const gecmisMi = k => k < bugunK();
// 4 haftalık dönüşte bu tarihin hafta sırası (0..3); başlangıç planın oluşturulduğu haftanın pazartesisi
function haftaNo(k){
  const n = D.planlar.length || 1, bas = D.planBaslangic || gunEkle(bugunK(), -haftaGunu(bugunK()));
  const fark = Math.round((tarihDen(gunEkle(k, -haftaGunu(k))) - tarihDen(bas)) / 6048e5);
  return ((fark % n) + n) % n;
}

let aktif = bugunK(), detayAcik = false;
const kayitOku = k => D.kayit[k] || {yendi:{}, su:0};
function kayitAl(k){ if (!D.kayit[k]) D.kayit[k] = {yendi:{}, su:0}; return D.kayit[k]; }
// Günün menüsü: o güne ait kayıt varsa o, yoksa haftalık şablon
// Miktar hafızası: bir öğünde yemeğin miktarı değişince, şablondan gelen günlerde aynı öğündeki aynı yemek o miktarla gelir
function sablon(k){
  let gun = D.planlar[haftaNo(k)][haftaGunu(k)];
  const m = D.miktar || {};
  if (Object.keys(m).length) gun = gun.map(o => m[o.id] ? {...o, ogeler: o.ogeler.map(it => m[o.id][it.f] != null ? {...it, g: m[o.id][it.f]} : it)} : o);
  // Regl günleri: demir / magnezyum / C vitamini kaynaklarına ağırlık (şablonun kopyası üzerinde, aynı kaloride; plan ve diyetisyen programı değişmez)
  if (!D.program && reglTakipli() && reglGunu(k)) gun = oneriAgirlik(kopya(gun), REGL_ONERI, profilUygun(D.profil), haftaGunu(k) + 7 * haftaNo(k));
  return gun;
}
function miktarHatirla(ogunId, f, g){ (D.miktar || (D.miktar = {}))[ogunId] = {...(D.miktar[ogunId] || {}), [f]: g}; }
const menuOku = k => (D.kayit[k] && D.kayit[k].ogunler) || sablon(k);
function menuYaz(k){ const r = kayitAl(k); if (!r.ogunler) r.ogunler = kopya(sablon(k)); return r.ogunler; }
// Plan/program değişince bugün ve sonrasının özel menüsü silinir; bugün "yedim" denmiş öğünler olduğu gibi kalır
function menuleriTemizle(saatDe = false){
  const bugun = bugunK();
  for (const [k, r] of Object.entries(D.kayit)){
    if (k < bugun) continue;
    if (saatDe) delete r.saat;
    if (!r.ogunler) continue;
    const yenen = r.ogunler.filter(o => r.yendi[o.id]);
    delete r.ogunler;
    if (k !== bugun || !yenen.length) continue;
    const yeni = sablon(k).map(o => kopya(yenen.find(y => y.id === o.id) || o));
    yenen.forEach(y => { if (!yeni.some(o => o.id === y.id)) yeni.push(kopya(y)); });
    r.ogunler = yeni;
  }
}
const yenenToplam = k => { const r = kayitOku(k); return topla(menuOku(k).filter(o => r.yendi[o.id]).flatMap(o => o.ogeler)); };
const kayitVar = k => { const r = D.kayit[k]; return !!r && (r.su > 0 || Object.values(r.yendi).some(Boolean)); };

// Yerinde çizim: basılan düğmenin kartı ekranda aynı yerde kalır (+, kaldır, yedim… sonrası sayfa kaymasın)

// Başlık satırı sığmayıp kırılırsa düğmeleri de sola hizala (sağda boşluk kalmasın)
// Selam: virgüle kadar olan kısım ("Kaan Bey,") ve gerisi ("hoş geldiniz 😊") bölünmez; emoji metinden kopmaz.
// Ad ≤ 8 harf: tek satır, sığmazsa yazı küçülür (en az 18 px). Ad > 8 harf: "hoş geldiniz 😊" alt satıra geçer.
function selamCiz(){
  const h = $('baslik'); if (!h) return;
  const s = selam(), i = s.indexOf(','), ad = [...String(D.profil.ad || '').trim()];
  h.innerHTML = i > 0 ? `<span class="sl1">${esc(s.slice(0, i + 1))}</span> <span class="sl2">${esc(s.slice(i + 1).trim())}</span>` : `<span class="sl2">${esc(s)}</span>`;
  h.classList.toggle('uzun-ad', i > 0 && ad.length > 8);
  h.style.fontSize = '';
  if (ad.length <= 8){
    let fs = parseFloat(getComputedStyle(h).fontSize), n = 0;
    while (h.scrollHeight > fs * 1.5 && fs > 18 && n++ < 14){ fs -= 1; h.style.fontSize = fs + 'px'; }
  }
}
window.addEventListener('resize', () => { if (D && D.ayar && D.ayar.kurulum) selamCiz(); });
function ustHizala(){
  const satir = document.querySelector('.top-row'); if (!satir) return;
  satir.classList.remove('kirik');

window.addEventListener('resize', ustHizala);
function gunleriCiz(){
  const bas = gunEkle(aktif, -haftaGunu(aktif)), son = gunEkle(bas, 6), bugun = bugunK();
  const kisa = k => tarihDen(k).toLocaleDateString(LOC(), {day:'numeric', month:'short'});
  $('haftaNav').innerHTML = `<button class="nav-btn hafta-ok" data-hafta="-7" aria-label="‹">‹</button><div class="lbl">${kisa(bas)} – ${kisa(son)}</div><span class="tag hafta-tag"><span class="uzun">${T('weekN', {n: haftaNo(aktif) + 1, t: D.planlar.length})}</span><span class="kisa">${T('weekS', {n: haftaNo(aktif) + 1, t: D.planlar.length})}</span></span>
    ${aktif !== bugun ? `<button class="today-btn" data-bugun="1">${T('today')}</button>` : ''}<button class="nav-btn hafta-ok" data-hafta="7" aria-label="›">›</button>`;
  $('gunler').innerHTML = [0,1,2,3,4,5,6].map(i => {
    const k = gunEkle(bas, i);
    const cls = (k === aktif ? ' active' : '') + (k === bugun ? ' today' : '') + (k < bugun ? ' past' : '') + (reglTakipli() && reglGunu(k) ? ' regl' : '');
    return `<button class="day${cls}" data-tarih="${k}"><b>${gunKisa(k)}</b><span>${tarihDen(k).getDate()}</span><i class="${kayitVar(k) ? 'on' : ''}"></i></button>`;

// Hedef çubuğu: hedefe kadar renkli, hedefi aşan kısım kırmızı; hedef noktası çizgiyle işaretli
// Sınır hedeflerinde (kalori, karb, şeker, yağ) aşım kırmızı; "en az" hedeflerinde (protein, lif, su) aşım yeşil
function cubuk(v, hedef, enAz = false){
  if (!hedef) return '<div class="bar"></div>';
  const olcek = Math.max(v, hedef), ok = Math.min(v, hedef) / olcek * 100, fazla = Math.max(0, v - hedef) / olcek * 100;
  return `<div class="bar"><i class="ok" style="width:${ok.toFixed(1)}%"></i>${fazla > 0 ? `<i class="over${enAz ? ' iyi' : ''}" style="width:${fazla.toFixed(1)}%"></i><u style="inset-inline-start:${(hedef / olcek * 100).toFixed(1)}%"></u>` : ''}</div>`;
}
// Çubuğun altındaki satır: kalan miktar, kırmızı aşım ya da yeşil "hedef tamam"
function kalanYazi(v, hedef, birim, enAz = false){
  if (v <= hedef) return `<div class="kalan">${T('remaining', {n: yuv(hedef - v) + ' ' + birim})}</div>`;
  const n = yuv(v - hedef) + ' ' + birim;
  return enAz ? `<div class="kalan tamam">${T('reached', {n})}</div>` : `<div class="kalan asti">${T('over', {n})}</div>`;
}
// ---------- Haftalık tartı (her pazartesi) ----------
const tartimlar = () => Object.entries(D.tartim || {}).sort((a, b) => a[0] < b[0] ? -1 : 1);
function oncekiTartim(k){ const t = tartimlar().filter(([g]) => g < k); return t.length ? t[t.length - 1][1] : null; }
const farkKg = (a, b) => { const f = Math.round((a - b) * 10) / 10; return (f > 0 ? '+' : f < 0 ? '−' : '±') + sayi(Math.abs(f)); };
function tartiKarti(){
  // 02.11 (kullanıcı): tartı girildiyse kart ekranda kalmaz; değer geçmiş gün özetinde (⚖️) ve kayıt geçmişinde görünür
  if (haftaGunu(aktif) !== 0 || aktif > bugunK() || (D.tartim || {})[aktif] != null) return '';
  const P = D.profil, v = (D.tartim || {})[aktif], onc = oncekiTartim(aktif);
  const alt = v != null ? (onc != null ? T('tartiFark', {f: farkKg(v, onc)}) : T('tartiIlk')) + (P.hedefKilo ? ' · ' + hedefDurum(v) : '')
    : T('tartiHint') + (P.hedefKilo ? ' ' + T('tartiHedefK', {n: sayi(P.hedefKilo)}) : '');
  return `<div class="card tarti-kart${v != null ? ' girildi' : ''}"><div class="tarti-bas"><b>${T('tartiT')}</b><small>${esc(alt)}</small></div>
    <div class="tarti-gir"><label class="val"><input id="tartiIn" type="text" inputmode="decimal" autocomplete="off" value="${sayi(v != null ? v : P.kilo)}" aria-label="${esc(T('weight'))}"><span>kg</span></label><button class="btn solid" data-tarti="1">${T('tartiKaydet')}</button></div></div>`;
}
// Hedef kiloya göre durum: kilo verenlerde altına inince, alanlarda üstüne çıkınca "ulaştın"
function hedefDurum(v){
  const P = D.profil, hk = +P.hedefKilo;
  const asagi = ['ver', 'sekil'].includes(P.hedef) ? true : ['al', 'kas'].includes(P.hedef) ? false : hk <= v;
  const ulasti = Math.abs(v - hk) < 0.05 || (asagi ? v <= hk : v >= hk);
  return ulasti ? T('tartiUlasti') : T('tartiHedef', {n: sayi(Math.abs(Math.round((v - hk) * 10) / 10))});
}
// Tartı kaydedilir; en son tartıysa profil kilosu ve hedefler güncellenir (gönderilen programın hedeflerine dokunulmaz)
function tartiKaydet(){
  const kg = Math.round(+String($('tartiIn').value).replace(/[,٫]/g, '.') * 10) / 10;
  if (!(kg >= 30 && kg <= 300)){ toast(T('errBody')); return; }
  const P = D.profil, onc = oncekiTartim(aktif);
  (D.tartim || (D.tartim = {}))[aktif] = kg;
  if (tartimlar().pop()[0] === aktif && kg !== P.kilo){ P.kilo = kg; if (!D.program && P.hedef) hedefleriYenile(); }
  logEkle('diger', aktif, T('lTarti', {b: sayi(kg), f: onc != null ? farkKg(kg, onc) + ' kg' : T('tartiIlk')}));
  kaydet(); ciz(); toast(T('tSaved'));
}

function ogeDegis(oi, ii, f, g){

function miktarDegis(oi, ii, ham){
  const o = menuYaz(aktif)[oi], it = o.ogeler[ii], f = yemek(it.f), g = miktarOku(f, ham);
  if (it.g === g){ ciz(); return; }
  // Aynı yemeğe art arda basılırsa (10 sn içinde) tek log satırında birleştir: ilk değer → son değer
  const anahtar = `${aktif}|${oi}|${ii}|${it.f}`, son = D.log[D.log.length - 1];
  if (son && son.tur === 'gram' && son.a === anahtar && Date.now() - son.t < 10000){

    Object.assign(D.log[D.log.length - 1], {a: anahtar, ilk: miktarYazi(f, it.g)});

// − / + düğmesi: adette 1'er (1'in altında 0,5), gramda 10'ar (30 g'a kadar 5'er); en az bir adım kalır
function miktarAdim(oi, ii, yon){
  const it = menuOku(aktif)[oi].ogeler[ii], f = yemek(it.f), m = it.g;
  const adim = f.a ? (m + yon < 1 || (yon > 0 && m < 1) ? 0.5 : 1) : (m + yon * 5 <= 30 ? 5 : 10);
  miktarDegis(oi, ii, Math.max(f.a ? 0.5 : 5, m + yon * adim));

// ---------- Yemek seç / değiştir / kıyasla ----------
let SE = null;
const SON = '__son', TUMU = '__tumu', BENZER = '__benzer';
// Değiştir/Kıyasla için benzer yemekler: aynı tür (ad/etiket ortak kelime, ör. "ekmek") önce, sonra aynı gruptaki besin değeri en yakınlar
// Türü değil niteliği/pişirmeyi anlatan kelimeler benzerlikte sayılmaz (ör. "tam buğday" ekmekle makarnayı eşleştirmesin)
const NITELIK = new Set(['tam','bugday','kepekli','haslama','haslanmis','izgara','firin','tava','yarim','yagli','sekersiz','tuzsuz','sade','light','kahvalti','yemek','yemegi','zeytinyagli','yogurtlu','kimyonlu','sumakli','derisiz','suzulmus','bugulama']);
const KAT_SIRA = ['et','balik','yumurta','sut','kahvaltilik','bitkisel','baklagil','anayemek','dunya','hamur','sandvic','salata','sebze','tahil','pilav','corba','meyve','kuruyemis','atistirmalik','hazir','tatli','icecek','sporcu','ozel'];
const GRUP = {et:'protein', balik:'protein', yumurta:'protein', bitkisel:'protein'};
function benzerler(fid, uygun = profilUygun(D.profil)){
  const f = yemek(fid);
  const sade = t => t.toLocaleLowerCase('tr-TR').replace(/[çğıöşüâû]/g, c => KATLA[c] || c);
  const kelimeler = y => new Set(sade(`${(y.n || [y.ad])[0]} ${y.e || ''}`).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !NITELIK.has(w)));
  const kf = kelimeler(f), grup = y => GRUP[y.kat] || y.kat;
  const oz = y => { const k = y.k || 1; return [y.p * 4 / k, y.c * 4 / k, y.y * 9 / k]; };
  const [a1, a2, a3] = oz(f);
  return tumYemekler().filter(y => y.id !== f.id && uygun(y)).map(y => {
    const ortak = [...kelimeler(y)].filter(w => kf.has(w)).length;
    if (!ortak && grup(y) !== grup(f)) return null;
    const [b1, b2, b3] = oz(y);
    const puan = Math.abs(a1 - b1) * 2 + Math.abs(a2 - b2) + Math.abs(a3 - b3) - ortak * 0.9 + (y.kat === f.kat ? 0 : 0.8) - (f.b && y.b === f.b ? 0.8 : 0) + (DOKTOR_DISI.has(y.id) ? 0.5 : 0);   // aynı birim (ör. dilim) öne
    return [y.id, puan];
  }).filter(Boolean).sort((a, b) => a[1] - b[1]).slice(0, 20).map(([id]) => id);
}

function secimAc(opts){

  SE = {...opts, ogunId: ogun.id, q:'', sec:null, g:0, coklu: new Map()};   // coklu: işaretlenen yemekler (kimlik → miktar)
  SE.uygun = opts.koc ? () => true : profilUygun(D.profil);

  SE.mevcut = SE.ii !== undefined ? {...ogun.ogeler[SE.ii]} : null;
  SE.benzer = SE.mevcut ? benzerler(SE.mevcut.f, SE.uygun) : [];
  SE.kat = SE.benzer.length ? BENZER : SE.son.length ? SON : TUMU;   // değiştir/kıyasla: benzerleri; ekle: son seçilenler

function esdegerMiktar(adayId){

  if (!SE.mevcut) return aday.d;

  if (aday.a && cf.a && aday.b === cf.b) return SE.mevcut.g;
  const gram = gramOf(cf, SE.mevcut.g);
  return aday.a ? Math.max(0.5, Math.round(gram / aday.a * 2) / 2) : yuv(gram);

// Dokunmatikte güvenilir dokunuş: kaydırma yavaşlarken ilk dokunuş yalnız kaydırmayı durdurup "click" üretmiyordu

  let x0 = null, y0 = 0, t0 = 0, son = 0;

function kiyasKarti(eskiF, eskiM, yeniF, yeniM){

  SINIRLI.forEach(([a, ad]) => { const f = yeni[a] - eski[a]; if (Math.abs(f) >= (a === 'k' ? 5 : 0.5)) (f < 0 ? iyi : kotu).push(yon(f, ad)); });

  return `<div class="kiyas">

function detayGorunumu(){
  const f = yemek(SE.sec), adim = f.a ? 1 : 10;
  const secimli = SE.mod === 'ekle' && [...SE.coklu.keys()].some(k => k !== SE.sec);   // başka işaretli yemek varsa
  const butonlar = {
    ekle: secimli ? `<button class="btn ghost" id="secimeEkle">${T('cokluSecimeEkle')}</button><button class="btn green" id="onay">${T('cokluEkle', {n: new Set([...SE.coklu.keys(), SE.sec]).size})}</button>`
      : `<button class="btn green" id="onay">${T('addToMeal')}</button>`,
    degis: `<button class="btn green" id="onay">${T('replaceWith')}</button>`,
    kiyas: `<button class="btn ghost" id="kapatBtn">${T('justCompare')}</button><button class="btn green" id="onay">${T('replaceWith')}</button>`
  }[SE.mod];
  const ip = ipucu(f);
  $('sbody').innerHTML = `<div class="det-name">${esc(f.ad)}</div>
    <div class="hint">100 ${T('g')}: ${f.k} ${T('kcal')} · ${T('protein')} ${sayi(f.p)} · ${T('carb')} ${sayi(f.c)} · ${T('sugar')} ${sayi(f.s)} · ${T('fat')} ${sayi(f.y)} · ${T('fiber')} ${sayi(f.l)}${ip ? ' · ' + esc(ip) : ''}</div>
    <div class="stepper">
      <button data-adim="-1" aria-label="${T('dec')}">−</button>
      <input autocomplete="off" autocorrect="off" spellcheck="false" id="gramIn" type="text" inputmode="decimal" value="${sayi(SE.g)}">
      <button data-adim="1" aria-label="${T('inc')}">+</button>
    </div>
    <div class="hint" style="text-align:center" id="birimYazi"></div>
    <div id="karsi"></div>
    <button class="btn ghost full" style="margin-top:12px" id="geri">${T('backList')}</button>
    <div class="acts alt-sabit">${butonlar}</div>`;
  const yenile = () => {
    $('birimYazi').textContent = f.a ? `${birimAd(f)} (≈ ${yuv(gramOf(f, SE.g))} ${T('g')})` : T('gram');
    $('karsi').innerHTML = SE.mevcut
      ? kiyasKarti(yemek(SE.mevcut.f), SE.mevcut.g, f, SE.g)
      : `<div class="cur" style="margin-top:12px"><small>${T('forAmt', {m: miktarYazi(f, SE.g)})}</small><b>${bilgi(besin(SE.sec, SE.g))}</b></div>`;
  };
  $('gramIn').addEventListener('input', e => { SE.g = miktarOku(f, e.target.value); yenile(); });
  $('sbody').querySelectorAll('[data-adim]').forEach(b => b.onclick = () => {
    const yon = +b.dataset.adim, a = f.a && SE.g + yon * adim < 1 ? 0.5 : adim;
    SE.g = Math.max(0, Math.round((SE.g + yon * a) * 2) / 2); $('gramIn').value = sayi(SE.g); yenile();
  });
  $('geri').onclick = listeGorunumu;
  geriAyarla(listeGorunumu);
  if ($('kapatBtn')) $('kapatBtn').onclick = kapat;
  if ($('secimeEkle')) $('secimeEkle').onclick = () => {
    if (!(SE.g > 0)){ toast(T('tZero')); return; }
    SE.coklu.set(SE.sec, SE.g); listeGorunumu();
  };
  hizliTik($('onay'), () => {
    if (!(SE.g > 0)){ toast(T('tZero')); return; }
    if (secimli){ SE.coklu.set(SE.sec, SE.g); cokluUygula(); return; }
    kapat();
    if (!SE.sonra) capaEl = $('ogunler').querySelectorAll('.meal')[SE.oi] || null;   // eklenen öğün ekranda yerinde kalsın
    if (SE.sonra) SE.sonra(SE.sec, SE.g);
    else if (SE.mod === 'ekle') ogeEkle(SE.oi, SE.sec, SE.g); else ogeDegis(SE.oi, SE.ii, SE.sec, SE.g);
  });
  yenile();
  $('sbody').scrollTop = 0;
}

// ---------- Tüm loglar ----------
let logFiltre = 'tum', logSayfa = 0;
const LOG_SAYFA = 10;
function loglarAc(){
  ac(T('logsTitle'));
  logSayfa = 0;
  const ciz2 = () => {
    let liste = D.log.slice().reverse();
    if (logFiltre === 'gun') liste = liste.filter(l => l.k === aktif);
    if (logFiltre === 'gecmis') liste = liste.filter(l => l.g);
    const sayfaSay = Math.max(1, Math.ceil(liste.length / LOG_SAYFA));
    logSayfa = Math.min(logSayfa, sayfaSay - 1);
    const sayfa = liste.slice(logSayfa * LOG_SAYFA, (logSayfa + 1) * LOG_SAYFA);
    const f = (id, ad) => `<button class="chip${logFiltre === id ? ' on' : ''}" data-lf="${id}">${ad}</button>`;
    const sayfalar = sayfaSay > 1 ? `<div class="sayfalar">
        <button class="nav-btn" data-ls="${logSayfa - 1}" ${logSayfa === 0 ? 'disabled' : ''} aria-label="‹">‹</button>
        <span>${T('sayfaN', {n: logSayfa + 1, t: sayfaSay, k: liste.length})}</span>
        <button class="nav-btn" data-ls="${logSayfa + 1}" ${logSayfa >= sayfaSay - 1 ? 'disabled' : ''} aria-label="›">›</button></div>` : '';
    $('sbody').innerHTML = `<div class="chips" style="margin-top:0">${f('tum', T('fAll'))}${f('gun', etiket(aktif))}${f('gecmis', T('fPast'))}</div>
      <ul class="logs" id="logListe">${sayfa.length ? sayfa.map(l => logSatir(l)).join('') : `<li class="empty">${T('noRecords')}</li>`}</ul>${sayfalar}`;
    $('sbody').querySelectorAll('[data-lf]').forEach(b => b.onclick = () => { logFiltre = b.dataset.lf; logSayfa = 0; ciz2(); });
    $('sbody').querySelectorAll('[data-ls]').forEach(b => b.onclick = () => { logSayfa = +b.dataset.ls; ciz2(); $('sbody').scrollTop = 0; });
  };
  ciz2();
}

const SAAT_IDLER = ['kahvalti','ara0','ogle','ara1','aksam','gece'];
const OGUN_IKON = {kahvalti:'☀️', ara0:'🍏', ogle:'🥗', ara1:'🍎', aksam:'🍗', gece:'🌙'};
const VARSAYILAN_SAAT = {kahvalti:'08:30', ara0:'10:30', ogle:'12:00', ara1:'15:00', aksam:'19:30', gece:'21:30'};
const dk = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const ssYaz = n => { n = sinirla(Math.round(n / 15) * 15, 0, 23 * 60 + 45); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };
// Ana öğünlere göre ara öğünler: kuşluk = kahvaltı-öğle ortası, ikindi = öğle-akşam ortası, gece = akşamdan 2 saat sonra
function araHesapla(s){
  const k = dk(s.kahvalti), o = dk(s.ogle), a = dk(s.aksam);
  return {ara0: ssYaz((k + o) / 2), ara1: ssYaz((o + a) / 2), gece: ssYaz(Math.min(a + 120, 23 * 60 + 30))};
}
// Bir tarihte geçerli saat seti (o tarihe kadar yapılan son değişiklik)
function saatSeti(k){
  let s = {...VARSAYILAN_SAAT};
  OGUN_TANIM.forEach(o => s[o.id] = o.saat);
  (D.planlar[0] && D.planlar[0][0] || []).forEach(o => { if (o.saat) s[o.id] = o.saat; });
  for (const g of D.saatGecmis || []) if (g.t <= k) s = {...s, ...g.s};
  return s;
}
const ogunSaati = (k, o) => (D.kayit[k] && D.kayit[k].saat && D.kayit[k].saat[o.id]) || saatSeti(k)[o.id] || o.saat;

// k gününden itibaren geçerli yeni saatler; sonraki tarihli değişiklikler bu seçimle geçersiz olur
function saatKaydet(k, s){

  if (!fark.length) return false;

// Dokunuş anında iki yöntem birden: eski yöntem (iPhone seçim aralığı ister) + Clipboard API. İkisi de olmazsa false.
function kopyalaDene(metin){
  let ok = false;
  const t = document.createElement('textarea');
  t.value = metin; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:0;left:-9999px;font-size:12pt;border:0;padding:0;margin:0';
  document.body.appendChild(t);
  try { t.select(); t.setSelectionRange(0, metin.length); ok = document.execCommand('copy'); } catch(e){}
  t.remove();
  let api = Promise.resolve(false);
  try { if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) api = navigator.clipboard.writeText(metin).then(() => true, () => false); } catch(e){}
  return api.then(a => a || ok);
}

// ---------- Başkası için program (diyetisyen / spor hocası) ----------
const PAYLASIM_TABAN = 'https://diyet.maviplay.com/app/';
const KOC_GUN = 7;
// Danışan bilgileri yalnız bu cihazda kalır (linke girmez): hedef hesaplama, otomatik program kısıtları ve alerji uyarısı için
const kocDanisanBos = () => ({cins:'', yas:'', boy:'', kilo:'', hedefKilo:'', aktivite:2, hedef:'koru', alerjiler:[], haric:[]});
// Sık kısıtlar: a = alerjen kimliği (yemek.al), h = içerik harfi (yemek.x: m kırmızı et, t tuzlu)
const KOC_KISIT = [['a', 'sut'], ['a', 'yumurta'], ['a', 'gluten'], ['a', 'balik'], ['a', 'kabuklu'], ['a', 'yerfistigi'], ['a', 'kuruyemis'], ['a', 'soya'], ['a', 'susam'], ['h', 'm'], ['h', 't']];
const kocKisitAd = (tur, id) => tur === 'h' ? T('x_' + id) : ((alerjen(id) || {}).ad || id);
const tarihYaz = k => tarihDen(k).toLocaleDateString(LOC(), {day:'numeric', month:'long', year:'numeric'});
function kocBos(){
  return {a:'', h:'', n:'', t:{kcal:'', protein:'', karb:'', yag:'', su:''}, il:'', kt:'', dn:kocDanisanBos(), ara0:false, saat:{...VARSAYILAN_SAAT}, mod:'hafta', ay:'',
    gun: Array.from({length: KOC_GUN}, () => ({})), not: Array.from({length: KOC_GUN}, () => ({})), sec:0};
}
const kocOgunler = K => ['kahvalti', ...(K.ara0 ? ['ara0'] : []), 'ogle', 'ara1', 'aksam', 'gece'];

// ---------- Dönem: 'hafta' (Pzt..Paz; alıcıda aktif haftaya uygulanır) ya da 'ay' (aktif ayın tüm günleri, tarihli) ----------
const ayAnahtar = k => k.slice(0, 7);                                                        // 'YYYY-MM'
const ayGunSayisi = ay => { const [y, m] = ay.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const ayAdi = ay => tarihDen(ay + '-01').toLocaleDateString(LOC(), {month:'long', year:'numeric'});
const kocAyMi = K => K.mod === 'ay' && /^\d{4}-\d\d$/.test(K.ay || '');
const kocGunSayisi = K => kocAyMi(K) ? ayGunSayisi(K.ay) : KOC_GUN;
const kocGunTarih = (K, j) => kocAyMi(K) ? gunEkle(K.ay + '-01', j) : '';
const kocHaftaGunu = (K, j) => kocAyMi(K) ? haftaGunu(kocGunTarih(K, j)) : j;              // 0 Pzt … 6 Paz
// Gün başlığı: hafta modunda gün adı; ay modunda "1" / "1 Kasım Pazartesi"
const kocGunAd = (K, j, uzun) => kocAyMi(K)
  ? (uzun ? tarihDen(kocGunTarih(K, j)).toLocaleDateString(LOC(), {day:'numeric', month:'long', weekday:'long'}) : String(j + 1))
  : haftaGunAd(j, uzun);
// Seçili günle aynı takvim haftasındaki gün sıraları (ay modunda aya kırpılır; hafta modunda 7 günün hepsi)
function kocHaftaIdx(K, j){
  const n = kocGunSayisi(K);
  if (!kocAyMi(K)) return Array.from({length: n}, (_, x) => x);
  const bas = j - kocHaftaGunu(K, j);
  return Array.from({length: 7}, (_, x) => bas + x).filter(x => x >= 0 && x < n);
}
// Taslağı döneme göre düzene sok (eski sürümden gelen taslak, bozuk uzunluk)
function kocDuzenle(K){
  if (!kocAyMi(K)){ K.mod = 'hafta'; K.ay = ''; }
  const n = kocGunSayisi(K);
  for (const a of ['gun', 'not']){ if (!Array.isArray(K[a])) K[a] = []; while (K[a].length < n) K[a].push({}); K[a].length = n; }
  K.sec = sinirla(+K.sec || 0, 0, n - 1);
  if (!K.t) K.t = {};
  if (K.t.su == null) K.t.su = '';
  if (K.il == null) K.il = '';
  if (K.kt == null) K.kt = '';
  if (!K.dn) K.dn = kocDanisanBos();
  for (const a of ['alerjiler', 'haric']) if (!Array.isArray(K.dn[a])) K.dn[a] = [];
  K.dn.haric = K.dn.haric.filter(x => ['m', 'c', 'f', 'e', 'd'].includes(x));   // sihirbazla aynı gruplar
  if (!K.kapali) K.kapali = {};
}
// 7 günlük (hafta günü bazlı) kopya: ay modunda her hafta gününün aydaki ilk dolu örneği
function kocHaftaya(K){
  if (!kocAyMi(K)) return {gun: kopya(K.gun), not: kopya(K.not)};
  const gun = Array.from({length: 7}, () => ({})), not = Array.from({length: 7}, () => ({})), n = kocGunSayisi(K);
  for (let j = 0; j < n; j++){
    const w = kocHaftaGunu(K, j);
    if (!Object.keys(gun[w]).length && Object.keys(K.gun[j] || {}).length){ gun[w] = kopya(K.gun[j]); not[w] = kopya(K.not[j] || {}); }
  }
  return {gun, not};
}
// Dönem değiştir. hafta → ay: her takvim günü aynı hafta gününün menüsünü alır; ay → hafta: her hafta gününün aydaki ilk örneği
function kocModAyarla(K, mod, ay){
  const h = kocHaftaya(K), secW = kocHaftaGunu(K, K.sec), bugun = bugunK();
  if (mod === 'ay'){
    K.mod = 'ay'; K.ay = ay || ayAnahtar(bugun);
    const n = ayGunSayisi(K.ay);
    K.gun = Array.from({length: n}, (_, j) => kopya(h.gun[kocHaftaGunu(K, j)]));
    K.not = Array.from({length: n}, (_, j) => kopya(h.not[kocHaftaGunu(K, j)]));
    K.sec = ayAnahtar(bugun) === K.ay ? +bugun.slice(8) - 1 : 0;
  } else {
    K.mod = 'hafta'; K.ay = ''; K.gun = h.gun; K.not = h.not; K.sec = secW;
  }
}
// Haftanın günleri (Pzt..Paz) seçili dilde

// Alerjen listesi: kurulum sihirbazıyla aynı (ALERJENLER, aynı arama); seçilenler başta
function kocAlerjiListe(K){
  const q = (K.alAra || '').trim(), sec = new Set(K.dn.alerjiler);
  let liste = ALERJENLER;
  if (q){ const A = aramaHazirla(q); liste = ALERJENLER.filter(a => { const metin = `${a.ad} ${a.n.join(' ')} ${a.e}`; return A.alternatifler.some(k => k.every(r => r.test(metin))); }); }
  liste = [...liste.filter(a => sec.has(a.id)), ...liste.filter(a => !sec.has(a.id))];
  return liste.length ? liste.map(a => `<button class="al-chip${sec.has(a.id) ? ' on' : ''}" data-kkisit="a:${a.id}">${sec.has(a.id) ? '✓ ' : ''}${esc(a.ad)}</button>`).join('') : `<div class="hint">${T('noResult').split('.')[0]}.</div>`;
}
// Telefonda kaydırma çubuğu yalnız kaydırırken görünür → liste aşağı kaydığı anlaşılmıyordu (02.11).
// Kendi çizdiğimiz ray her zaman görünür; içerik sığıyorsa gizlenir. Raya dokunup sürükleyerek de kaydırılır.
function kaymaCubuguKur(kutu){
  const ray = kutu && kutu.parentElement && kutu.parentElement.querySelector('.kayma-ray'), tut = ray && ray.firstElementChild;
  if (!ray) return;
  const guncelle = () => {
    const sh = kutu.scrollHeight, ch = kutu.clientHeight;
    ray.hidden = sh <= ch + 2;
    if (ray.hidden) return;
    const rh = ray.clientHeight, th = Math.max(28, Math.round(rh * ch / sh));
    tut.style.height = th + 'px';
    tut.style.transform = `translateY(${Math.round((rh - th) * kutu.scrollTop / (sh - ch))}px)`;
  };
  if (!kutu.dataset.kayma){
    kutu.dataset.kayma = '1';
    kutu.addEventListener('scroll', guncelle, {passive: true});
    const d = kutu.closest('details'); if (d) d.addEventListener('toggle', guncelle);   // kapalı bölüm açılınca ölç
    const sur = e => {
      const r = ray.getBoundingClientRect(), y = (e.touches ? e.touches[0] : e).clientY;
      kutu.scrollTop = Math.min(1, Math.max(0, (y - r.top) / r.height)) * (kutu.scrollHeight - kutu.clientHeight);
    };
    ray.addEventListener('touchstart', e => { sur(e); }, {passive: true});
    ray.addEventListener('touchmove', e => { e.preventDefault(); sur(e); }, {passive: false});
    ray.addEventListener('mousedown', e => { sur(e); const m = ev => sur(ev), u = () => { removeEventListener('mousemove', m); removeEventListener('mouseup', u); }; addEventListener('mousemove', m); addEventListener('mouseup', u); });
  }
  kutu.kaymaGuncelle = guncelle;
  guncelle();
}

// Eklenen yemek danışanın kısıtıyla çelişiyor mu (alerjen / içerik harfi) → çelişen kısıt adları
function kocKisitCelisme(fid){
  const y = yemek(fid), dn = D.koc && D.koc.dn; if (!y || !dn) return '';
  const al = (y.al || []).filter(a => dn.alerjiler.includes(a)).map(a => kocKisitAd('a', a));
  const hx = (y.x || '').split('').filter(c => dn.haric.includes(c)).map(c => kocKisitAd('h', c));
  return [...new Set([...al, ...hx])].join(', ');
}
// Mifflin-St Jeor (hedefHesapla): danışanın cinsiyet, yaş, boy, kilo, hareket ve hedefinden günlük hedefler + su
function kocHedefHesapla(){
  const K = D.koc, dn = K.dn, n = k => +String(dn[k] || '').replace(',', '.') || 0;
  const p = {cins: dn.cins, yas: n('yas'), boy: n('boy'), kilo: n('kilo'), hedefKilo: n('hedefKilo') || n('kilo'), hedef: dn.hedef || 'koru', hiz: 0.5,
    aktivite: +dn.aktivite || 2, odaklar: [], spor: {gun: 0}, hamile: false};
  if (!p.cins || !(p.yas >= 14 && p.yas <= 100) || !(p.boy >= 120 && p.boy <= 230) || !(p.kilo >= 30 && p.kilo <= 300)){ kocUyari(T('kocHesaplaEksik')); return; }
  const h = hedefHesapla(p);
  K.t = {...K.t, kcal: String(h.kcal), protein: String(h.protein), karb: String(h.karb), yag: String(h.yag), su: String(Math.round(h.su / 100) / 10)};
  kaydet(); kocCiz(); toast(T('kocHesaplandi'));
}

const kocKapali = (K, id) => (K.kapali || {})[id] != null ? !!K.kapali[id] : !!K.hepsiKapali;
function kocTogCiz(hedef, acildi, degistir){
  const kap = $('koc'), once = hedef(), y0 = once ? once.getBoundingClientRect().top : 0;

  else kap.scrollTop += el.getBoundingClientRect().top - y0;

// ---------- Program hazırla › Günler › 📅 takvim (ay ay; programlı günler yeşil noktalı, seçili gün yeşil daire) ----------
let kocTakvimAy = '';
function kocTakvimAc(ay){
  const K = D.koc, bugun = bugunK(), ayMod = kocAyMi(K);
  const pzt = gunEkle(bugun, -haftaGunu(bugun));
  const seciliTarih = ayMod ? kocGunTarih(K, K.sec) : gunEkle(pzt, K.sec);
  ay = ay || kocTakvimAy || ayAnahtar(seciliTarih); kocTakvimAy = ay;
  const ilk = ay + '-01', n = ayGunSayisi(ay), bas = haftaGunu(ilk);
  const dolu = j => Object.values(K.gun[j] || {}).some(l => (l || []).length);
  const hucre = k => {   // takvim günü → program günü sırası (yoksa -1)
    if (ayMod) return ayAnahtar(k) === K.ay ? +k.slice(8) - 1 : -1;
    return haftaGunu(k);
  };
  let h = Array.from({length: bas}, () => '<span class="tk-gun bos"></span>').join('');
  for (let d = 1; d <= n; d++){
    const k = ay + '-' + String(d).padStart(2, '0'), j = hucre(k);
    h += `<button class="tk-gun${k === seciliTarih ? ' secili' : ''}${k === bugun ? ' bugun' : ''}" data-tkgun="${j}" data-tktarih="${k}" ${j < 0 ? 'disabled' : ''}><b>${d}</b><i class="${j >= 0 && dolu(j) ? 'on' : ''}"></i></button>`;
  }
  const oncekiAy = ayAnahtar(gunEkle(ilk, -1)), sonrakiAy = ayAnahtar(gunEkle(ilk, n));
  ac('📅 ' + T('kocTakvim'), `<div class="tk-ust"><button class="tk-ok" data-tkay="${oncekiAy}" aria-label="‹">‹</button><b>${esc(ayAdi(ay))}</b><button class="tk-ok" data-tkay="${sonrakiAy}" aria-label="›">›</button></div>
    <div class="tk-grid" id="tkGrid">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span class="tk-gun-ad">${esc(haftaGunAd(i))}</span>`).join('')}${h}</div>
    <div class="hint tk-ipucu">${esc(T(ayMod ? 'kocTakvimAyIpucu' : 'kocTakvimHaftaIpucu', {ay: ayAdi(K.ay || ay)}))}</div>`);
  const sb = $('sbody');
  sb.querySelectorAll('[data-tkay]').forEach(b => b.onclick = () => kocTakvimAc(b.dataset.tkay));
  sb.querySelectorAll('[data-tkgun]').forEach(b => b.onclick = () => {
    const j = +b.dataset.tkgun; if (j < 0) return;
    K.sec = j; kocTakvimAy = ''; kapat(); kocKaydet(); kocCiz();
    const bas = $('koc').querySelector('.koc-gun-bas'); if (bas) bas.scrollIntoView({block: 'start', behavior: 'smooth'});
  });
  // sağa/sola kaydırarak ay değiştir
  const g = $('tkGrid'); let x0 = null;
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
  g.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 45) kocTakvimAc(dx < 0 ? sonrakiAy : oncekiAy); });
}

  K.arsivId = kayit.id; kayit.K.arsivId = kayit.id;

  if (D.kocArsiv.length > KOC_ARSIV_EN_COK) D.kocArsiv.length = KOC_ARSIV_EN_COK;

        else { for (let r = 11 + bits(7); r--;) uz.push(0); }
      }
      lt = tablo(uz.slice(0, hlit)); mt = tablo(uz.slice(hlit, hlit + hdist));
    } else throw new Error('tip');
    for (;;){
      const s = coz(lt);
      if (s < 256){ out.push(s); continue; }
      if (s === 256) break;
      const i = s - 257, n = L_TABAN[i] + bits(L_EK[i]), di = coz(mt), m = M_TABAN[di] + bits(M_EK[di]);
      if (m > out.length) throw new Error('mesafe');
      for (let k = 0; k < n; k++) out.push(out[out.length - m]);
    }
  }
  return new Uint8Array(out);
}

function programDogrula(P){
  if (!P || P.v !== 1 || !Array.isArray(P.o) || !Array.isArray(P.g) || !P.o.length || P.g.length < 1 || P.g.length > 31) return null;

  });
  const bilinen = new Set(YEMEKLER.map(f => f.id));
  const o = P.o.filter(x => Array.isArray(x) && SAAT_IDLER.includes(x[0])).map(([id, s]) => [id, /^\d\d:\d\d$/.test(s) ? s : VARSAYILAN_SAAT[id]]);
  if (!o.length) return null;
  const g = P.g.map(gun => o.map((_, oi) => ((gun || [])[oi] || []).filter(x => Array.isArray(x) && (bilinen.has(x[0]) || ozel[x[0]]) && +x[1] > 0)
    .slice(0, 30).map(([f, m]) => ({f: ozel[f] ? ozel[f].id : f, g: sinirla(+m, 0.5, 2000)}))));
  const m = Array.isArray(P.m) ? P.m.map(gun => o.map((_, oi) => String(((gun || [])[oi]) || '').slice(0, 120))) : null;
  const t = {};
  if (P.t) for (const k of ['kcal','protein','karb','yag']) if (+P.t[k] > 0) t[k] = sinirla(Math.round(+P.t[k]), 1, 10000);
  const ay = P.d === 'ay' && /^\d{4}-(0[1-9]|1[0-2])$/.test(String(P.ay || '')) && P.g.length === ayGunSayisi(P.ay) ? P.ay : '';
  return {a:String(P.a || '').slice(0, 40), h:String(P.h || '').slice(0, 60), n:String(P.n || '').slice(0, 400), l:DILLER.some(d => d.k === P.l) ? P.l : '', o, g, m, t, ozel:Object.values(ozel), d: ay ? 'ay' : 'hafta', ay,
    su: +P.su >= 500 && +P.su <= 6000 ? Math.round(+P.su) : 0, kt: /^\d{4}-\d\d-\d\d$/.test(String(P.kt || '')) ? P.kt : '', il: String(P.il || '').replace(/[\u0000-\u001f<>]/g, '').slice(0, 80)};
}
function programUygula(P){
  if (!D.program) D.oncekiPlan = {planlar: kopya(D.planlar), planBaslangic: D.planBaslangic, miktar: kopya(D.miktar || {})};
  const bugun = bugunK();
  const gunYap = gi => P.o.map(([id, saat], oi) => ({id, ad: T('m_' + id), saat, ico: OGUN_IKON[id], ogeler: kopya(P.g[gi][oi]), ...(P.m && P.m[gi][oi] ? {not: P.m[gi][oi]} : {})}));

  P.ozel.forEach(f => { if (!D.ozelYemek.some(y => y.id === f.id)) D.ozelYemek.push(f); });
  if (P.d === 'ay'){
    // Aylık: ayın 1'i = programın 1. günü; plan, ayın 1'ini içeren pazartesiden başlayan haftalar (ay bitince baştan döner)
    const ay = programAyi(P), ilk = ay + '-01', ofs = haftaGunu(ilk), gunSay = ayGunSayisi(ay), haftaSay = Math.ceil((ofs + gunSay) / 7);
    D.planlar = Array.from({length: haftaSay}, (_, w) => Array.from({length: 7}, (_, d) => gunYap(mod(w * 7 + d - ofs))));
    D.planBaslangic = gunEkle(ilk, -ofs);
  } else {
    // Haftalık: aktif haftanın pazartesisinden (daha kısa programda günler sırayla tekrar eder)
    D.planlar = [Array.from({length: 7}, (_, i) => gunYap(mod(i)))];
    D.planBaslangic = gunEkle(bugun, -haftaGunu(bugun));
  }
  D.miktar = {};
  menuleriTemizle(true);
  saatKaydet(bugun, Object.fromEntries(P.o));
  if (P.t.kcal) D.profil.kcal = P.t.kcal;
  if (P.t.protein) D.profil.protein = P.t.protein;
  if (P.t.karb) D.profil.karb = P.t.karb;
  if (P.t.yag) D.profil.yag = P.t.yag;
  if (P.su) D.profil.su = P.su;
  D.program = {a:P.a, h:P.h, n:P.n, t:Date.now(), d:P.d || 'hafta', ay:P.d === 'ay' ? programAyi(P) : '', kt:P.kt || '', il:P.il || ''};
  logEkle('diger', null, T('lImport', {h: P.h || T('progAnon'), a: P.a || '—'}));
  aktif = bugun; detayAcik = false;
  kaydet(); ciz(); toast(T('impDone'));
}

// Birleştirme: profil/plan/ayar son işlem yapılan taraftan; günler birleşir (aynı günde yenen öğünler toplanır, su büyük olan)
function verileriBirlestir(gelen){
  const G = tamamla(kopya(gelen)), sayi0 = kayitliGunler(G).length;
  idbAc().then(db => db.transaction('veri', 'readwrite').objectStore('veri').put(kopya(D), ANAHTAR + '_aktarim_oncesi')).catch(() => {});   // geri dönüş için
  if (!D.ayar.kurulum || !D.planlar.length) D = G;
  else {
    const sonIs = X => (X.log || []).reduce((m, l) => Math.max(m, l.t || 0), 0) || X.guncel || 0;
    const [A, B] = sonIs(G) > sonIs(D) ? [G, D] : [D, G];   // A: güncel taraf (profil, plan, ayar), B: öbürü
    // Kayıtlı günlerin menüsü (ve öbür tarafın geçmiş saatleri) kendi planından sabitlenir; plan değişse de aynı görünür
    const sabitle = (X, saatDe) => {
      const D0 = D; D = X;
      try {
        for (const k of kayitliGunler(X)){
          const r = X.kayit[k];
          try {
            if (!r.ogunler && Object.values(r.yendi || {}).some(Boolean)) r.ogunler = kopya(sablon(k));
            if (saatDe && k < bugunK()) r.saat = {...saatSeti(k), ...(r.saat || {})};
          } catch(e){}
        }
      } finally { D = D0; }
    };
    sabitle(A, false); sabitle(B, true);
    const puan = r => 100 * Object.values(r.yendi || {}).filter(Boolean).length + (r.su || 0) + (r.ogunler ? 1 : 0);
    const kayit = {...B.kayit};
    for (const [k, r] of Object.entries(A.kayit)) kayit[k] = kayit[k] ? (puan(kayit[k]) > puan(r) ? gunBirlestir(kayit[k], r) : gunBirlestir(r, kayit[k])) : r;
    const log = new Map(), oy = new Map();
    for (const l of B.log.concat(A.log)) log.set(l.t + '|' + l.m, l);
    for (const f of B.ozelYemek.concat(A.ozelYemek)) oy.set(f.id, f);
    D = {...A, kayit, tartim: {...(B.tartim || {}), ...(A.tartim || {})}, log: [...log.values()].sort((x, y) => x.t - y.t).slice(-2000), ozelYemek: [...oy.values()],
      ayar: {...B.ayar, ...A.ayar, kurulum: true, turGoruldu: !!(A.ayar.turGoruldu || B.ayar.turGoruldu)}};
  }
  logEkle('diger', null, T('lTasi', {g: sayi0}));
  kaydet(); kapat();
  aktif = bugunK(); detayAcik = false;
  if (D.ayar.kurulum && !$('kurulum').hidden){ document.body.classList.remove('wiz-acik'); $('kurulum').hidden = true; }
  baslat2();
  toast(T('tasiOk', {g: sayi0}), TASI_SURE);
}
// Aynı gün iki tarafta: dolu olan esas; öbüründe yenen ama bunda yenmemiş öğünler eklenir
function gunBirlestir(ust, alt){
  const r = kopya(ust); r.yendi = r.yendi || {};
  r.su = Math.max(ust.su || 0, alt.su || 0);
  if (r.ogunler) for (const o of alt.ogunler || []) if ((alt.yendi || {})[o.id] && !r.yendi[o.id]){
    const i = r.ogunler.findIndex(x => x.id === o.id);
    if (i >= 0) r.ogunler[i] = kopya(o); else r.ogunler.push(kopya(o));
    r.yendi[o.id] = true;
  }
  if (alt.saat) r.saat = {...alt.saat, ...(r.saat || {})};
  return r;
}

const TUR = [[null, 1], ['#gunler', 2], ['.top-btns', 3], ['#ozet .card', 4], ['#ozet [data-paylas]', 5], ['#ozet .water-card', 6],

function hatirlaticiYenile(zorla){

// ---------- Kayıtsızlık hatırlatıcısı: 4,5 saat veri girişi yoksa tatlı bir dürtme (su / ara öğün / öğün) ----------
// Bildirim anına kadar yeni kayıt olursa yeniden kurulur; o yüzden içerik bugünkü kayıtlara göre önceden yazılabilir. En çok 2 bildirim sıraya alınır.
const DURTME_SURE = 4.5 * 36e5, DURTME_TUR = new Set(['yedim', 'su', 'ekle', 'sil', 'gram', 'degis']);
let durtmeZaman = [], durtmeImza = null;

function uyanikAralik(k){
  const m = {}; menuOku(k).forEach(o => { const d = dkOku(ogunSaati(k, o)); if (d >= 0) m[o.id] = d; });
  const aksam = m.aksam != null ? m.aksam : 19 * 60 + 30, bas = (m.kahvalti != null ? m.kahvalti : 8 * 60 + 30) + 60;
  const son = Math.min(Math.max(aksam, m.gece > aksam ? m.gece : 0), 22 * 60);
  return son > bas + 120 ? [bas, son] : [10 * 60, 21 * 60];
}
// Zamanı uyanık saatlere oturt (gece → ertesi sabah)
function durtmeAni(t){
  for (let i = 0; i < 3; i++){
    const z = new Date(t), [bas, son] = uyanikAralik(tarihAnahtar(z)), dk = z.getHours() * 60 + z.getMinutes();
    if (dk < bas){ z.setHours(Math.floor(bas / 60), bas % 60, 0, 0); return z.getTime(); }
    if (dk <= son) return t;
    z.setDate(z.getDate() + 1); z.setHours(0, 0, 0, 0); t = z.getTime();
  }
  return t;
}
// "A ve B" / "A and B": dile uygun liste (Intl.ListFormat yoksa virgülle)
const listeYaz = a => { try { return new Intl.ListFormat(LOC(), {type: 'conjunction'}).format(a); } catch (e) { return a.join(', '); } };
function durtmeMetin(t){
  const z = new Date(t), k = tarihAnahtar(z), r = kayitOku(k), menu = menuOku(k), dk = z.getHours() * 60 + z.getMinutes();
  const kacan = menu.filter(o => dkOku(ogunSaati(k, o)) + 30 <= dk && !r.yendi[o.id]);
  const ara = kacan.filter(o => ARA_IDLER.has(o.id)).pop(), ana = kacan.filter(o => !ARA_IDLER.has(o.id)).pop();
  const h = Math.ceil(suHedefi(k) / D.profil.bardak), su = r.su || 0, tohum = z.getDate() * 7 + z.getHours();
  const sec = (key, p) => { const l = T(key, p).split('|'); return l[tohum % l.length]; };
  let body;
  if (su === 0 && dk >= 11 * 60) body = sec('dSuYok');
  else if (ara) body = sec('dAra', {ogun: ogunAd(ara), liste: listeYaz(ara.ogeler.slice(0, 2).map(it => yemek(it.f).ad)) || '—'});
  else if (ana) body = sec('dAna', {ogun: ogunAd(ana)});
  else if (su < h / 2 && dk >= 15 * 60) body = sec('dSuAz', {n: su, h});

}
function durtmeKur(acik){
  let plan = [];
  if (acik){
    const simdi = Date.now(), t1 = durtmeAni(Math.max(sonGiris() + DURTME_SURE, simdi + 36e5)), t2 = durtmeAni(t1 + DURTME_SURE);
    plan = [t1, t2].map((at, i) => ({id: 'durtme' + (i + 1), at, ...durtmeMetin(at)}));
  }
  const imza = dil + JSON.stringify(plan.map(x => [x.id, Math.round(x.at / 6e4), x.body]));
  if (imza === durtmeImza) return;
  durtmeImza = imza;
  durtmeZaman.forEach(clearTimeout); durtmeZaman = [];

  if (yerli && window.__lfCancelNotify) ['durtme1', 'durtme2'].forEach(id => { try { window.__lfCancelNotify(id); } catch(e){} });
  for (const x of plan){
    if (yerli){ try { window.__lfNotify({id: x.id, title: x.title, body: x.body, at: x.at}); } catch(e){} continue; }
    const g = x.at - Date.now();
    if (g > 0 && g < 864e5) durtmeZaman.push(setTimeout(() => { bildirimGoster(x.title, x.body, x.id); durtmeImza = null; }, g));
  }
}
function bildirimGoster(title, body, tag){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const sec = {body, tag, icon: 'icons/diyet-192.png', badge: 'icons/diyet-192.png'};
  const dogrudan = () => { try { new Notification(title, sec); } catch(e){} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r => { if (r && r.showNotification) r.showNotification(title, sec); else dogrudan(); }).catch(dogrudan);
  else dogrudan();

const NOADS_URUN = 'com.maviplay.liferoutine.noads';
const REKLAM_ANAHTAR = 'lf_reklam';
const REKLAM = {ilkSure: 10 * 60000, aralik: 180000, gunluk: 8, yemekHer: 5, gunHer: 4, gecikme: 1000, fiyat: '99,99 TL'};
// magaza: null = henüz bilinmiyor, true/false = iap:status · aliniyor/geriYukleniyor: düğme kilidi · sonNoAds: kabuğa en son bildirilen
const Reklam = {inter: false, privacy: false, magaza: null, fiyat: '', aliniyor: false, geriYukleniyor: false, bekliyor: false, sonNoAds: null, sonSupur: 0};
const yerelKabuk = () => !!window.__LF_NATIVE;
function lfGonder(o){ try { if (window.__lfPost) window.__lfPost(o); } catch(e){} }   // shim yoksa no-op
function rdOku(){ try { const v = JSON.parse(localStorage.getItem(REKLAM_ANAHTAR) || 'null'); return v && typeof v === 'object' ? v : {}; } catch(e){ return {}; } }
function rdYaz(R){ try { localStorage.setItem(REKLAM_ANAHTAR, JSON.stringify(R)); } catch(e){} }
// Reklamsız: D.ayar.reklamsiz (hesapla eşitlenir) ya da cihaz yansısı lf_reklam.noads (yedekten dönüş vb. D değişse de kaybolmasın)
const reklamsizMi = () => !!((D && D.ayar && D.ayar.reklamsiz) || rdOku().noads);

// İlk açılış: D.ayar.ilkAcilis yoksa şimdi yazılır. kaydet() ÇAĞRILMAZ — açılışta kaydetmek IndexedDB'deki daha yeni kopyayı
// boş durumla ezebilir; değer bir sonraki doğal kayıtla kalıcı olur. Cihaz yansısı lf_reklam.ilk: eşitlemeyle gelen eski tarih de
// bu cihazdaki ilk 10 dakikayı korusun diye ikisinin büyüğü alınır.
function ilkAcilis(){
  const R = rdOku(), simdi = Date.now();
  if (!(R.ilk > 0)){ R.ilk = simdi; rdYaz(R); }
  if (D && D.ayar && !(D.ayar.ilkAcilis > 0)) D.ayar.ilkAcilis = R.ilk;
  return Math.max(R.ilk, (D && D.ayar && D.ayar.ilkAcilis) || 0);
}
// Şu an geçiş reklamı gösterilebilir mi? (tüm sınırlar burada; tetik anında değil, gösterim anında denetlenir)
function reklamUygun(){
  if (!yerelKabuk() || reklamsizMi() || !Reklam.inter || document.visibilityState === 'hidden') return false;
  if (!D || !D.ayar || !D.ayar.kurulum || !$('kurulum').hidden || document.body.classList.contains('wiz-acik')) return false;   // kurulum sihirbazı (W)
  if ($('overlay').classList.contains('open') && $('sheet').querySelector('#onayEvet, #impEvet, #rKvkk, #rSaglik')) return false;   // onay / rıza penceresi
  if ($('tur') || $('rapor') || ($('koc') && !$('koc').hidden)) return false;   // kullanım turu, rapor belgesi, başkası için program ekranı
  const R = rdOku(), simdi = Date.now(), ilk = ilkAcilis();
  if (ilk <= simdi && simdi - ilk < REKLAM.ilkSure) return false;
  if (R.son > 0 && R.son <= simdi && simdi - R.son < REKLAM.aralik) return false;   // saat geri alındıysa (son > şimdi) kilitlenmez
  if (R.gun === bugunK() && (R.n || 0) >= REKLAM.gunluk) return false;
  return true;
}
function reklamGoster(){
  if (!reklamUygun()) return;
  const R = rdOku(), bugun = bugunK();
  if (R.gun !== bugun){ R.gun = bugun; R.n = 0; }
  R.n = (R.n || 0) + 1; R.son = Date.now();
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  rdYaz(R);
  lfGonder({t: 'ad:show', kind: 'inter', id});
}
// Tetik: 'program' | 'yemek' (her 5.) | 'gun' (her 4.) | 'paylas' | 'rapor'. Gösterim kısa gecikmeyle (ekran çizilsin, bildirim görünsün).
let reklamSessiz = 0, reklamZaman = null;
function reklamTetik(neden){
  if (!yerelKabuk() || reklamSessiz || reklamsizMi()) return;
  const her = {yemek: REKLAM.yemekHer, gun: REKLAM.gunHer}[neden];
  if (her){
    const R = rdOku(), s = R.s && typeof R.s === 'object' ? R.s : (R.s = {});
    s[neden] = ((s[neden] || 0) + 1) % her;
    rdYaz(R);
    if (s[neden]) return;
  }
  clearTimeout(reklamZaman);
  reklamZaman = setTimeout(reklamGoster, REKLAM.gecikme);
}
// Kabuğa reklamsız durumunu bildir (yalnız değişince); D başka kaynaktan gelip reklamsız dediyse cihaz yansısı da yazılır
function reklamsizBildir(ilk){
  const on = reklamsizMi();
  if (on && D && D.ayar && !D.ayar.reklamsiz) D.ayar.reklamsiz = true;   // bir sonraki doğal kayıtla kalıcı olur
  if (on && !rdOku().noads){ const R = rdOku(); R.noads = true; rdYaz(R); }
  if (Reklam.sonNoAds === on) return;
  Reklam.sonNoAds = on;
  lfGonder(ilk ? {t: 'ad:init', noAds: on} : {t: 'ad:noads', on});
}

// ---------- Kabuk → web ----------
window.__lfAd = function(m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'ad:status'){
    const p0 = Reklam.privacy;
    Reklam.inter = !!m.inter; Reklam.privacy = !!m.privacy;
    if (p0 !== Reklam.privacy) reklamBolumuCiz();
    return;
  }
  // Reklam süresince kabuk uygulamayı zaten duraklatır; sonrasında yalnız zaman damgası (180 sn bekleme reklam kapanınca başlar)
  if (m.t === 'ad:result'){ const R = rdOku(); R.son = Date.now(); rdYaz(R); }
};
window.__lfIap = function(m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'iap:status'){ Reklam.magaza = !!m.available; reklamBolumuCiz(); return; }
  if (m.t === 'iap:products'){
    const p = (Array.isArray(m.products) ? m.products : []).find(x => x && x.id === NOADS_URUN);
    if (p && p.displayPrice) Reklam.fiyat = String(p.displayPrice);
    reklamBolumuCiz(); return;
  }
  if (m.t === 'iap:result'){ satinAlmaSonucu(m); return; }
  if (m.t === 'iap:restored'){
    Reklam.geriYukleniyor = false;
    if (!m.ok) toast(T('rkMagazaYok'));
    else if (!reklamsizMi()) toast(T('rkGeriYok'));
    reklamBolumuCiz();
  }
};
// Satın alma / geri yükleme / bekleyen işlem sonucu. Sıra: teslim (D.ayar) → kaydet() → mağazaya onay (iap:ack) → kabuğa reklamsız
function satinAlmaSonucu(m){
  Reklam.aliniyor = false;
  if (m.ok && m.productId === NOADS_URUN){
    const tx = m.transactionId != null && m.transactionId !== '' ? String(m.transactionId) : '';
    const liste = Array.isArray(D.ayar.iapTx) ? D.ayar.iapTx : [];
    if (tx && liste.includes(tx)){ lfGonder({t: 'iap:ack', transactionId: tx}); reklamBolumuCiz(); return; }   // aynı işlem yeniden geldi: yalnız onay
    const onceden = reklamsizMi();
    D.ayar.reklamsiz = true;
    if (tx) D.ayar.iapTx = liste.concat(tx).slice(-50);
    Reklam.bekliyor = false;
    kaydet();
    const R = rdOku(); R.noads = true; rdYaz(R);
    if (tx) lfGonder({t: 'iap:ack', transactionId: tx});
    Reklam.sonNoAds = true; lfGonder({t: 'ad:noads', on: true});
    clearTimeout(reklamZaman);
    if (m.restored) toast(T('rkGeriOk'), 3500);
    else if (!onceden) toast(T('rkTesekkur'), 3500);
    reklamBolumuCiz();
    return;
  }
  if (m.pending){ Reklam.bekliyor = true; toast(T('rkBekliyor'), 4000); }
  else if (!m.cancelled && !m.ok) toast(T('rkHata'));   // iptal sessiz
  reklamBolumuCiz();
}

document.head.insertAdjacentHTML('beforeend', `<style>

function reklamBolumuCiz(){

      ${kapali ? `<div class="wmsg warn">${esc(T('rkMagazaYok'))}</div>` : `<div class="hint" style="margin-top:6px">${esc(T('rkTekSefer'))}</div>`}
      ${Reklam.bekliyor ? `<div class="wmsg info">${esc(T('rkBekliyor'))}</div>` : ''}`;
  }
  const al = $('rkAlBtn'), geri = $('rkGeriBtn'), gz = $('rkGizlilikBtn');
  if (al) al.onclick = () => {
    Reklam.aliniyor = true; reklamBolumuCiz();

    clearTimeout(Reklam._z); Reklam._z = setTimeout(() => { Reklam.aliniyor = false; reklamBolumuCiz(); }, 60000);   // kabuk yanıt vermezse düğme açılır

  if (geri) geri.onclick = () => {

// ---------- Yalnız yerel kabukta: açılış mesajları ve tetik sarmalamaları (web'de mevcut davranış hiç değişmez) ----------
if (yerelKabuk()){
  ilkAcilis();
  reklamsizBildir(true);                                   // {t:'ad:init', noAds}
  lfGonder({t: 'iap:init', skus: [NOADS_URUN]});

  const kapatR0 = kapat;

const AYAR_SIRA = ['ust', 'tur', 'reklam', 'tasi', 'yedek', 'olcu', 'saat', 'hedef', 'profil', 'regl', 'yukle', 'spor', 'antrenman', 'bildirim', 'yasal', 'sifirla'];
let rkGozlemci = null;
function ayarSirala(){
  const sb = $('sbody'); if (!sb) return;
  const bul = k => k === 'reklam' ? $('reklamBolum') : sb.querySelector(`:scope > .ayar-blok[data-ak="${k}"]`);

// Reklamlar kartı göründüğünde YALNIZ "Reklamları kaldır" düğmesi titrer (02.11: kartın tamamı değil); kart ekrandan çıkıp
// yeniden görününce tekrar titrer. Düğme durum değişince yeniden çizildiği için her seferinde $('rkAlBtn') ile bulunur.
function rkTitresimKur(){
  if (rkGozlemci){ rkGozlemci.disconnect(); rkGozlemci = null; }
  const el = $('reklamBolum'), sb = $('sbody');
  if (!el || !sb || reklamsizMi()) return;
  el.classList.add('rk-kutu');
  const titret = () => {
    const b = $('rkAlBtn'); if (!b || b.disabled) return;
    b.classList.remove('titre'); void b.offsetWidth; b.classList.add('titre');
    b.addEventListener('animationend', () => b.classList.remove('titre'), {once: true});
  };
  let ayrildi = true;   // ilk görünüşte titresin
  if (!('IntersectionObserver' in window)){ setTimeout(titret, 350); return; }
  rkGozlemci = new IntersectionObserver(girdiler => {
    for (const g of girdiler){
