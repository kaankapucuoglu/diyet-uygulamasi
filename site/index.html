<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:url" content="https://diyet.maviplay.com/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/app/icons/diyet.svg">
<link rel="apple-touch-icon" href="/app/icons/diyet-apple-180.png">
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#e3e9f1;--text:#132036;--muted:#5b6b82;--green:#13935f;--green2:#16a36b;--green-soft:#e5f6ee;--blue:#2563eb;--blue-soft:#eaf1ff;--gold:#b7791f;--gold-soft:#fdf3e2;--rose:#be185d;--rose-soft:#fce7f3;--r:18px;
  --shadow:0 1px 2px rgba(19,32,54,.05),0 10px 30px rgba(19,32,54,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:Inter,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--blue)}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid #93b4f5;outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Üst çubuk */
.nav{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(227,233,241,.8)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:62px;padding-top:max(0px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--text);text-decoration:none;margin-inline-end:auto}
.brand img{width:34px;height:34px;border-radius:9px}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:12.5px;font-weight:700;min-width:40px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
/* Kahraman */
.hero{padding:56px 0 40px;background:radial-gradient(900px 420px at 85% 0%,#d9f3e7 0%,transparent 60%),radial-gradient(800px 380px at 0% 10%,#e3ecff 0%,transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--green);background:var(--green-soft);padding:6px 12px;border-radius:99px}
h1{font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:16px 0 14px}
h1 em{font-style:normal;color:var(--green2)}
.lead{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:580px}
/* Düğmeler: yan yana sığmazsa alta kayar (flex-wrap), 560 px altında tam genişlik alt alta */
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 20px;border-radius:14px;font:inherit;font-weight:700;font-size:15.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .2s;min-width:0}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green2);color:#fff;box-shadow:0 8px 20px rgba(22,163,107,.28)}
.btn.pri:hover{background:var(--green)}
.btn.sec{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:var(--shadow)}
.btn.sec:hover{border-color:#c9d5e6}
.btn.dark{background:var(--text);color:#fff;box-shadow:0 8px 20px rgba(19,32,54,.22)}
.btn.dark:hover{background:#0b1426}
/* Mağaza düğmeleri: iki satırlı etiket */
.btn.store{min-height:58px;padding:0 20px 0 16px;text-align:start;justify-content:flex-start}
.btn.store .ic{width:26px;height:26px}
.btn.store .lbl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.btn.store small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.store b{font-size:16px}
.btn.store.soon{cursor:default}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--muted);font-size:14px;font-weight:600}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts .ic{width:18px;height:18px;color:var(--green2)}
.shots{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:18px;min-height:420px}
.phone{width:min(250px,44vw);border-radius:34px;padding:9px;background:#0f1a2c;box-shadow:0 30px 60px rgba(19,32,54,.25)}
.phone img,.phone video{display:block;border-radius:26px;width:100%;height:auto;aspect-ratio:390/844;object-fit:cover;object-position:top;background:#eef2f7}
.phone.b{transform:translateY(-34px)}
.phone.vid{position:relative}
.vbtn{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;color:#fff;background:rgba(15,26,44,.78);box-shadow:0 4px 14px rgba(15,26,44,.3)}
.vbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.vbtn .i-play{display:none;fill:currentColor;stroke:none}
.phone.dur .vbtn .i-play{display:block}.phone.dur .vbtn .i-pause{display:none}
.vbtn:focus-visible{outline:3px solid var(--green2);outline-offset:2px}
.vidcap{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
/* Bölümler */
section{padding:64px 0}
.sec-head{max-width:720px;margin-bottom:30px}
.sec-head h2{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.sec-head p{color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.feat .fi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--green-soft);color:var(--green2);margin-bottom:14px}
.feat:nth-child(3n+2) .fi{background:var(--blue-soft);color:var(--blue)}
.feat:nth-child(3n) .fi{background:var(--gold-soft);color:var(--gold)}
.feat.rose .fi{background:var(--rose-soft);color:var(--rose)}
.feat h3{font-size:17.5px;margin-bottom:6px}
.feat p{color:var(--muted);font-size:15px}
/* Galeri */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.gallery figure{text-align:center}
.gallery .phone{width:100%;max-width:240px;margin:0 auto}
.gallery figcaption{margin-top:12px;font-weight:700;font-size:14.5px;color:var(--muted)}
.pc{margin-top:34px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;background:#fff}
.pc .bar{display:flex;gap:6px;padding:10px 14px;background:#eef2f7;border-bottom:1px solid var(--line)}
.pc .bar i{width:11px;height:11px;border-radius:50%;background:#cfd8e5}
.pc img{width:100%;height:auto}
.pc figcaption{padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line)}
/* Paylaşım adımları */
.coach{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.steps{list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--green2);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14.5px}
/* Yükleme */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:700;font-size:15px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected=true]{background:var(--text);border-color:var(--text);color:#fff}
.panel{display:none}
.panel.on{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}
.panel ol{padding-inline-start:0;list-style:none;counter-reset:a;display:grid;gap:10px}
.panel ol li{counter-increment:a;display:flex;gap:12px;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.panel ol li::before{content:counter(a);flex:none;width:28px;height:28px;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-weight:800;display:grid;place-items:center;font-size:14px}
.panel .side{display:grid;gap:10px}
.note{font-size:14px;color:var(--muted);background:var(--card);border:1px dashed #c9d5e6;border-radius:14px;padding:14px 16px}
/* SSS */
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 18px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;padding:15px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--muted);flex:none}
.faq details[open] summary::after{content:"–"}
.faq p{color:#3c4b62;font-size:15px;padding:0 0 16px}
/* Gizlilik */
.kvkk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.kvkk p{color:#3c4b62;font-size:15px}
.legal{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.legal a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:14.5px}
.legal a:hover{border-color:#c9d5e6;background:#fff}
.legal .ic{width:18px;height:18px;color:var(--green2)}
.kvkk .small{margin-top:16px;font-size:13.5px;color:var(--muted)}
footer{padding:34px 0 calc(34px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
footer .sp{margin-inline-start:auto}
@media (max-width:900px){
  .hero .wrap,.coach,.panel.on{grid-template-columns:1fr}
  .shots{min-height:0;margin-top:6px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .hero{padding-top:30px}
  .langs button{min-width:36px;font-size:12px}
  .brand span{display:none}
  .phone{width:44vw;border-radius:26px;padding:6px}
  .phone img,.phone video{border-radius:21px}
  .phone.b{transform:translateY(-20px)}
  .btn{width:100%}
  section{padding:46px 0}
  .gallery{gap:12px}
}
</style>
</head>

c10:['Diyetisyenin ya da antrenörün hazırladığı program bağlantıyla, WhatsApp’la ya da uygulama içinde kullanıcı adıyla gelir; tek onayla yüklenir.','A plan from your dietitian or coach arrives as a link, via WhatsApp or in-app by username, and loads with one confirmation.','План от диетолога или тренера приходит ссылкой, через WhatsApp или в приложении по имени пользователя и загружается одним подтверждением.','Ein Plan vom Berater oder Trainer kommt als Link, per WhatsApp oder in der App über den Benutzernamen und wird mit einer Bestätigung geladen.','تصلك خطة أخصائي التغذية أو المدرب برابط أو عبر واتساب أو داخل التطبيق باسم المستخدم، وتُحمَّل بتأكيد واحد.'],
c11t:['Sıralama (isteğe bağlı)','Leaderboard (optional)','Рейтинг (по желанию)','Rangliste (optional)','الترتيب (اختياري)'],
c11:['Üst üste kayıt tuttuğun gün sayısıyla dünyada ve ülkende sıralan. Yalnız kullanıcı adın ve gün sayın görünür; sağlık verin asla.','Rank in your country and worldwide by your streak of logged days. Only your username and day count are shown, never health data.','Соревнуйтесь по серии дней с записями — в своей стране и в мире. Видны только имя пользователя и число дней, никаких данных о здоровье.','Mit deiner Serie protokollierter Tage im Land und weltweit. Sichtbar sind nur Benutzername und Tage, nie Gesundheitsdaten.','تنافس في بلدك والعالم بعدد الأيام المتتالية التي سجّلت فيها. يظهر اسم المستخدم وعدد الأيام فقط، ولا تظهر بياناتك الصحية أبداً.'],
c12t:['5 dil, her cihaz','5 languages, any device','5 языков, любое устройство','5 Sprachen, jedes Gerät','5 لغات وأي جهاز'],
c12:['Türkçe, İngilizce, Rusça, Almanca, Arapça. Android, iPhone, iPad ve web’de aynı düzen; web’de reklam yok, uygulamada seyrek reklam ve tek seferlik “Reklamları kaldır” seçeneği var.','Turkish, English, Russian, German and Arabic. Same layout on Android, iPhone, iPad and the web; no ads on the web, occasional ads in the app with a one-time “Remove ads” option.','Турецкий, английский, русский, немецкий, арабский. Один интерфейс на Android, iPhone, iPad и в браузере; в браузере без рекламы, в приложении редкая реклама и разовая опция «Убрать рекламу».','Türkisch, Englisch, Russisch, Deutsch, Arabisch. Gleiche Oberfläche auf Android, iPhone, iPad und im Web; im Web keine Werbung, in der App gelegentlich Werbung – einmalig „Werbung entfernen“ möglich.','التركية والإنجليزية والروسية والألمانية والعربية. التصميم نفسه على أندرويد وآيفون وآيباد والويب؛ لا إعلانات على الويب، وإعلانات قليلة في التطبيق مع خيار «إزالة الإعلانات» لمرة واحدة.'],

galS:['Sade, büyük dokunma alanları; telefonda tek elle kullanılır.','Clean design with big touch targets; easy to use with one hand.','Простой дизайн и крупные кнопки — удобно одной рукой.','Klares Design, große Tippflächen; einhändig bedienbar.','تصميم بسيط وأزرار كبيرة؛ سهل الاستخدام بيد واحدة.'],

coachT:['Diyetisyenler ve antrenörler için','For dietitians and coaches','Для диетологов и тренеров','Für Ernährungsberater und Trainer','لأخصائيي التغذية والمدربين'],
coachS:['Danışanına gün gün, öğün öğün program yaz; saatleri ve miktarları belirle. Bağlantıyla, WhatsApp’la ya da uygulama içinde kullanıcı adıyla gönder. Danışanının bilgilerini girmeden önce onayını al; programı yalnız ona gönder.','Write a plan for your client day by day and meal by meal, set times and amounts. Send it as a link, via WhatsApp or in-app by username. Get your client’s consent before entering their details and send the plan only to them.','Составьте план для клиента по дням и приёмам пищи, задайте время и порции. Отправьте ссылкой, через WhatsApp или в приложении по имени пользователя.','Plan für Klienten Tag für Tag und Mahlzeit für Mahlzeit schreiben, Zeiten und Mengen festlegen. Als Link, per WhatsApp oder in der App über den Benutzernamen senden.','اكتب خطة لعميلك يوماً بيوم ووجبة بوجبة، وحدد المواعيد والكميات. أرسلها برابط أو عبر واتساب أو داخل التطبيق باسم المستخدم.'],
s1t:['Programı hazırla','Create the plan','Составьте план','Plan erstellen','أعدّ الخطة'],
s1:['Uygulamada “Program hazırla”ya dokun; öğün saatlerini seç, yemekleri ekle, notlarını yaz.','Tap “Create plan” in the app; set meal times, add foods and notes.','Нажмите «Составить план», задайте время, добавьте блюда и заметки.','Tippe auf „Plan erstellen“, setze Zeiten, füge Lebensmittel und Notizen hinzu.','اضغط «إعداد خطة»، حدد المواعيد وأضف الأطعمة والملاحظات.'],
s2t:['Gönder','Send it','Отправьте','Senden','أرسلها'],
s2:['Bağlantıyı kopyala, WhatsApp’la paylaş ya da danışanın kullanıcı adını yaz: program gelen kutusuna düşer.','Copy the link, share it on WhatsApp or type your client’s username: the plan lands in their inbox.','Скопируйте ссылку, отправьте в WhatsApp или введите имя пользователя клиента — план попадёт в его входящие.','Link kopieren, per WhatsApp teilen oder den Benutzernamen des Klienten eingeben: Der Plan landet im Posteingang.','انسخ الرابط أو شاركه عبر واتساب أو اكتب اسم مستخدم عميلك، فتصل الخطة إلى صندوقه الوارد.'],
s3t:['Danışan onaylar','Client confirms','Клиент подтверждает','Klient bestätigt','العميل يؤكد'],
s3:['“Program yüklensin mi?” sorusuna Evet deyince program, saatleriyle birlikte yüklenir.','After a tap on Yes to “Load this plan?”, the plan loads with its times.','После «Да» на вопрос «Загрузить план?» план загружается вместе со временем.','Nach „Ja“ bei „Plan laden?“ wird er samt Zeiten geladen.','عند الضغط على «نعم» لسؤال «تحميل الخطة؟» تُحمَّل الخطة بمواعيدها.'],
instT:['Yükle','Get the app','Установить','App holen','احصل على التطبيق'],
instS:['Android ve iPhone için uygulama, dilersen tarayıcıda web sürümü. Hesap açarsan hepsi aynı verilerle çalışır.','An app for Android and iPhone, or the web version in your browser. With an account they all share the same data.','Приложение для Android и iPhone или веб-версия в браузере. С аккаунтом все они работают с одними данными.','App für Android und iPhone oder die Web-Version im Browser. Mit Konto arbeiten alle mit denselben Daten.','تطبيق لأندرويد وآيفون، أو إصدار الويب في المتصفح. مع حساب تعمل كلها بالبيانات نفسها.'],

installPc:['Ana ekrana / masaüstüne ekle','Add to home screen / desktop','Добавить на экран / рабочий стол','Zum Startbildschirm / Desktop','أضف إلى الشاشة الرئيسية / سطح المكتب'],
andSteps:['Google Play’deki dahili test sürümüne katıl (bağlantı)|Google Play’den yükle|Aç; birkaç soruyla kurulumu tamamla','Join the internal test on Google Play (link)|Install from Google Play|Open it and answer a few setup questions','Присоединитесь к внутреннему тестированию в Google Play (ссылка)|Установите из Google Play|Откройте и ответьте на несколько вопросов','Dem internen Test bei Google Play beitreten (Link)|Aus Google Play installieren|Öffnen und ein paar Fragen zur Einrichtung beantworten','انضم إلى الاختبار الداخلي في Google Play (الرابط)|ثبّت من Google Play|افتحه وأجب عن بضعة أسئلة للإعداد'],
andNote:['Dahili test sürümü mağazada görünmez, yalnız bağlantıyla yüklenir. Güncellemeler Google Play’den gelir.','The internal test build is not visible in the store and is installed only via the link. Updates come through Google Play.','Внутренняя тестовая версия не видна в магазине и устанавливается только по ссылке. Обновления приходят через Google Play.','Die interne Testversion ist im Store nicht sichtbar und wird nur über den Link installiert. Updates kommen über Google Play.','إصدار الاختبار الداخلي لا يظهر في المتجر ويُثبَّت بالرابط فقط. التحديثات تأتي عبر Google Play.'],
iosSteps:['App Store’dan TestFlight uygulamasını yükle|TestFlight davet bağlantısına dokun, “Yükle”ye bas|Uygulamayı aç; kurulumu tamamla','Install TestFlight from the App Store|Tap the TestFlight invite link, then “Install”|Open the app and finish the setup','Установите TestFlight из App Store|Нажмите на ссылку-приглашение TestFlight, затем «Установить»|Откройте приложение и завершите настройку','TestFlight aus dem App Store installieren|Auf den TestFlight-Einladungslink tippen, dann „Installieren“|App öffnen und die Einrichtung abschließen','ثبّت TestFlight من App Store|اضغط رابط دعوة TestFlight ثم «تثبيت»|افتح التطبيق وأكمل الإعداد'],
iosNote:['TestFlight sürümleri 90 gün geçerlidir; yeni sürüm çıkınca TestFlight haber verir.','TestFlight builds are valid for 90 days; TestFlight notifies you when a new build is out.','Сборки TestFlight действуют 90 дней; о новой версии TestFlight сообщит.','TestFlight-Versionen gelten 90 Tage; bei einer neuen Version meldet sich TestFlight.','إصدارات TestFlight صالحة 90 يوماً؛ يخبرك TestFlight عند صدور إصدار جديد.'],
pcSteps:['“Web’de aç”a dokun; yüklemesiz çalışır|İstersen ana ekrana ya da masaüstüne ekle (Chrome/Edge: “Uygulamayı yükle”, Safari: Paylaş → Ana Ekrana Ekle)|Hesap açarsan telefon uygulamasıyla aynı verileri görürsün','Tap “Open on the web”; nothing to install|Optionally add it to your home screen or desktop (Chrome/Edge: “Install app”, Safari: Share → Add to Home Screen)|With an account you see the same data as in the phone app','Нажмите «Открыть в браузере» — без установки|При желании добавьте на главный экран или рабочий стол (Chrome/Edge: «Установить приложение», Safari: Поделиться → На экран «Домой»)|С аккаунтом вы увидите те же данные, что и в приложении','„Im Browser öffnen“ antippen – ohne Installation|Optional zum Startbildschirm oder Desktop hinzufügen (Chrome/Edge: „App installieren“, Safari: Teilen → Zum Home-Bildschirm)|Mit Konto siehst du dieselben Daten wie in der Handy-App','اضغط «افتح في المتصفح»؛ يعمل دون تثبيت|إن أردت أضفه إلى الشاشة الرئيسية أو سطح المكتب (كروم/إيدج: «تثبيت التطبيق»، سفاري: مشاركة ← إضافة إلى الشاشة الرئيسية)|مع حساب ترى البيانات نفسها كما في تطبيق الهاتف'],
pcNote:['Web sürümünde bildirimler yalnız sayfa açıkken çalışır; hatırlatıcılar için telefon uygulamasını kullan.','In the web version notifications only work while the page is open; use the phone app for reminders.','В веб-версии уведомления работают только при открытой странице; для напоминаний используйте приложение.','In der Web-Version kommen Benachrichtigungen nur bei geöffneter Seite; für Erinnerungen die Handy-App nutzen.','في إصدار الويب تعمل الإشعارات فقط عندما تكون الصفحة مفتوحة؛ استخدم تطبيق الهاتف للتذكير.'],
sssT:['Sık sorulanlar','FAQ','Частые вопросы','Häufige Fragen','الأسئلة الشائعة'],
q1:['Verilerim nerede saklanıyor?','Where is my data stored?','Где хранятся мои данные?','Wo liegen meine Daten?','أين تُخزَّن بياناتي؟'],
a1:['Hesap açmazsan yalnız cihazında. Hesap açarsan profilin ve kayıtların, cihazların arasında eşitlenmek için Almanya’daki (AB) sunucumuzda da saklanır; yalnız açık rızanla, istediğin an silebilirsin. Kişisel ve sağlık verilerin reklam için kullanılmaz, üçüncü taraflarla paylaşılmaz; kendi takip veya analiz aracımız yok.','Without an account, only on your device. With an account, your profile and logs are also stored on our server in Germany (EU) to sync between your devices — only with your explicit consent, and you can delete them any time. Your personal and health data is never used for ads or shared with third parties; we use no tracking or analytics tools of our own.','Без аккаунта — только на устройстве. С аккаунтом профиль и записи также хранятся на нашем сервере в Германии (ЕС) для синхронизации между устройствами — только с вашего явного согласия, удалить можно в любой момент. Личные данные и данные о здоровье не используются для рекламы и не передаются третьим лицам; собственных инструментов слежки и аналитики у нас нет.','Ohne Konto nur auf deinem Gerät. Mit Konto werden Profil und Protokolle zusätzlich auf unserem Server in Deutschland (EU) gespeichert, um zwischen deinen Geräten zu synchronisieren – nur mit deiner ausdrücklichen Einwilligung, jederzeit löschbar. Persönliche und Gesundheitsdaten werden nie für Werbung genutzt oder an Dritte weitergegeben; eigene Tracking- oder Analysewerkzeuge setzen wir nicht ein.','بدون حساب على جهازك فقط. مع حساب تُخزَّن بياناتك أيضاً على خادمنا في ألمانيا (الاتحاد الأوروبي) للمزامنة بين أجهزتك، بموافقتك الصريحة فقط، ويمكنك حذفها متى شئت. لا تُستخدَم بياناتك الشخصية والصحية للإعلانات ولا تُشارَك مع أطراف ثالثة؛ ولا نستخدم أدوات تتبّع أو تحليلات خاصة بنا.'],
q2:['Hesap açmak zorunlu mu?','Do I need an account?','Нужен ли аккаунт?','Brauche ich ein Konto?','هل الحساب إلزامي؟'],
a2:['Hayır. Tüm özellikler hesapsız çalışır. Hesap yalnız cihazlar arası eşitleme, uygulama içi paylaşım (kullanıcı adıyla) ve sıralama için gerekir. Kullanıcı adı ve şifre yeter; e-posta ya da telefon istenmez.','No. Everything works without one. An account is only needed for syncing across devices, in-app sharing by username and the leaderboard. A username and password are enough; no e-mail or phone number.','Нет. Всё работает без него. Аккаунт нужен только для синхронизации между устройствами, обмена в приложении по имени пользователя и рейтинга. Достаточно имени пользователя и пароля; e-mail и телефон не нужны.','Nein. Alles funktioniert ohne. Ein Konto brauchst du nur für die Synchronisation zwischen Geräten, das Teilen in der App per Benutzername und die Rangliste. Benutzername und Passwort genügen; keine E-Mail, keine Telefonnummer.','لا. كل الميزات تعمل بدون حساب. الحساب مطلوب فقط للمزامنة بين الأجهزة والمشاركة داخل التطبيق باسم المستخدم والترتيب. يكفي اسم مستخدم وكلمة مرور؛ لا بريد ولا هاتف.'],
q3:['Bu tıbbi tavsiye mi?','Is this medical advice?','Это медицинская рекомендация?','Ist das ein medizinischer Rat?','هل هذه نصيحة طبية؟'],
a3:['Hayır. Uygulama genel beslenme bilgisine dayanan bir takip aracıdır; tıbbi cihaz değildir, teşhis ve tedavi yerine geçmez. Hamilelik, kronik hastalık, ilaç kullanımı ya da yeme bozukluğu öyküsü varsa planı doktoruna ya da diyetisyenine danışmadan uygulama.','No. The app is a tracking tool based on general nutrition data; it is not a medical device and does not replace diagnosis or treatment. If you are pregnant, have a chronic condition, take medication or have a history of eating disorders, check the plan with your doctor or dietitian first.','Нет. Приложение — инструмент учёта на основе общих данных о питании; это не медицинское изделие и не замена диагностике и лечению. При беременности, хронических заболеваниях, приёме лекарств или расстройствах пищевого поведения сначала обсудите план с врачом или диетологом.','Nein. Die App ist ein Tracking-Werkzeug auf Basis allgemeiner Ernährungsdaten; sie ist kein Medizinprodukt und ersetzt weder Diagnose noch Behandlung. Bei Schwangerschaft, chronischer Krankheit, Medikamenten oder Essstörungen den Plan zuerst mit Arzt oder Ernährungsberater besprechen.','لا. التطبيق أداة متابعة تعتمد على معلومات غذائية عامة؛ ليس جهازاً طبياً ولا يحل محل التشخيص أو العلاج. في حالات الحمل أو الأمراض المزمنة أو تناول الأدوية أو اضطرابات الأكل، استشر طبيبك أو أخصائي التغذية قبل اتباع الخطة.'],
q4:['Ücretli mi? Reklam var mı?','Is it paid? Are there ads?','Платное? Есть реклама?','Kostet es etwas? Gibt es Werbung?','هل هو مدفوع؟ هل فيه إعلانات؟'],
a4:['Ücretsiz. Android ve iPhone uygulaması ara sıra reklam gösterir; tek seferlik “Reklamları kaldır” satın alımıyla kapatabilirsin (abonelik değil). Web’de reklam yok. Kişisel ve sağlık verilerin reklam için kullanılmaz; kendi takip aracımız yok.','It’s free. The Android and iPhone app shows occasional ads; a one-time “Remove ads” purchase turns them off (not a subscription). No ads on the web. Your personal and health data is never used for ads, and we use no tracking tools of our own.','Бесплатно. Приложение для Android и iPhone иногда показывает рекламу; разовая покупка «Убрать рекламу» её отключает (это не подписка). В браузере рекламы нет. Личные данные и данные о здоровье не используются для рекламы, собственных трекеров у нас нет.','Kostenlos. Die Android- und iPhone-App zeigt gelegentlich Werbung; mit dem einmaligen Kauf „Werbung entfernen“ schaltest du sie ab (kein Abo). Im Web gibt es keine Werbung. Persönliche und Gesundheitsdaten werden nie für Werbung genutzt; eigene Tracker setzen wir nicht ein.','مجاني. يعرض تطبيق أندرويد وآيفون إعلانات من حين لآخر، ويوقفها شراء «إزالة الإعلانات» لمرة واحدة (ليس اشتراكاً). لا إعلانات على الويب. لا تُستخدَم بياناتك الشخصية والصحية للإعلانات، ولا نستخدم أدوات تتبّع خاصة بنا.'],
q5:['Hesabımı nasıl silerim?','How do I delete my account?','Как удалить аккаунт?','Wie lösche ich mein Konto?','كيف أحذف حسابي؟'],
a5:['Uygulamada Ayarlar → Hesap → “Hesabı sil”: hesabın, sunucudaki tüm verilerin ve paylaşımların anında silinir; cihazındaki veriler kalır. Uygulamaya giremiyorsan <a href="/hesap-sil">hesap silme</a> sayfasındaki adımları izle.','In the app: Settings → Account → “Delete account”. Your account, all server data and shares are deleted immediately; data on your device stays. If you can’t open the app, follow the steps on the <a href="/hesap-sil">account deletion</a> page.','В приложении: Настройки → Аккаунт → «Удалить аккаунт». Аккаунт, все данные на сервере и обмены удаляются сразу; данные на устройстве остаются. Если не можете открыть приложение, следуйте шагам на странице <a href="/hesap-sil">удаления аккаунта</a>.','In der App: Einstellungen → Konto → „Konto löschen“. Konto, alle Serverdaten und geteilte Pläne werden sofort gelöscht; die Daten auf deinem Gerät bleiben. Kommst du nicht in die App, folge den Schritten auf der Seite <a href="/hesap-sil">Konto löschen</a>.','في التطبيق: الإعدادات ← الحساب ← «حذف الحساب». يُحذف حسابك وكل بياناتك على الخادم ومشاركاتك فوراً؛ وتبقى بيانات جهازك. إن لم تستطع فتح التطبيق فاتبع الخطوات في صفحة <a href="/hesap-sil">حذف الحساب</a>.'],
q6:['Telefon uygulaması ile web sürümü aynı mı?','Is the phone app the same as the web version?','Приложение и веб-версия — одно и то же?','Sind Handy-App und Web-Version dasselbe?','هل تطبيق الهاتف هو إصدار الويب نفسه؟'],
a6:['Aynı uygulama. Hesap açarsan ikisi de aynı verileri gösterir. Hesapsız kullanıyorsan her biri kendi kaydını tutar; Ayarlar → Verileri taşı ile aktarabilirsin. Bildirimler telefon uygulamasında her zaman, web’de yalnız sayfa açıkken çalışır.','Same app. With an account both show the same data. Without one, each keeps its own records; you can move them with Settings → Transfer data. Notifications always work in the phone app, on the web only while the page is open.','Да. С аккаунтом обе показывают одни данные. Без аккаунта каждая хранит записи отдельно; перенести можно через Настройки → Перенос данных. Уведомления в приложении работают всегда, в браузере — только при открытой странице.','Dieselbe App. Mit Konto zeigen beide dieselben Daten. Ohne Konto führt jede eigene Aufzeichnungen; übertragen geht über Einstellungen → Daten übertragen. Benachrichtigungen kommen in der Handy-App immer, im Web nur bei geöffneter Seite.','نفس التطبيق. مع حساب يعرض كلاهما البيانات نفسها. بدون حساب يحتفظ كل منهما بسجلاته؛ يمكنك نقلها من الإعدادات ← نقل البيانات. الإشعارات تعمل دائماً في تطبيق الهاتف، وفي الويب فقط عندما تكون الصفحة مفتوحة.'],
kvkkT:['Gizlilik ve KVKK','Privacy','Конфиденциальность','Datenschutz','الخصوصية'],
kvkkS:['Kısaca: verilerin reklam için kullanılmaz, kendi takip aracımız yok (uygulamadaki seyrek reklamları Google AdMob gösterir). Hesapsızda verilerin yalnız cihazında; hesaplıda yalnız açık rızanla Almanya’daki (AB) sunucumuzda. Ayrıntılar aşağıdaki metinlerde.','In short: your data is never used for ads and we use no tracking tools of our own (the occasional ads in the app are served by Google AdMob). Without an account your data stays on your device; with one it is stored on our server in Germany (EU) only with your explicit consent. Details in the documents below.','Коротко: ваши данные не используются для рекламы, собственных трекеров нет (редкую рекламу в приложении показывает Google AdMob). Без аккаунта данные остаются на устройстве; с аккаунтом — на нашем сервере в Германии (ЕС), только с вашего явного согласия. Подробности в документах ниже.','Kurz: Deine Daten werden nie für Werbung genutzt, eigene Tracker gibt es nicht (die gelegentliche Werbung in der App liefert Google AdMob). Ohne Konto bleiben deine Daten auf dem Gerät; mit Konto liegen sie nur mit deiner ausdrücklichen Einwilligung auf unserem Server in Deutschland (EU). Details in den Dokumenten unten.','باختصار: لا تُستخدَم بياناتك للإعلانات ولا نستخدم أدوات تتبّع خاصة بنا (الإعلانات القليلة في التطبيق تعرضها Google AdMob). بدون حساب تبقى بياناتك على جهازك؛ ومع حساب تُخزَّن على خادمنا في ألمانيا (الاتحاد الأوروبي) بموافقتك الصريحة فقط. التفاصيل في المستندات أدناه.'],
saglik:['Sağlık uyarısı: öneriler genel bilgilendirme amaçlıdır, tıbbi teşhis ya da tedavi yerine geçmez. Hamilelik, kronik hastalık ya da ilaç kullanımında doktoruna veya diyetisyenine danış.','Health notice: suggestions are general information and not medical advice. If you are pregnant, have a chronic condition or take medication, consult your doctor or dietitian.','Важно: рекомендации носят общий характер и не заменяют консультацию врача. При беременности, хронических заболеваниях или приёме лекарств обратитесь к врачу или диетологу.','Gesundheitshinweis: Die Vorschläge sind allgemeine Informationen und ersetzen keine ärztliche Beratung. Bei Schwangerschaft, chronischer Krankheit oder Medikamenten Arzt oder Ernährungsberater fragen.','تنبيه صحي: الاقتراحات معلومات عامة ولا تغني عن استشارة الطبيب. في حالات الحمل أو الأمراض المزمنة أو تناول الأدوية استشر طبيبك أو أخصائي التغذية.'],

};
let dil = 'tr';
try { const q = new URLSearchParams(location.search).get('lang'); dil = DIL.includes(q) ? q : (localStorage.getItem('diyet_site_dil') || (navigator.language || 'tr').slice(0, 2)); } catch(e){}
if (!DIL.includes(dil)) dil = 'en';
const tx = (k, i) => (M[k][i] || M[k][0]).replace(/\{app\}/g, APP_AD);
function uygula(){
  const i = DIL.indexOf(dil);
  document.documentElement.lang = dil; document.documentElement.dir = dil === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = tx(el.dataset.t, i);
    if (el.dataset.list) el.innerHTML = v.split('|').map(s => '<li>' + s.replace(/</g, '&lt;') + '</li>').join('');
    else if (el.dataset.html) el.innerHTML = v; else el.textContent = v;
  });
  document.title = APP_AD + ' · ' + tx('badge', i);
  const meta = (sel, v) => { const m = document.querySelector(sel); if (m) m.setAttribute('content', v); };
  meta('meta[name="description"]', tx('metaDesc', i)); meta('meta[property="og:title"]', APP_AD + ' · ' + tx('badge', i)); meta('meta[property="og:description"]', tx('metaDesc', i));
  document.querySelectorAll('video[data-alt]').forEach(v => v.setAttribute('aria-label', tx(v.dataset.alt, i)));
  // Mağaza düğmeleri: MAGAZA dolu ise bağlantı, değilse "yakında"
  document.querySelectorAll('[data-store]').forEach(a => {
    const h = MAGAZA[a.dataset.store] || '#', soon = h === '#';
    a.href = h; a.target = soon ? '' : '_blank'; a.classList.toggle('soon', soon); a.setAttribute('aria-disabled', soon);
    const s = a.querySelector('small'); if (s) s.textContent = tx(a.dataset.store === 'play' ? 'stPlayS' : 'stIosS', i) + (soon ? ' · ' + tx('soon', i) : '');
  });
  // Hukuk sayfaları: seçili dilin çapasıyla aç (#tr|en|ru|de|ar)
  document.querySelectorAll('a[data-legal]').forEach(a => { a.href = a.getAttribute('href').split('#')[0] + '#' + dil; });
  document.getElementById('langs').innerHTML = DIL.map(k => `<button type="button" data-dil="${k}" aria-pressed="${k === dil}" title="${AD[k]}" lang="${k}">${k.toUpperCase()}</button>`).join('');
  try { localStorage.setItem('diyet_site_dil', dil); } catch(e){}
}
document.getElementById('langs').addEventListener('click', e => { const b = e.target.closest('[data-dil]'); if (b){ dil = b.dataset.dil; uygula(); } });
// Mağaza bağlantısı henüz yoksa Yükle bölümüne götür
document.addEventListener('click', e => {
  const a = e.target.closest('[data-store].soon'); if (!a) return;
  e.preventDefault(); sekme(a.dataset.store === 'ios' ? 'ios' : 'android'); document.getElementById('yukle').scrollIntoView({behavior: 'smooth'});
});
// Yükleme sekmeleri: cihaza göre doğru sekme açık gelir
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const android = /Android/.test(navigator.userAgent);
function sekme(ad){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === ad));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.panel === ad));
}
document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) sekme(t.dataset.tab); });
sekme(ios ? 'ios' : android ? 'android' : 'pc');
// Web sürümünü ana ekrana / masaüstüne ekleme (Chrome/Edge); olmazsa adımlara götür
let olay = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); olay = e; });
document.querySelectorAll('.js-install').forEach(b => b.addEventListener('click', () => {
  if (olay){ olay.prompt(); olay.userChoice.finally(() => { olay = null; }); return; }
  sekme('pc'); document.getElementById('yukle').scrollIntoView({behavior: 'smooth'});
}));
if (matchMedia('(display-mode: standalone)').matches) location.replace('/app/');
// Kullanım videosu: ekrandayken oynar, dışındayken durur; hareket azaltma açıksa kendiliğinden oynamaz
document.querySelectorAll('.phone.vid').forEach(k => {
  const v = k.querySelector('video'), b = k.querySelector('.vbtn');
  let elle = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const durum = () => { k.classList.toggle('dur', v.paused); b.setAttribute('aria-label', v.paused ? 'Videoyu oynat' : 'Videoyu duraklat'); };
  const oynat = () => v.play().catch(() => {});
  v.addEventListener('play', durum); v.addEventListener('pause', durum);
  b.addEventListener('click', () => { if (v.paused) { elle = false; oynat(); } else { elle = true; v.pause(); } });
  if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { if (!elle) oynat(); } else v.pause(); }), {threshold: 0.3}).observe(v);
  else if (!elle) oynat();
});
uygula();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
