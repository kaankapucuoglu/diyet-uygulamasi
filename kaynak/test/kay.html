<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0"><iframe id="f" src="../../index.html" style="width:390px;height:844px;border:0"></iframe><script>
// Öğün gizle/göster kaydırma: gizleyince başlık yerinde kalmalı, gösterince öğün baştan görünmeli
const f=document.getElementById('f');const out=[];const L=x=>out.push(x);const bekle=ms=>new Promise(r=>setTimeout(r,ms));
setTimeout(async()=>{const w=f.contentWindow,d=w.document;
try{
  w.eval(`W={...kopya(D.profil),dil:'tr',ad:'Ayşe',cins:'k',hamile:false,yas:32,boy:166,kilo:72,hedef:'ver',hedefKilo:64,hiz:0.5,aktivite:2,odaklar:[],haric:[],alerjiler:[],alerjiVar:'yok',alerjiAra:'',saatler:{kahvalti:'08:00',ogle:'12:30',aksam:'19:00'}};wBitir();D.ayar.hepsiKapali=false;D.ayar.kapali={};ciz()`);
  await bekle(300);
  for(const i of [1,3,4]){
    const kart=()=>d.querySelectorAll('#ogunler .meal')[i];
    w.scrollTo(0,kart().getBoundingClientRect().top+w.scrollY-200);await bekle(100);
    const y0=kart().getBoundingClientRect().top;kart().querySelector('.tog-btn').click();await bekle(100);
    L('  dbg sy '+w.scrollY+' ih '+w.innerHeight+' sh '+d.documentElement.scrollHeight+' min '+d.getElementById('ogunler').style.minHeight+' oh '+d.getElementById('ogunler').offsetHeight);
    L('ogun '+i+' gizle: once '+Math.round(y0)+' sonra '+Math.round(kart().getBoundingClientRect().top));
    kart().querySelector('.tog-btn').click();await bekle(900);
    L('ogun '+i+' goster: ust '+Math.round(kart().getBoundingClientRect().top));
  }
  w.scrollTo(0,d.getElementById('ogunArac').getBoundingClientRect().top+w.scrollY-300);await bekle(100);
  const a0=d.getElementById('ogunArac').getBoundingClientRect().top;d.querySelector('[data-togall]').click();await bekle(100);
  L('hepsini gizle: once '+Math.round(a0)+' sonra '+Math.round(d.getElementById('ogunArac').getBoundingClientRect().top));
  d.querySelector('[data-togall]').click();await bekle(900);
  L('hepsini goster: ilk ogun ust '+Math.round(d.querySelector('#ogunler .meal').getBoundingClientRect().top));
}catch(e){L('HATA '+e.stack)}
fetch('/SONUC_kay',{method:'POST',body:out.join('\n')});},1500);
</script></body></html>
