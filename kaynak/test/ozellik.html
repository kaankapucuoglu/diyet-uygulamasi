  const cips=[...d2.querySelectorAll('#cipSatir .cip')];ok(cips.length>=3&&cips.every(c=>c.getBoundingClientRect().right<=w2.innerWidth+1),'360 px: '+cips.length+' çip (hamile, regl, antrenman) ekran içinde, alt alta kayabiliyor');
  const btns=[...d2.querySelectorAll('#ozet .water-btns .btn, .top-btns .tool-btn')];ok(btns.every(x=>x.getBoundingClientRect().right<=w2.innerWidth+1&&x.getBoundingClientRect().left>=-1),'360 px: su ve üst düğmeler ekran içinde');
  const kartlar=[...d2.querySelectorAll('#ozet .card')];ok(kartlar.length>=4&&kartlar.every(k=>Math.abs(k.getBoundingClientRect().left-kartlar[0].getBoundingClientRect().left)<1&&Math.abs(k.getBoundingClientRect().width-kartlar[0].getBoundingClientRect().width)<1),'360 px: özet kartları (yenen, su, regl bandı, antrenman) aynı hizada: '+kartlar.length);
  ok(!!d2.querySelector('#ozet .regl-bant')&&!!d2.querySelector('#ozet .ant-kart'),'360 px: regl bandı + antrenman kartı var');
  ok(!!d2.querySelector('#ozet .ant-kart')&&/Cardio|Training|Ruhetag/.test(d2.querySelector('#ozet .ant-kart').textContent),'DE: antrenman kartı Almanca · '+d2.querySelector('#ozet .ant-kart .bant-bas').textContent);
}catch(e){L('HATA '+e.stack)}
fetch('/SONUC_ozellik',{method:'POST',body:out.join('\n')});},1500);
